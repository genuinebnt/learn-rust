slug = "longest-substring-without-repeating"
title = "Longest substring without repeating characters"
mode = "write"
level = "medium"
stage = "windows"
order = 11
status = "ready"
tags = ["sliding window", "Blind 75"]
teaches = [
  "A window that jumps its left edge past the last repeat.",
  "`[Option<usize>; 256]` as a last-seen table for bytes.",
]
constraints = ["0 ≤ s.len() ≤ 2·10⁵"]
follow_up = "How would you return the substring itself as a `&str`?"
related = ["S2"]

[[examples]]
input = "s = \"abcabcbb\""
output = "3"

[[hints]]
kind = "approach"
text = "Keep a window with no repeats. When a byte repeats inside it, move the start past the earlier copy."

[[hints]]
kind = "edge case"
text = "In \"abba\", the second a's earlier copy is already outside the window."

[solution]
explanation = "Only jumping `start` forward (the `prev >= start` check) keeps the window valid for inputs like \"abba\"."
time = "O(n)"
space = "O(1)"
