slug = "longest-increasing-subsequence"
title = "Longest increasing subsequence"
mode = "write"
level = "medium"
stage = "1d-choices"
order = 15
status = "ready"
tags = ["1-D DP", "O(n²)", "Blind 75"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "Apple", "Bloomberg", "Uber"]
teaches = [
  "The \"ends at i\" state: the best subsequence that finishes on element i.",
  "An O(n²) table first; the next problem makes it O(n log n).",
]
constraints = ["0 ≤ nums.len() ≤ 2500", "nums[i] fits in an i32"]
follow_up = "How would you reconstruct one longest subsequence, not just its length?"
related = ["D4"]

[[examples]]
input = "nums = [10, 9, 2, 5, 3, 7, 101, 18]"
output = "4 ([2, 3, 7, 18])"

[[hints]]
kind = "approach"
text = "Let ends_at[i] be the longest increasing subsequence that ends on nums[i]: 1 plus the best ends_at[j] over j < i with nums[j] < nums[i]."

[[hints]]
kind = "rust"
text = "`vec![1usize; n]` seeds every element as a subsequence of its own; `into_iter().max().unwrap_or(0)` covers the empty slice."

[[hints]]
kind = "edge case"
text = "Strictly increasing: equal values don't extend each other, so [7, 7, 7] → 1."

[solution]
explanation = "The answer is the best ends_at over all positions, since the subsequence can end anywhere. Each i scans every j before it."
time = "O(n²)"
space = "O(n)"
