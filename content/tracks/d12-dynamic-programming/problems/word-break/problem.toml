slug = "word-break"
title = "Word break"
mode = "write"
level = "medium"
stage = "1d-choices"
order = 13
status = "ready"
tags = ["1-D DP", "HashSet", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Apple", "Microsoft", "Bloomberg", "Uber", "Adobe"]
teaches = [
  "A boolean table over prefixes: `ok[end]` is true if some word ends at `end` after an `ok` prefix.",
  "Slicing bytes (`&s.as_bytes()[a..b]`) so non-ASCII text never splits a character.",
]
constraints = ["0 ≤ s.len() ≤ 300 bytes", "0 ≤ words.len() ≤ 1000", "1 ≤ words[i].len() ≤ 20 bytes"]
follow_up = "How would you return every valid sentence (Word break II), and how big can that output get?"
related = ["D10", "S2", "S4"]

[[examples]]
input = "s = \"applepenapple\", words = [\"apple\", \"pen\"]"
output = "true (apple pen apple)"

[[examples]]
input = "s = \"catsandog\", words = [\"cats\", \"dog\", \"sand\", \"and\", \"cat\"]"
output = "false"

[[hints]]
kind = "approach"
text = "ok[end] is true when some start < end has ok[start] and s[start..end] is a word. ok[0] is true: the empty prefix needs no words."

[[hints]]
kind = "rust"
text = "Put the words in a `HashSet<&[u8]>` and slice `s.as_bytes()`. Only look back as far as the longest word."

[[hints]]
kind = "edge case"
text = "`&s[a..b]` on a `&str` panics when a or b falls inside a multi-byte character, like the middle of \"日\". Byte slices never panic."

[solution]
explanation = "Each end position checks at most `longest` start positions, and each check hashes a slice of at most `longest` bytes. Taking the longest matching word first fails on \"cars\" with [\"car\", \"ca\", \"rs\"]."
time = "O(n × L²) for L = longest word"
space = "O(n + total word length)"
