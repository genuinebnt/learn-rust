slug = "concatenated-words"
title = "Concatenated words"
mode = "write"
level = "hard"
stage = "hard-tries-strings"
order = 22
status = "ready"
tags = ["trie", "DP", "word break"]
companies = ["Amazon", "Google", "Uber"]
teaches = [
  "Word break on every word: `ok[i]` says the first i letters split into dictionary words; a trie walk from each reachable i finds the next pieces.",
  "The word itself is in the dictionary, so forbid the one piece that spans the whole word.",
]
constraints = ["0 ≤ words.len() ≤ 10⁴", "0 ≤ words[i].len() ≤ 30", "total length ≤ 10⁵"]
follow_up = "Return, for each concatenated word, one way to split it into pieces."
related = ["D12", "D11"]

[[examples]]
input = "words = [\"cat\", \"cats\", \"catsdogcats\", \"dog\", \"dogcatsdog\", \"hippopotamuses\", \"rat\", \"ratcatdogcat\"]"
output = "[\"catsdogcats\", \"dogcatsdog\", \"ratcatdogcat\"]"

[[examples]]
input = "words = [\"cat\", \"dog\", \"catdog\"]"
output = "[\"catdog\"]"

[[hints]]
kind = "approach"
text = "For each word, run word break: `ok[i]` is true when the first i letters split into words. From every reachable i, walk a trie of all words along the letters after i and mark each word end you pass."

[[hints]]
kind = "rust"
text = "Build one trie of the non-empty words, then `words.iter().copied().filter(..).collect()` returns the answers as the input's own `&'a str` slices, in order."

[[hints]]
kind = "edge case"
text = "Every word is in the dictionary, so a plain word break says yes to all of them. Skip the piece that starts at 0 and ends at the word's end. Without the `ok` table, a word like `aaaa…ab` is tried in exponentially many ways."

[solution]
explanation = "Each word costs O(L²) trie steps at worst (a walk of up to L from each of L positions), so the total is O(Σ L²) with L ≤ 30. The `ok` table is the memo: a recursive search without it re-solves the same suffix for every way of reaching it. Sorting by length and testing each word against a trie of shorter words only is the other classic way to rule out the one-piece split."
time = "O(Σ L²)"
space = "O(total letters × 26)"
