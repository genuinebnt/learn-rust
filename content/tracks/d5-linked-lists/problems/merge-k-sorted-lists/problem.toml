[[hints]]
kind = "approach"
text = "Keep the front of every list in a min-heap; repeatedly take the smallest and push that list's next front."

[[hints]]
kind = "rust"
text = "Put `(value, list index)` in the heap, not the boxed node: the nodes stay in `lists`, which avoids ordering `Box<ListNode>`."

[[hints]]
kind = "rust"
text = "`BinaryHeap` is a max-heap; wrap entries in `Reverse` for smallest-first."

[solution]
explanation = "The heap stores small `Copy` keys and the lists keep ownership of the nodes, so there's no need to implement `Ord` for `ListNode`."
time = "O(N log k)"
space = "O(k)"
