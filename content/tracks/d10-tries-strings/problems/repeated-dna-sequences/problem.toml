slug = "repeated-dna-sequences"
title = "Repeated DNA sequences"
mode = "write"
level = "medium"
stage = "string-algorithms"
order = 17
status = "ready"
tags = ["rolling hash", "HashMap", "bits"]
companies = ["Amazon", "Google", "LinkedIn"]
teaches = [
  "A rolling hash updates in O(1) per step: drop the outgoing letter's weight, multiply by the base, add the new letter.",
  "With 4 letters and k ≤ 32, a base-4 key fits in a `u64` exactly, so equal keys mean equal windows.",
]
constraints = ["0 ≤ s.len() ≤ 10⁵, letters A, C, G, T only", "1 ≤ k ≤ 32"]
follow_up = "Allow any k up to 10⁵. Which hash would you use, and how do you stay correct when two windows share a hash?"
related = ["S4", "D13"]

[[examples]]
input = "s = \"AAAAACCCCCAAAAACCCCCCAAAAAGGGTTT\", k = 10"
output = "[\"AAAAACCCCC\", \"CCCCCAAAAA\"]"

[[examples]]
input = "s = \"AAAAAAAAAAAAA\", k = 10"
output = "[\"AAAAAAAAAA\"]"

[[hints]]
kind = "approach"
text = "Give each letter a 2-bit code and treat the window as a base-4 number. Sliding the window by one drops the first letter's term, shifts everything up one place, and adds the new letter: O(1) per step. Count keys in a `HashMap`."

[[hints]]
kind = "rust"
text = "Remember the first start of each key (`entry(key).or_insert((start, 0))`), then sort the repeated ones by start and slice `&s[i..i + k]`. For `k = 32`, `1u64 << 64` overflows (a panic in a debug build), so don't build a mask that way."

[[hints]]
kind = "edge case"
text = "A sequence seen three times is still reported once, and the order is by first appearance, not by when it first repeats."

[solution]
explanation = "Each step updates the key in O(1), so the scan is O(n) plus hashing. With 4 letters, a window of k ≤ 32 letters is a base-4 number below 4^32 = 2^64: a perfect hash, no collisions to check. Hashing the `&str` windows directly also works at O(n·k). For longer windows or bigger alphabets you'd use a polynomial hash modulo 2^64 (`wrapping_mul`), and then equal hashes no longer prove equal windows: compare the slices on a hit. Thue–Morse strings make every base collide modulo 2^64."
time = "O(n)"
space = "O(n)"
