[[hints]]
kind = "approach"
text = "`?` on `Err(e)` returns `Err(From::from(e))` from the whole function."

[[hints]]
kind = "rust"
text = "Inside `macro_rules!`, `return` returns from the function the macro is used in. Name the enum as `$crate::MyResult` so it resolves anywhere."

[solution]
explanation = "The `From::from` call is what lets `?` convert a library error into your application's error type. A `macro_rules!` body is expanded in place, so `return` leaves the caller's function, and `$e` is evaluated exactly once because the macro binds it with `match`. Syntax to remember: `#[macro_export] macro_rules! try_my { ($e:expr) => { match $e { ... } }; }`, `$crate::MyResult`, `::core::convert::From::from(e)`, `res.is_ok_and(|v| ..)`, `res.ok()` / `res.err()`."
time = "O(1)"
space = "O(1)"
