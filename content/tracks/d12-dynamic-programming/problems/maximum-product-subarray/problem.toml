slug = "maximum-product-subarray"
title = "Maximum product subarray"
mode = "write"
level = "medium"
stage = "1d-choices"
order = 14
status = "ready"
tags = ["Kadane", "Blind 75"]
companies = ["Amazon", "Google", "Meta", "Apple", "Microsoft", "LinkedIn", "Bloomberg"]
teaches = [
  "Carrying the largest and the smallest product ending here: a negative number swaps them.",
  "`Option<i64>` for the empty slice, `i64` for the products.",
]
constraints = ["0 ≤ nums.len() ≤ 2·10⁵", "-10 ≤ nums[i] ≤ 10", "the product of every subarray fits in an i64"]
follow_up = "How would you return the subarray's bounds, not just the product?"
related = ["D2", "D1"]

[[examples]]
input = "nums = [2, 3, -2, 4]"
output = "Some(6) ([2, 3])"

[[examples]]
input = "nums = [-2, 3, -4]"
output = "Some(24) (the whole slice)"

[[hints]]
kind = "approach"
text = "Keep the largest and the smallest product of a subarray ending here. Multiplying by a negative turns the smallest into the largest."

[[hints]]
kind = "rust"
text = "`let (&first, rest) = nums.split_first()?;` handles the empty slice and seeds the three running values."

[[hints]]
kind = "edge case"
text = "A single negative element is its own best answer, so don't start `best` at 0."

[solution]
explanation = "It is Kadane's algorithm with two running values: at each element the new extremes are among x, hi·x and lo·x. Zeros reset both naturally."
time = "O(n)"
space = "O(1)"
