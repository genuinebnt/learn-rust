slug = "max-xor-bit-trie"
title = "Maximum XOR of two numbers (bit trie)"
mode = "write"
level = "hard"
stage = "hard-tries-strings"
order = 20
status = "ready"
tags = ["trie", "bits", "arena"]
companies = ["Amazon", "Google", "Microsoft"]
teaches = [
  "A binary trie over the bits, highest first, answers \"which stored number differs most from x\" in 32 steps.",
  "Greedy works bit by bit: one higher bit outweighs all the lower bits together.",
]
constraints = ["0 ≤ nums.len() ≤ 2·10⁵", "0 ≤ nums[i] ≤ u32::MAX"]
follow_up = "Answer queries (x, limit): the maximum x ^ nums[j] over nums[j] ≤ limit. How does sorting the queries help?"
related = ["D13"]

[[examples]]
input = "nums = [3, 10, 5, 25, 2, 8]"
output = "28 (5 ^ 25)"

[[examples]]
input = "nums = [14, 70, 53, 83, 49, 91, 36, 80, 92, 51, 66, 70]"
output = "127"

[[hints]]
kind = "approach"
text = "Insert the numbers into a trie keyed by their bits, highest bit first. For each number, walk the trie choosing the opposite bit whenever that child exists: each choice sets that bit of the XOR, and a higher bit is worth more than all lower bits combined."

[[hints]]
kind = "rust"
text = "A `Vec<[u32; 2]>` arena is a compact trie: node `i` has children `trie[i][0]` and `trie[i][1]`, with 0 meaning none (the root is never anyone's child). `x >> bit & 1` reads a bit."

[[hints]]
kind = "edge case"
text = "LeetCode's inputs stop below 2³¹, so solutions often walk 31 bits. With `u32` input the top bit matters: walk bits 31 down to 0."

[solution]
explanation = "Each number costs 32 steps to insert and 32 to query, so the whole thing is O(32 · n). Querying before inserting means each pair is considered once. The other O(32 · n) answer builds the result bit by bit, checking with a `HashSet` of prefixes whether some pair can reach the candidate. Trying every pair is O(n²)."
time = "O(32 · n)"
space = "O(32 · n) trie nodes"
