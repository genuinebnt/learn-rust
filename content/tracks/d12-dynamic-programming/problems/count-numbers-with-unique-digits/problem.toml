slug = "count-numbers-with-unique-digits"
title = "Count numbers with unique digits"
mode = "write"
level = "medium"
stage = "bitmasks-digits"
order = 46
status = "ready"
tags = ["counting", "digits"]
companies = ["Google", "Amazon", "Microsoft"]
teaches = [
  "Counting by position: how many choices the first digit has, then the second, and so on.",
  "Noticing when a count stops growing (no number has 11 distinct digits).",
]
constraints = ["0 ≤ n ≤ 20"]
follow_up = "How would you count the numbers with unique digits in [1, N] for an arbitrary N (Count special integers)?"
related = ["D13"]

[[examples]]
input = "n = 2"
output = "91 (every number below 100 except 11, 22, …, 99)"

[[examples]]
input = "n = 0"
output = "1 (just 0)"

[[hints]]
kind = "approach"
text = "Count by length. One-digit numbers: 10 (including 0). A k-digit number: 9 choices for the first digit (not 0), then 9, then 8, … for the others."

[[hints]]
kind = "rust"
text = "Keep a running product in a `u64` and add it for each length from 1 to n."

[[hints]]
kind = "edge case"
text = "An 11-digit number must repeat a digit (there are only 10), so the answer stops growing at n = 10. n = 0 means just the number 0."

[solution]
explanation = "This is the counting rule of digit DP without the upper bound: each position multiplies the choices left. The next problem adds the bound, which is where digit DP proper starts."
time = "O(min(n, 10))"
space = "O(1)"
