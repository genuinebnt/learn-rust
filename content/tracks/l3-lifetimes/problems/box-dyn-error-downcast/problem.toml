[[hints]]
kind = "rust"
text = "`downcast_ref::<T>()` exists on `dyn Error + 'static`, which is why the helpers take `&(dyn Error + 'static)`. `&*boxed` gets one from the `Box`."

[solution]
explanation = "`Box<dyn Error + Send + Sync>` is the usual type-erased error: any error type can go in through `?`, and it can cross threads. Erasing the type is why `'static` matters: `downcast_ref` needs `T: 'static` (it compares `TypeId`s), so it's defined on `dyn Error + 'static`, and `source()` returns `&(dyn Error + 'static)` so callers can keep downcasting along the chain. Wrapping a lower-level error as the `source` keeps both the context (the line) and the cause; walking `source()` gives the chain and its root. The `'static` in `source`'s return type is the object-lifetime bound of the *error type* (it has no short borrows), not the lifetime of the reference, which is tied to `&self`. It even counts for elision: `fn root_cause(err: &(dyn Error + 'static)) -> &(dyn Error + 'static)` is E0106, because the input has two lifetimes (the reference's and the explicit `'static`), so `root_cause` names `'e`.\n\nSyntax to remember: `fn source(&self) -> Option<&(dyn Error + 'static)> { self.source.as_ref().map(|e| e as _) }` · `err.downcast_ref::<ConfigError>()` · `while let Some(next) = cur.source() { cur = next; }`."
time = "O(n)"
space = "O(depth) for chain"
