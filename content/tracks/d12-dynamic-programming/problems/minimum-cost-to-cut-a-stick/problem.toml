slug = "minimum-cost-to-cut-a-stick"
title = "Minimum cost to cut a stick"
mode = "write"
level = "hard"
stage = "intervals-games"
order = 44
status = "ready"
tags = ["interval DP", "dp[i][j] by length"]
companies = ["Google", "Amazon", "Microsoft", "Meta"]
teaches = [
  "Interval DP over the cut points: pick which cut happens first inside an interval.",
  "Sorting the points and adding both ends of the stick as sentinels.",
]
constraints = ["2 ≤ n ≤ 10⁶", "0 ≤ cuts.len() ≤ 200", "cuts are distinct and 0 < cuts[i] < n"]
follow_up = "This is the same shape as optimal BST and matrix-chain multiplication. Can you name the choice and the cost in each?"
related = ["D8"]

[[examples]]
input = "n = 7, cuts = [1, 3, 4, 5]"
output = "16 (cut at 3, then 5, then 1, then 4: 7 + 4 + 3 + 2)"

[[hints]]
kind = "approach"
text = "Sort the cuts and add 0 and n. For the piece between points i and j, the first cut k costs pts[j] - pts[i] and leaves the pieces (i, k) and (k, j)."

[[hints]]
kind = "rust"
text = "`cost[i][j]` in a `Vec<Vec<u64>>`, filled by increasing `len = j - i` so both halves are ready; `(i + 1..j).map(..).min().unwrap()` picks the best first cut."

[[hints]]
kind = "edge case"
text = "The input order is not the cutting order, and it isn't sorted. Cutting nearest the middle first isn't always optimal either."

[solution]
explanation = "Once a cut is made, the two sides never interact, so each piece between two chosen points is an independent subproblem. There are O(c²) pieces and each tries O(c) first cuts."
time = "O(c³) for c cuts"
space = "O(c²)"
