slug = "best-time-to-buy-and-sell-stock-ii"
title = "Best time to buy and sell stock II"
mode = "write"
level = "easy"
stage = "first-greedy"
order = 6
status = "ready"
tags = ["greedy", "windows"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "A total of many trades equals the sum of every single-day rise.",
  "Widen to `u64` before summing `u32` values.",
]
constraints = ["0 ≤ prices.len() ≤ 2·10⁵", "prices[i] is any u32"]
follow_up = "What changes if each sale costs a fixed fee? (Hint: the greedy stops working; a two-state DP does.)"
related = ["D12", "D2"]

[[examples]]
input = "prices = [7, 1, 5, 3, 6, 4]"
output = "7"

[[examples]]
input = "prices = [1, 2, 3, 4, 5]"
output = "4"

[[hints]]
kind = "approach"
text = "Any trade from day i to day j earns the same as the sum of the day-to-day changes between them. Keep only the rises."

[[hints]]
kind = "rust"
text = "`prices.windows(2).map(|w| w[1].saturating_sub(w[0]) as u64).sum()` is the whole solution."

[solution]
explanation = "Summing every positive day-to-day change collects each upward move exactly once, which is the most any set of non-overlapping trades can collect."
time = "O(n)"
space = "O(1)"
