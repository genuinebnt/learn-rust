[[hints]]
kind = "rust"
text = "Elision rule 3: in a method with `&self`, every elided output lifetime is `self`'s. The other inputs get their own lifetimes."

[[hints]]
kind = "rust"
text = "`self.tags.iter().map(String::as_str)` gives `&str`s borrowed from `self`."

[solution]
explanation = "Because the output borrows only from `self`, `prefix` can be a temporary. Writing `<'a>(&'a self, prefix: &'a str)` would tie them together and break the first test."
time = "O(n)"
space = "O(1)"
