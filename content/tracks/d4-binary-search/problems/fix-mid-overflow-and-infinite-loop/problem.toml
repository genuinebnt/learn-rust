slug = "fix-mid-overflow-and-infinite-loop"
title = "Fix: mid overflow and an infinite loop"
mode = "fix"
level = "hard"
stage = "hard-searches"
order = 14
status = "ready"
tags = ["overflow", "rounding"]
teaches = [
  "Overflow-free midpoints.",
  "Rounding toward the side that moves.",
]
follow_up = "Rewrite it with a half-open range. Which rounding bugs disappear?"

[[hints]]
kind = "rust"
text = "`lo + hi` overflows `u32` once both are past 2³¹. `lo + (hi - lo) / 2` can't."

[[hints]]
kind = "approach"
text = "With `lo = mid`, `mid` must round up, or `lo..=lo+1` never shrinks when `pred(lo+1)` is true."

[[hints]]
kind = "rust"
text = "`(hi - lo).div_ceil(2)` rounds up without the `+ 1` that would overflow when the range is `0..=u32::MAX`."

[solution]
explanation = "The midpoint must round toward the side that moves: here `lo = mid`, so round up. `div_ceil` gives that without another overflow."
time = "O(log range)"
space = "O(1)"

[rules]
forbid_methods = ["checked_add", "wrapping_add", "saturating_add"]
forbid_types = ["u64", "u128", "i64"]
max_changed_lines = 1
