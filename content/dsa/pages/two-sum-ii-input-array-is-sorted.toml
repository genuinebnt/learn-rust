intuition = """
The array is **sorted**, so you can do better than a hash map: put one pointer at the smallest value and one at the largest. If their sum is too big, the right value can't be part of any answer with the current left value, so move `right` down. If it's too small, move `left` up. Each step discards one candidate, so it ends in at most n steps with no extra memory.

The problem asks for **1-indexed** positions, which is the only place a bug usually hides.
"""
tips = [
    "Return `[left + 1, right + 1]`: the problem is 1-indexed.",
    "The reasoning for moving a pointer is the interview answer: \"if the sum is too big, `right` is too large for *every* remaining `left`\".",
    "A hash map also works (as in Two Sum) but ignores the sorted order and uses O(n) space. Use it only if asked.",
    "The problem guarantees exactly one solution, so you don't need a \"not found\" case, but returning `[]` at the end is harmless.",
]

[[approaches]]
name = "Two pointers on a sorted array"
label = "two pointers"
idea = "Compare the sum of the two ends with the target and move the end that is on the wrong side."
time = "O(n)"
space = "O(1)"
note = "Every iteration moves a pointer inward, so at most n iterations."
code = '''class Solution:
    def twoSum(self, numbers: list[int], target: int) -> list[int]:
        left, right = 0, len(numbers) - 1
        while left < right:
            total = numbers[left] + numbers[right]
            if total == target:
                return [left + 1, right + 1]
            if total < target:
                left += 1
            else:
                right -= 1
        return []
'''

[[approaches]]
name = "Binary search for the partner"
label = "binary search"
idea = "For each number, binary-search the rest of the array for `target - number`. Correct, but slower than the pointers."
time = "O(n log n)"
space = "O(1)"
note = "n binary searches of O(log n) each."
code = '''from bisect import bisect_left


class Solution:
    def twoSum(self, numbers: list[int], target: int) -> list[int]:
        for i, x in enumerate(numbers):
            j = bisect_left(numbers, target - x, i + 1)
            if j < len(numbers) and numbers[j] == target - x:
                return [i + 1, j + 1]
        return []
'''
