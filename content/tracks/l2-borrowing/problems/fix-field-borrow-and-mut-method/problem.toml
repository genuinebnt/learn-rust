slug = "fix-field-borrow-and-mut-method"
title = "Fix: borrow a field while calling a &mut method"
mode = "fix"
level = "medium"
stage = "split-borrows"
order = 25
status = "ready"
tags = ["E0502"]
teaches = [
  "A `&mut self` method borrows the whole struct; field paths borrow one field.",
]
follow_up = "How else could `save_snapshot` be written so it doesn't need all of `self`?"
related = ["L2"]

[[hints]]
kind = "rust"
text = "`save_snapshot(&mut self, ..)` needs all of `self` while `before` borrows `self.text`."

[[hints]]
kind = "rust"
text = "Touch the fields directly: `self.history` and `self.text` are disjoint."

[solution]
explanation = "Field paths borrow one field each, so reading `self.text` while pushing to `self.history` is fine inside one function."
time = "O(n)"
space = "O(n)"

[rules]
forbid_methods = ["clone"]
