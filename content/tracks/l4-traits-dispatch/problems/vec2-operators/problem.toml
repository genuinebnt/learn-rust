[[hints]]
kind = "rust"
text = "Each binary operator is a trait with a right-hand type and an `Output`: `impl Mul<i64> for Vec2 { type Output = Vec2; .. }`, and the dot product is `impl Mul for Vec2 { type Output = i64; .. }`. For `3 * v`, implement on the left type: `impl Mul<Vec2> for i64`."

[[hints]]
kind = "rust"
text = "`.sum()` needs `impl Sum for Vec2` for owned items and `impl<'a> Sum<&'a Vec2> for Vec2` for borrowed ones."

[solution]
explanation = "Operators are traits in `std::ops`; the right-hand side is a type parameter (default `Self`) and the result an associated type, so `Vec2 * i64` and `Vec2 * Vec2` can return different things. `impl Mul<Vec2> for i64` is allowed by coherence because a local type appears in it. `+=` is a separate trait (`AddAssign`), and `Iterator::sum` goes through `Sum<A>`.\n\nSyntax: `impl Mul<i64> for Vec2 { type Output = Vec2; fn mul(self, k: i64) -> Vec2 { .. } }` · `impl Neg for Vec2 { type Output = Vec2; fn neg(self) -> Vec2 }` · `impl AddAssign for Vec2 { fn add_assign(&mut self, o: Vec2) }` · `impl<'a> Sum<&'a Vec2> for Vec2 { fn sum<I: Iterator<Item = &'a Vec2>>(iter: I) -> Vec2 }`."
time = "O(1) per operation"
space = "O(1)"
