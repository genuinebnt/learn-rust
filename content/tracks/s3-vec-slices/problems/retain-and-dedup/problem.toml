slug = "retain-and-dedup"
title = "retain_mut, dedup_by and dedup_by_key"
mode = "write"
level = "easy"
stage = "use-it"
order = 2
status = "ready"
tags = ["retain_mut", "dedup_by", "dedup_by_key"]
teaches = [
  "`retain_mut` updates and filters in one pass; `retain`'s closure only gets `&T`.",
  "`dedup_by(|a, b| …)` gets the element that may be removed as `a` and the one that stays as `b`: merge into `b`.",
  "`dedup_by_key` and every `dedup` only look at neighbours; equal values further apart are kept.",
]
follow_up = "`dedup_by_key(|e| e.name.to_lowercase())` allocates twice per comparison. How would you write it with `dedup_by` and no allocation?"
related = ["D1"]

[[examples]]
input = "tick on [Job { id: 1, retries_left: 2 }, Job { id: 2, retries_left: 1 }]"
output = "[Job { id: 1, retries_left: 1 }]"

[[examples]]
input = "merge_runs on a×2, a×3, b×1, a×1"
output = "a×5, b×1, a×1"

[[examples]]
input = "first_per_minute on [(0, \"a\"), (59, \"b\"), (60, \"c\")]"
output = "[(0, \"a\"), (60, \"c\")]"

[[hints]]
kind = "rust"
text = "`jobs.retain_mut(|job| { job.retries_left = …; job.retries_left > 0 })` changes each job and decides whether to keep it in the same call."

[[hints]]
kind = "rust"
text = "In `v.dedup_by(|a, b| …)`, `b` is the earlier element that stays and `a` the later one that's removed if you return `true`. Add `a`'s count into `b`."

[[hints]]
kind = "edge case"
text = "Events in the same minute that aren't next to each other are all kept: `dedup` only compares neighbours."

[solution]
explanation = "All three are single in-place passes that shift the survivors down, with no second `Vec`. `retain` gives the closure `&T` (historically so it could be used on shared data); `retain_mut` gives `&mut T`, so updating and filtering is one pass instead of `iter_mut` plus `retain`. The `dedup_by` argument order is the classic trap: the closure sees `(current, previous_kept)`, so merging into the first argument silently loses the counts when it's dropped. Syntax to remember: `v.retain(|x| …)`, `v.retain_mut(|x| …)`, `v.dedup()`, `v.dedup_by_key(|x| key(x))`, `v.dedup_by(|a, b| same(a, b))` (a = later, b = kept), `n.saturating_sub(1)`."
time = "O(n)"
space = "O(1)"
