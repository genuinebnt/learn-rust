slug = "regular-expression-matching"
title = "Regular expression matching"
mode = "write"
level = "hard"
stage = "hard-strings"
order = 53
status = "ready"
tags = ["2-D DP", "chars"]
companies = ["Google", "Meta", "Amazon", "Microsoft", "Apple", "Uber", "Airbnb"]
teaches = [
  "Reading the pattern in units: a character, or a character with `*` after it.",
  "`ok[i][j]` over suffixes, filled from the back so every lookup is ready.",
]
constraints = ["0 ≤ s.chars().count(), p.chars().count() ≤ 2000", "p is well formed"]
follow_up = "How would you add `+` (one or more)? Could you rewrite it with two rolling rows?"
related = ["D11"]

[[examples]]
input = "s = \"aa\", p = \"a*\""
output = "true"

[[examples]]
input = "s = \"aab\", p = \"c*a*b\""
output = "true (c* matches nothing)"

[[examples]]
input = "s = \"mississippi\", p = \"mis*is*p*.\""
output = "false"

[[hints]]
kind = "approach"
text = "Look at the pattern one unit at a time from position j. If p[j + 1] is '*', either skip the unit (j + 2) or, when p[j] matches s[i], use it once and stay at j. Otherwise p[j] must match s[i] and both move on."

[[hints]]
kind = "rust"
text = "Collect `chars()` into `Vec`s, then fill `ok: Vec<Vec<bool>>` of size (n + 1) × (m + 1) from the bottom-right: `ok[i][j]` needs `ok[i][j + 2]`, `ok[i + 1][j]` and `ok[i + 1][j + 1]`."

[[hints]]
kind = "edge case"
text = "`x*` can match zero copies, so an empty s can still match \"a*b*\". Row n (s used up) isn't all false."

[solution]
explanation = "The plain recursion re-solves the same (i, j) suffix pair many times, exponentially often with patterns like a*a*a*…; there are only (n + 1)(m + 1) pairs, each O(1)."
time = "O(n · m)"
space = "O(n · m), or O(m) with two rows"
