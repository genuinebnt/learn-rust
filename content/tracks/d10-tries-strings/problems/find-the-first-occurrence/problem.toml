slug = "find-the-first-occurrence"
title = "Find the first occurrence (KMP)"
mode = "write"
level = "medium"
stage = "string-algorithms"
order = 12
status = "ready"
tags = ["KMP", "generics", "slices"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Adobe"]
teaches = [
  "The KMP failure table: after a mismatch, fall back to the longest border of what already matched instead of restarting.",
  "Generic over `T: PartialEq`: slices have no linear-time `find` for a sub-slice (`str::find` does), so here you write it.",
]
constraints = ["0 ≤ haystack.len(), needle.len() ≤ 10⁶"]
follow_up = "How would you return every occurrence, including overlapping ones, and what changes after a full match?"
related = ["S2", "S3", "L5"]

[[examples]]
input = "haystack = b\"sadbutsad\", needle = b\"sad\""
output = "Some(0)"

[[examples]]
input = "haystack = b\"leetcode\", needle = b\"leeto\""
output = "None"

[[hints]]
kind = "approach"
text = "Precompute, for each prefix of the needle, the length of its longest proper prefix that is also its suffix (its border). On a mismatch after matching k items, the next useful attempt has already matched `border[k - 1]` items."

[[hints]]
kind = "rust"
text = "Keep one counter `k` of matched items and walk the haystack once with `iter().enumerate()`; the fallback is a `while k > 0 && x != needle[k]` loop. `T: PartialEq` is all you need."

[[hints]]
kind = "edge case"
text = "Resetting `k` to 0 on a mismatch skips matches: in `aaab` the needle `aab` starts at 1, inside the attempt that failed."

[solution]
explanation = "KMP never moves backwards in the haystack: each mismatch shortens the current match to a border, and the total number of fallbacks is bounded by the number of advances, so it's linear. The border table is the same idea run on the needle against itself. `windows(m).position(..)` is O(n·m) in the worst case; `str::find` uses the Two-Way algorithm, linear with O(1) extra space, but only for strings."
time = "O(n + m)"
space = "O(m)"
