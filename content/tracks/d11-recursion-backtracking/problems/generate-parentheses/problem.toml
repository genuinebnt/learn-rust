slug = "generate-parentheses"
title = "Generate parentheses"
mode = "write"
level = "medium"
stage = "choices-grids"
order = 16
status = "ready"
tags = ["backtracking", "String", "pruning"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Uber", "Bloomberg"]
teaches = [
  "Prune by an invariant while building: a `)` is only allowed while it has an open `(` to close.",
  "One `String` buffer: `push`, recurse, `pop`, and clone only at a leaf.",
]
constraints = ["0 ≤ n ≤ 13"]
follow_up = "How would you return only the k-th answer in sorted order without generating the others?"
related = ["D3", "D12"]

[[examples]]
input = "n = 3"
output = "[\"((()))\", \"(()())\", \"(())()\", \"()(())\", \"()()()\"]"

[[examples]]
input = "n = 1"
output = "[\"()\"]"

[[hints]]
kind = "approach"
text = "Build the string left to right, counting `open` and `close`. You may add `(` while `open < n`, and `)` while `close < open`; every leaf is then an answer."

[[hints]]
kind = "rust"
text = "Keep one `String` and pass `&mut String` down: `push`, recurse, `pop`. Clone it only when it reaches length `2 * n`."

[[hints]]
kind = "edge case"
text = "Generating all 2²ⁿ strings and filtering is far too slow at n = 13, which has 742 900 answers out of 67 million strings."

[solution]
explanation = "The two rules keep every prefix valid, so the search never enters a dead end: each leaf is an answer, and the work is the answer count (the n-th Catalan number, about 4ⁿ / n^1.5) times the length."
time = "O(4ⁿ / √n)"
space = "O(n) besides the output"
