slug = "min-depth"
title = "Minimum depth of binary tree"
mode = "write"
level = "easy"
stage = "basics"
order = 2
status = "ready"
tags = ["recursion", "BFS"]
companies = ["Amazon", "Meta", "Microsoft"]
teaches = [
  "A missing child is not a leaf.",
  "Matching on a tuple of `Option`s.",
]
constraints = ["0 ≤ nodes ≤ 2·10⁵", "height ≤ 10⁵"]
follow_up = "Why can BFS stop earlier than DFS here, and when does that matter?"
related = ["D9"]

[[examples]]
input = "root = [3,9,20,null,null,15,7]"
output = "2"

[[hints]]
kind = "approach"
text = "It looks like `max_depth` with `min`, but a missing child is not a leaf: `min(0, …)` would stop there."

[[hints]]
kind = "rust"
text = "Match on `(n.left.clone(), n.right.clone())` and handle the one-child cases separately."

[[hints]]
kind = "edge"
text = "`[1,2]` has depth 2: the root has a child, so it isn't a leaf."

[solution]
explanation = "Only nodes with no children end a path. When one child is missing, the path must continue through the other; BFS finds the first leaf level and can stop early."
time = "O(n)"
space = "O(h)"
