[[hints]]
kind = "rust"
text = "`let _ = value;` binds nothing, so a temporary is dropped at once, and `let _ = b;` doesn't move `b` at all."

[[hints]]
kind = "rust"
text = "A temporary in a `match` scrutinee lives until the end of the whole `match`, so it outlives everything inside the arms."

[[hints]]
kind = "rust"
text = "Shadowing hides a variable; it doesn't drop it. Locals drop in reverse order of declaration; a struct's fields and a Vec's elements drop in order."

[solution]
explanation = "The rules, in the order the traps appear: `let _ = expr` drops a temporary at the end of the statement; `_` isn't a binding, so `let _ = b` moves nothing. Shadowing creates a second variable; the first lives to the end of the scope. `drop(a)` moves `a` into a function that drops it. A temporary in a `match` scrutinee lives to the end of the `match` statement, which is why `match mutex.lock().unwrap().x { .. }` holds the lock through every arm. At the end of scope, locals drop in reverse declaration order; each struct drops its fields in declaration order, and a `Vec` drops its elements front to back."
