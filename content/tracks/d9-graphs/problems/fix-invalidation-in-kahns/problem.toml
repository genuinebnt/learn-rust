[[hints]]
kind = "rust"
text = "`for &u in &ready` borrows `ready` for the whole loop, so `ready.push` can't happen inside it."

[[hints]]
kind = "approach"
text = "Walk `ready` by index with a `while` loop; its length is re-read every time round, so pushed nodes get processed too."

[solution]
explanation = "The index loop reads one element at a time, so no borrow spans the push. `ready` ends up equal to `order`, so one of them could go."
time = "O(V + E)"
space = "O(V + E)"

