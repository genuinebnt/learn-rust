slug = "product-except-self"
title = "Product of array except self"
mode = "write"
level = "medium"
stage = "grouping-prefix-sums"
order = 13
status = "ready"
tags = ["prefix products", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Goldman Sachs", "Uber"]
teaches = [
  "Prefix and suffix passes over the same output buffer.",
  "`iter().rev()` with an index for the backward pass.",
]
constraints = ["2 ≤ nums.len() ≤ 10⁵", "every product fits in i32"]
follow_up = "What breaks if the products can overflow i32, and what would you return instead?"
related = ["S6"]

[[examples]]
input = "nums = [1, 2, 3, 4]"
output = "[24, 12, 8, 6]"

[[hints]]
kind = "approach"
text = "out[i] = (product of everything left of i) × (product of everything right of i)."

[[hints]]
kind = "approach"
text = "Fill `out` with the left products in one pass, then multiply in the right products walking backwards."

[solution]
explanation = "Two passes, one running product each. Division would fail on zeros anyway."
time = "O(n)"
space = "O(1) beyond the output"
