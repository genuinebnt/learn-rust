slug = "stone-game"
title = "Stone game"
mode = "write"
level = "medium"
stage = "intervals-games"
order = 42
status = "ready"
tags = ["interval DP", "minimax"]
companies = ["Google", "Amazon", "Microsoft", "Meta"]
teaches = [
  "Recovering both players' totals from the total and the difference.",
  "Reusing an interval DP when the question asks for more than yes or no.",
]
constraints = ["0 ≤ piles.len() ≤ 1000", "0 ≤ piles[i] ≤ 10⁶"]
follow_up = "Why can Alice always win when the number of piles is even and the total is odd?"
related = ["D11"]

[[examples]]
input = "piles = [3, 7, 2, 3]"
output = "(10, 5)"

[[examples]]
input = "piles = [5, 3, 4, 5]"
output = "(9, 8)"

[[hints]]
kind = "approach"
text = "Since the stones add up to a fixed total, each player maximising their own total is the same as maximising their lead. Compute Alice's best lead as in Predict the winner."

[[hints]]
kind = "rust"
text = "Then solve alice + bob = total, alice - bob = lead: `((total + lead) / 2, (total - lead) / 2)` in `i64`, cast at the end."

[[hints]]
kind = "edge case"
text = "Bob can come out ahead when the length is odd: [1, 100, 1] gives (2, 100)."

[solution]
explanation = "One interval DP gives the lead; the totals follow from two linear equations. In LeetCode's version (even count, odd total) Alice always wins, but the totals still need the DP."
time = "O(n²)"
space = "O(n)"
