slug = "single-threaded-cpu"
title = "Single-threaded CPU"
mode = "write"
level = "hard"
stage = "two-heaps-merges"
order = 13
status = "ready"
tags = ["BinaryHeap", "simulation", "u64"]
companies = ["Amazon", "Google", "Microsoft"]
teaches = [
  "Sort by arrival once, then feed a min-heap of `Reverse((processing, index))` as the clock passes arrivals.",
  "When nothing is waiting, jump the clock to the next arrival instead of ticking.",
  "The clock is `u64`: 10⁵ tasks of up to ~4·10⁹ each overflow `u32`.",
]
constraints = ["0 ≤ tasks.len() ≤ 10⁵", "enqueue and processing times are any u32"]
follow_up = "With m identical CPUs instead of one, what second heap would you add?"
related = ["D8", "S5"]

[[examples]]
input = "tasks = [(1, 2), (2, 4), (3, 2), (4, 1)]"
output = "[0, 2, 3, 1]"

[[examples]]
input = "tasks = [(7, 10), (7, 12), (7, 5), (7, 4), (7, 2)]"
output = "[4, 3, 2, 0, 1]"

[[hints]]
kind = "approach"
text = "Process arrivals in time order. Keep the tasks that have arrived in a min-heap by (processing time, index); each time the CPU is free, pop one and advance the clock by its processing time."

[[hints]]
kind = "rust"
text = "Sort indices by `(enqueue, index)` once and walk them with a pointer. `BinaryHeap<Reverse<(u32, usize)>>` gives shortest-first with index tie-breaks for free."

[[hints]]
kind = "edge case"
text = "If nothing is waiting, set the clock to the next arrival rather than ticking. Keep the clock in `u64`."

[solution]
explanation = "Two structures play different roles: the sorted arrival list says *when* tasks become available, the heap says *which* available task runs next. The tuple `(processing, index)` inside `Reverse` encodes the whole selection rule. Jumping the clock over idle stretches makes the run time independent of the time values."
time = "O(n log n)"
space = "O(n)"
