slug = "hopcroft-karp-matching"
title = "Hopcroft-Karp matching"
mode = "write"
level = "hard"
stage = "flows-matching"
order = 41
status = "ready"
tags = ["bipartite matching", "BFS layers"]
teaches = [
  "BFS to layer the graph, then DFS for augmenting paths along those layers.",
  "A per-node edge cursor so each edge is tried once per phase.",
]
follow_up = "How does bipartite matching reduce to max flow, and why is Hopcroft-Karp faster than Edmonds-Karp on that network?"

[[examples]]
input = "left = 3, right = 3, edges = [(0,0), (0,1), (1,0), (2,1)]"
output = "2"

[[hints]]
kind = "approach"
text = "One phase: BFS from all free left nodes to get layers, then DFS from each free left node, only stepping to the next layer."

[[hints]]
kind = "approach"
text = "A left node whose DFS fails gets its layer cleared (`dist = MAX`) so no one retries it this phase."

[[hints]]
kind = "rust"
text = "A struct with `match_l`, `match_r`, `dist` and a cursor per node keeps `augment(&mut self, u)` to one parameter."

[solution]
explanation = "Each phase finds a maximal set of shortest augmenting paths, and there are only O(√V) phases. The cursor makes each phase's DFS O(E) in total."
time = "O(E √V)"
space = "O(V + E)"
