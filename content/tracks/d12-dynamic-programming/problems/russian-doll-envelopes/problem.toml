slug = "russian-doll-envelopes"
title = "Russian doll envelopes"
mode = "write"
level = "hard"
stage = "1d-choices"
order = 17
status = "ready"
tags = ["LIS", "sorting"]
companies = ["Google", "Amazon", "Microsoft", "Meta"]
teaches = [
  "Reducing two dimensions to one: sort by width, then LIS on heights.",
  "Sorting equal widths by height descending so they can't nest in each other.",
]
constraints = ["0 ≤ envelopes.len() ≤ 10⁵", "1 ≤ w, h ≤ 10⁵"]
follow_up = "What if envelopes could be rotated, or if you had boxes in three dimensions?"
related = ["D4", "D8"]

[[examples]]
input = "envelopes = [(5, 4), (6, 4), (6, 7), (2, 3)]"
output = "3 ((2, 3) → (5, 4) → (6, 7))"

[[hints]]
kind = "approach"
text = "Sort by width; then a nesting chain is an increasing subsequence of heights. Solve that with the O(n log n) LIS."

[[hints]]
kind = "rust"
text = "`sort_unstable_by(|a, b| a.0.cmp(&b.0).then(b.1.cmp(&a.1)))` sorts width ascending and height descending on ties."

[[hints]]
kind = "edge case"
text = "Envelopes with the same width can't nest. Sorting their heights descending stops the LIS from using two of them."

[solution]
explanation = "After the sort, an increasing run of heights automatically has increasing widths, and the descending tie-break rules out equal widths. The LIS pass is the tails-and-binary-search method."
time = "O(n log n)"
space = "O(n)"
