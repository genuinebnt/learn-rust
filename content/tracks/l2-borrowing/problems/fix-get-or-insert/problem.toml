slug = "fix-get-or-insert"
title = "Fix: get-or-insert without the entry API"
mode = "fix"
level = "hard"
stage = "borrow-checker-limits"
order = 31
status = "ready"
tags = ["NLL problem case 3", "E0502", "E0499", "Polonius"]
teaches = [
  "NLL problem case 3: a conditionally returned borrow is live on every path.",
  "Decide with a `bool`, mutate, then borrow once for the return.",
  "Polonius accepts the original.",
]
follow_up = "Rewrite `get_or_make` with the entry API. What does `or_insert_with` do that the two-lookup version can't?"
related = ["L2"]

[[hints]]
kind = "rust"
text = "Returning `v` from inside `if let Some(v) = self.map.get(&key)` makes that borrow last for the whole output lifetime. NLL doesn't track that it's only on the returning path, so the borrow counts as live on the insert path too."

[[hints]]
kind = "rust"
text = "The `match` version fails for the same reason: the `Some` arm returns the borrow, so the scrutinee's borrow is live in the `None` arm."

[[hints]]
kind = "rust"
text = "Decide with something that returns a `bool` (`contains_key`), mutate if needed, then look the key up once more and return that borrow."

[solution]
explanation = "This is NLL's \"problem case #3\": when a borrow is conditionally returned, the region of the returned reference must cover the whole rest of the function, and NLL applies that region to the borrow on every path, including the path that doesn't return. So the `insert` counts as a conflict. Polonius, the next borrow checker (`-Zpolonius` on nightly), reasons per path and accepts the original.\n\nThe standard workaround separates the decision from the borrow: `contains_key` returns a `bool`, so nothing is borrowed across the insert, and one final lookup produces the returned reference. It costs an extra hash lookup on hits. The entry API avoids that (`entry(key).or_insert_with(make)`) because the entry owns the decision, which is why it exists. Returning something that isn't a borrow (a `bool`, a copy, an index) from the early branch also compiles; only a returned *reference* triggers the problem.\n\nSyntax to remember: `if !self.map.contains_key(&key) { self.map.insert(key, make()); } &self.map[&key]` · `self.map.get_mut(&key).unwrap()`."
time = "O(1) expected"
space = "O(1)"

[rules]
forbid_methods = ["entry", "clone", "cloned", "to_owned"]
