slug = "combination-sum-ii"
title = "Combination sum II"
mode = "write"
level = "medium"
stage = "choices-grids"
order = 14
status = "ready"
tags = ["backtracking", "duplicates", "pruning"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "LinkedIn", "Bloomberg"]
teaches = [
  "Combination sum with each element used at most once: recurse with `i + 1`.",
  "The Subsets II skip removes duplicate combinations when `candidates` has repeats.",
]
constraints = ["1 ≤ candidates.len() ≤ 100", "1 ≤ candidates[i] ≤ 50", "1 ≤ target ≤ 30"]
follow_up = "How would you return only the number of distinct combinations, and could a DP do it?"
related = ["D12"]

[[examples]]
input = "candidates = [10, 1, 2, 7, 6, 1, 5], target = 8"
output = "[[1, 1, 6], [1, 2, 5], [1, 7], [2, 6]]"

[[examples]]
input = "candidates = [2, 5, 2, 1, 2], target = 5"
output = "[[1, 2, 2], [5]]"

[[hints]]
kind = "approach"
text = "It's Combination sum with `i + 1` in the recursive call, plus the Subsets II trick for repeated values."

[[hints]]
kind = "rust"
text = "Sort, then inside the loop: `break` if `c[i] > left`, `continue` if `i > start && c[i] == c[i - 1]`."

[[hints]]
kind = "edge case"
text = "A set of results is not enough: `[1; 100]` with target 30 has C(100, 30) index choices but one answer."

[solution]
explanation = "Sorting groups equal values, and letting only the first of a group start a branch at each depth builds each multiset once. The `break` cuts every branch that can no longer reach the target."
time = "O(2ⁿ) worst case; far less with the pruning"
space = "O(n) recursion depth"
