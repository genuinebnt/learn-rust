slug = "meeting-rooms-ii"
title = "Meeting rooms II"
mode = "write"
level = "medium"
stage = "intervals"
order = 11
status = "ready"
tags = ["intervals", "sweep line", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg", "Uber"]
teaches = [
  "Sweep line: sort the starts and the ends separately and walk them together.",
  "A min-heap of end times (`BinaryHeap<Reverse<i32>>`) is the other classic way.",
]
constraints = ["0 ≤ meetings.len() ≤ 2·10⁵", "start < end, both any i32"]
follow_up = "How would you also report which room each meeting goes to?"
related = ["D7", "S5"]

[[examples]]
input = "meetings = [(0, 30), (5, 10), (15, 20)]"
output = "2"

[[examples]]
input = "meetings = [(7, 10), (2, 4)]"
output = "1"

[[hints]]
kind = "approach"
text = "Only the number of meetings running at once matters. Walk the start times in order and free a room for every meeting that has ended by then."

[[hints]]
kind = "rust"
text = "Collect and sort `starts` and `ends` separately; one index into `ends` follows the loop over `starts`. Or keep a `BinaryHeap<Reverse<i32>>` of end times."

[[hints]]
kind = "edge case"
text = "Free rooms with `end <= start`, so a meeting ending at 5 frees its room for one starting at 5."

[solution]
explanation = "The rooms needed equal the most meetings running at any moment. Sorting starts and ends separately and sweeping counts that without tracking which meeting is in which room."
time = "O(n log n)"
space = "O(n)"
