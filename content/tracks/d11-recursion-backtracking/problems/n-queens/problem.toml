slug = "n-queens"
title = "N-Queens (bitmasks)"
mode = "write"
level = "hard"
stage = "constraints-pruning"
order = 22
status = "ready"
tags = ["backtracking", "bitmask", "pruning"]
companies = ["Apple", "Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "Prune as you place: a queen goes only on a square no earlier queen attacks, so dead boards are never built.",
  "Three `u16` masks (columns and both diagonals) make \"which squares are free?\" one expression; shifting the diagonal masks by one moves them down a row.",
]
constraints = ["1 ≤ n ≤ 12"]
follow_up = "Why is `u16` enough here, and what changes to reach n = 32 or n = 64?"
related = ["D13"]

[[examples]]
input = "n = 4"
output = "[[\".Q..\", \"...Q\", \"Q...\", \"..Q.\"], [\"..Q.\", \"Q...\", \"...Q\", \".Q..\"]]"

[[examples]]
input = "n = 1"
output = "[[\"Q\"]]"

[[hints]]
kind = "approach"
text = "Fill the board row by row, one queen per row. Keep which columns and which diagonals are already attacked, and only try the free squares; a row with no free square is a dead end."

[[hints]]
kind = "rust"
text = "With `u16` masks, the free columns are `full & !(cols | diag | anti)`. Take the lowest with `free & free.wrapping_neg()`, its column is `trailing_zeros()`, and the next row gets `(diag | bit) << 1` and `(anti | bit) >> 1`."

[[hints]]
kind = "edge case"
text = "n = 2 and n = 3 have no solution: return an empty `Vec`, not a board."

[solution]
explanation = "One queen per row turns the search into choosing a column per row. The masks say, for the next row, which columns are attacked from above: straight down (`cols`), and along each diagonal, which drifts one column per row, hence the shifts. Every branch the search enters holds a valid partial board, so the work is proportional to the partial boards, not to all nⁿ arrangements. Syntax to remember: `x & x.wrapping_neg()` isolates the lowest set bit, `x ^= bit` clears it."
time = "O(n!) placements at most; far fewer in practice"
space = "O(n) recursion depth besides the output"
