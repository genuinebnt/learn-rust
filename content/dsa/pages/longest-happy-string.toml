intuition = """
Build the longest string using at most `a` letters `a`, `b` letters `b` and `c` letters `c`, with no three equal letters in a row. Greedy with a max-heap: **always take the letter with the most left**, unless that would make three in a row, in which case take the next most frequent for one step and then return to the first.

Taking the commonest letter keeps the options open for later: the one that runs out last is the one most likely to cause a forbidden triple.
"""
tips = [
    "If the top letter would make three in a row and the heap has nothing else, stop. The string can't grow.",
    "Push a letter back only if it has some left.",
    "The same heap pattern as Reorganize String, with a limit on the run length instead of on repeats.",
]

[[approaches]]
name = "Heap: the commonest letter unless it would make three"
label = "heap"
idea = "Append the most frequent letter, or the second most frequent when the top one has just been used twice."
time = "O(n log 3)"
space = "O(1)"
note = "At most three letters, so the heap is tiny."
code = '''import heapq


class Solution:
    def longestDiverseString(self, a: int, b: int, c: int) -> str:
        heap = [(-n, ch) for n, ch in ((a, "a"), (b, "b"), (c, "c")) if n]
        heapq.heapify(heap)
        out = []
        while heap:
            count, ch = heapq.heappop(heap)
            if len(out) >= 2 and out[-1] == out[-2] == ch:
                if not heap:
                    break
                count2, ch2 = heapq.heappop(heap)
                out.append(ch2)
                if count2 + 1:
                    heapq.heappush(heap, (count2 + 1, ch2))
                heapq.heappush(heap, (count, ch))  # the top letter waits a turn
            else:
                out.append(ch)
                if count + 1:
                    heapq.heappush(heap, (count + 1, ch))
        return "".join(out)
'''
