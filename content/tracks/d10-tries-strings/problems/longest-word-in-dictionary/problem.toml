slug = "longest-word-in-dictionary"
title = "Longest word in dictionary"
mode = "write"
level = "easy"
stage = "first-tries"
order = 4
status = "ready"
tags = ["trie", "DFS"]
companies = ["Amazon", "Google"]
teaches = [
  "Walk a trie only through nodes that end a word.",
  "Visiting children in `a..z` order gives the lexicographic tie-break for free.",
]
constraints = ["0 ≤ words.len() ≤ 2·10⁵", "1 ≤ words[i].len() ≤ 30"]
follow_up = "How would you return every longest buildable word instead of one?"
related = ["S4", "D9"]

[[examples]]
input = "words = [\"w\", \"wo\", \"wor\", \"worl\", \"world\"]"
output = "\"world\""

[[examples]]
input = "words = [\"a\", \"banana\", \"app\", \"appl\", \"ap\", \"apply\", \"apple\"]"
output = "\"apple\""

[[hints]]
kind = "approach"
text = "Put every word in a trie, marking where words end. A word is buildable exactly when every node on its path is marked."

[[hints]]
kind = "rust"
text = "Keep the word's index in the node (`Option<usize>`), then walk with a stack, pushing only marked children. Return `words[i]`, a slice of the input."

[[hints]]
kind = "edge case"
text = "Checking only the one-letter-shorter prefix isn't enough: `\"abc\"` with `\"ab\"` but no `\"a\"` can't be built."

[solution]
explanation = "Walking only through marked nodes visits exactly the buildable words. Comparing length first and then the word itself handles ties. A `HashSet` of words plus a check of every prefix works too, at O(L²) per word for the slices."
time = "O(total letters)"
space = "O(total letters × 26)"
