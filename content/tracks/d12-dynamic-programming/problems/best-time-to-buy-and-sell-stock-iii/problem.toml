slug = "best-time-to-buy-and-sell-stock-iii"
title = "Best time to buy and sell stock III"
mode = "write"
level = "hard"
stage = "state-machines"
order = 38
status = "ready"
tags = ["state machine", "stocks"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "Apple", "Bloomberg", "Goldman Sachs"]
teaches = [
  "Four states in a line: after the first buy, first sell, second buy, second sell.",
  "Updating the states in order within a day, which is safe because a same-day buy and sell earns nothing.",
]
constraints = ["0 ≤ prices.len() ≤ 2·10⁵", "0 ≤ prices[i] ≤ 10⁵"]
follow_up = "Another way: best single trade in prices[..k] plus best in prices[k..], for every k, with two passes. Write it and compare."
related = ["D2"]

[[examples]]
input = "prices = [3, 3, 5, 0, 0, 3, 1, 4]"
output = "6 (buy 0 sell 3, buy 1 sell 4)"

[[hints]]
kind = "approach"
text = "Track four running bests: after buying once, after selling once, after buying a second time, after selling a second time. Each one feeds the next."

[[hints]]
kind = "rust"
text = "Four `i64`s. Updating them in order within the same day is fine: buying and selling on one day adds 0."

[[hints]]
kind = "edge case"
text = "The two best separate rises aren't always the answer: merging two rises into one trade can free a trade for a bigger one."

[solution]
explanation = "buy1 = max(buy1, -p), sell1 = max(sell1, buy1 + p), buy2 = max(buy2, sell1 - p), sell2 = max(sell2, buy2 + p). The chain enforces the order of trades; unused trades just stay at 0 profit."
time = "O(n)"
space = "O(1)"
