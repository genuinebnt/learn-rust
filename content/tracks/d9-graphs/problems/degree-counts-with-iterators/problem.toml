slug = "degree-counts-with-iterators"
title = "Degree counts with iterators"
mode = "write"
level = "easy"
stage = "representation"
order = 2
status = "ready"
tags = ["fold", "iterators"]
teaches = [
  "`fold` with an owned accumulator.",
  "Closure patterns like `|&(_, &(a, _))|`.",
]
follow_up = "How would you compute the same counts in parallel with rayon?"
related = ["S6"]

[[examples]]
input = "n = 3, edges = [(0, 1), (0, 2), (1, 2)]"
output = "degrees: [(0, 2), (1, 1), (2, 0)] · sources: [0]"

[[hints]]
kind = "rust"
text = "`fold(vec![(0, 0); n], |mut d, &(u, v)| { ...; d })` moves the Vec through every step."

[[hints]]
kind = "rust"
text = "`enumerate` gives `(index, &item)`; destructure the tuple right in the closure's parameter."

[solution]
explanation = "`fold` threads an owned Vec through the edges, so no `let mut` outside is needed. `sources` reuses `degrees` and filters on the first field."
time = "O(V + E)"
space = "O(V)"
