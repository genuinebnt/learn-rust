[[hints]]
kind = "rust"
text = "`let Stats { values, total, max } = self;` gives three separate `&mut` borrows, one per field."

[solution]
explanation = "Destructuring a `&mut Stats` binds each field by `&mut` (default binding modes), which is how you hand several fields to one call."
