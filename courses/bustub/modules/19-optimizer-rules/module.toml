code = "3h"
title = "Optimizer rules"
summary = "Rewrite rules that make plans faster without changing their result: an equality nested loop join becomes a hash join, ORDER BY + LIMIT becomes a bounded top-N, and a scan with a point predicate on an indexed column becomes an index scan. BusTub Project 3, task 2 and 3 optimizer rules, checked with EXPLAIN."
lectures = ["optimization1", "optimization2"]
bustub = ["src/optimizer/nlj_as_hash_join.cpp", "src/optimizer/sort_limit_as_topn.cpp", "src/optimizer/seqscan_as_indexscan.cpp", "src/optimizer/optimizer_custom_rules.cpp", "src/optimizer/nlj_as_index_join.cpp", "src/optimizer/merge_filter_nlj.cpp", "src/include/execution/plans/hash_join_plan.h", "src/include/execution/plans/topn_plan.h", "src/include/execution/plans/index_scan_plan.h", "test/sql/p3.05-index-scan-btree.slt", "test/sql/p3.06-empty-table.slt", "test/sql/p3.14-hash-join.slt", "test/sql/p3.15-multi-way-hash-join.slt", "test/sql/p3.16-sort-limit.slt", "test/sql/p3.17-topn.slt"]
files = [
    "tests/sql/p3.05-index-scan-btree.slt",
    "tests/sql/p3.06-empty-table.slt",
    "tests/sql/p3.14-hash-join.slt",
    "tests/sql/p3.15-multi-way-hash-join.slt",
    "tests/sql/p3.17-topn.slt",
    "tests/sql/hash_join.slt",
    "tests/sql/order_by.slt",
    "tests/sql/nested_index_join.slt",
    "tests/sql/update.slt",
]

