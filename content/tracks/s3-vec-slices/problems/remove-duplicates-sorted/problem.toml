slug = "remove-duplicates-sorted"
title = "Remove duplicates from a sorted slice"
mode = "write"
level = "easy"
stage = "use-it"
order = 7
status = "ready"
tags = ["two pointers", "in place"]
teaches = [
  "A write index for in-place compaction.",
  "Returning a length instead of shrinking the slice.",
]
follow_up = "How would you allow each value at most twice?"
related = ["D2"]

[[examples]]
input = "v = [0, 0, 1, 1, 1, 2]"
output = "3, with v starting [0, 1, 2]"

[[hints]]
kind = "approach"
text = "Keep a write position; copy a value there only if it differs from the last value written."

[solution]
explanation = "A slice can't shrink, so the length is the result. `Vec::dedup` does this and then truncates."
time = "O(n)"
space = "O(1)"
