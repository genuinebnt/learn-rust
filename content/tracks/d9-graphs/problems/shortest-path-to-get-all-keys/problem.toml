slug = "shortest-path-to-get-all-keys"
title = "Shortest path to get all keys"
mode = "write"
level = "hard"
stage = "hard-traversals"
order = 49
status = "ready"
tags = ["BFS on states", "bitmask"]
teaches = [
  "BFS over (cell, keys held): the same cell is a new state once you hold more keys.",
  "A key set as a bitmask in a `u32`.",
]
constraints = ["1 ≤ rows, cols ≤ 30", "0 ≤ k ≤ 6", "exactly one @"]
follow_up = "Could you shrink the search to a graph over just the start and the keys, with distances between them?"
related = ["D12"]

[[examples]]
input = "grid = [\"@.a..\", \"###.#\", \"b.A.B\"]"
output = "Some(8)"

[[examples]]
input = "grid = [\"@..aA\", \"..B#.\", \"....b\"]"
output = "Some(6)"

[[examples]]
input = "grid = [\"@Aa\"]"
output = "None"

[[hints]]
kind = "approach"
text = "A state is (row, col, keys held). BFS over states: after picking up a key, cells you already visited are worth visiting again."

[[hints]]
kind = "rust"
text = "Keys fit in a `u32` bitmask (`1 << (b - b'a')`); `seen` can be a flat `Vec<bool>` of `rows · cols · 64`. `match` on the byte with ranges like `b'a'..=b'f'` and a guard for locks."

[[hints]]
kind = "edge case"
text = "Count the keys in the grid instead of assuming six. With no keys the answer is 0."

[solution]
explanation = "There are rows · cols · 2^k states and each has four moves, so BFS is linear in that product."
time = "O(rows · cols · 2^k)"
space = "O(rows · cols · 2^k)"
