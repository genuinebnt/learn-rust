slug = "fix-rc-refcell-node-cycle-leak"
title = "Fix: Rc<RefCell<Node>> cycle leak"
mode = "fix"
level = "hard"
stage = "scc-bridges-arenas"
order = 43
status = "ready"
tags = ["Rc", "Weak", "leaks"]
teaches = [
  "Parent ↔ child `Rc` cycles never drop.",
  "`Weak` for back-pointers; `upgrade()` when you need it.",
]
follow_up = "Compare this with the arena-allocated graph. When is `Rc`/`Weak` the better fit?"
related = ["S7", "L7"]

[[hints]]
kind = "rust"
text = "`Rc::strong_count` never reaches 0 for either node: each holds a strong reference to the other."

[[hints]]
kind = "rust"
text = "Parents own children; children only need to find their parent if it still exists. That's `Weak`."

[[hints]]
kind = "rust"
text = "`Weak::upgrade()` returns `Option<Rc<T>>`: `None` once the parent is gone."

[solution]
explanation = "Ownership should point one way: down the tree. `Weak` back-pointers don't keep anything alive, and the `Option` from `upgrade` forces callers to handle a parent that's gone."
time = "O(1)"
space = "O(n)"

[rules]
forbid_methods = ["forget", "clone"]
