slug = "build-an-adjacency-list"
title = "Build an adjacency list"
mode = "write"
level = "easy"
stage = "representation"
order = 2
status = "ready"
tags = ["Vec<Vec<usize>>", "dedup"]
teaches = [
  "`vec![Vec::new(); n]` clones one empty Vec n times.",
  "Nodes as `usize` indices, not objects.",
]
follow_up = "When would you store neighbours in a `HashSet` or `BTreeSet` instead of a sorted `Vec`?"
related = ["S3"]

[[examples]]
input = "n = 4, edges = [(0, 1), (2, 1), (1, 0)]"
output = "[[1], [0, 2], [1], []]"

[[hints]]
kind = "rust"
text = "`vec![Vec::new(); n]` works because `Vec` is `Clone`; each node gets its own empty list."

[[hints]]
kind = "rust"
text = "`sort_unstable` then `dedup` removes repeats, since `dedup` only drops adjacent equal items."

[solution]
explanation = "Each undirected edge goes in both lists. Sorting then deduplicating handles repeated edges and the self-loop's double push."
time = "O(V + E log E)"
space = "O(V + E)"
