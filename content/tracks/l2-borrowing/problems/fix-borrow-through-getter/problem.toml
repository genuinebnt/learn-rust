[[hints]]
kind = "rust"
text = "`self.items()` borrows all of `self` for as long as the loop runs. What borrows only the `items` field?"

[solution]
explanation = "Getters hide which field they touch, so the compiler assumes all of `self`. Inside the impl, use the field directly."
time = "O(n)"
space = "O(k)"

[rules]
forbid_methods = ["clone", "to_vec"]
