[[hints]]
kind = "rust"
text = "Different closures have different types, so the Vec holds `Box<dyn FnMut(i64) -> i64 + ...>`. A bare `Box<dyn FnMut(..)>` means `+ 'static`, which rejects closures that borrow locals; and the box must say `+ Send` for the pipeline to be `Send`."

[[hints]]
kind = "rust"
text = "Calling an `FnMut` needs `&mut`: `mut f: F` in the parameter list, and `iter_mut()` over the boxes."

[solution]
explanation = "Generic `F: FnMut` gets its own compiled copy per closure and can inline it; `&mut dyn FnMut` is one copy with an indirect call. To store closures of different types you need trait objects, and the object type carries every promise: auto traits (`+ Send`) and the borrow region (`+ 'a`). Without `+ 'a`, `Box<dyn Trait>` defaults to `'static`.\n\nSyntax: `Vec<Box<dyn FnMut(i64) -> i64 + Send + 'a>>` · `fn push(&mut self, step: impl FnMut(i64) -> i64 + Send + 'a)`."
time = "O(n) per run"
space = "O(steps)"
