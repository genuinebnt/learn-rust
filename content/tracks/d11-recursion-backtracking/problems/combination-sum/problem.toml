slug = "combination-sum"
title = "Combination sum"
mode = "write"
level = "medium"
stage = "choices-grids"
order = 13
status = "ready"
tags = ["backtracking", "pruning", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Apple", "Microsoft", "Airbnb", "Uber", "Bloomberg"]
teaches = [
  "Recurse with the same index to allow reuse; move on to allow the next value.",
  "Sort once, then `break` as soon as a candidate is bigger than what's left.",
]
constraints = ["1 ≤ candidates.len() ≤ 30", "1 ≤ candidates[i] ≤ 200, all distinct", "1 ≤ target ≤ 500", "the answer has at most 10⁴ combinations"]
follow_up = "If you only needed the number of combinations, what DP would replace the backtracking?"
related = ["D12"]

[[examples]]
input = "candidates = [2, 3, 6, 7], target = 7"
output = "[[2, 2, 3], [7]]"

[[examples]]
input = "candidates = [2], target = 1"
output = "[]"

[[hints]]
kind = "approach"
text = "Walk the candidates by index. Taking `c[i]` recurses with the same `i` (it may repeat); the loop moving on to `i + 1` is the choice to stop using it."

[[hints]]
kind = "rust"
text = "Pass `left: u32` down and record the path when it hits 0. Sort first so you can `break` once `c[i] > left` (that also avoids a `u32` underflow)."

[[hints]]
kind = "edge case"
text = "Starting every level from index 0 builds `[2, 2, 3]`, `[2, 3, 2]` and `[3, 2, 2]`: only move forward."

[solution]
explanation = "Choosing candidates in non-decreasing index order makes each multiset appear once. Sorting lets one comparison cut the rest of a level."
time = "O(answer · target / min) in practice; exponential in the worst case"
space = "O(target / min) recursion depth"
