companies = ["Meta", "Amazon", "Google", "Microsoft", "Uber"]
teaches = [
  "Counting shows the answer: `max(len, (most − 1)(n + 1) + tied)`.",
  "Building the schedule: a max-heap of ready tasks by remaining count plus a `VecDeque` of tasks cooling down.",
