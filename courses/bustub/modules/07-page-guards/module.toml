code = "1g"
title = "Page guards"
summary = "RAII handles on buffer pool pages: pin and latch in the constructor, unlatch and unpin in Drop; moves, flush, and the deadlock lesson. BusTub Project 1 complete."
lectures = ["bufferpool", "indexconcurrency"]
bustub = ["src/include/storage/page/page_guard.h", "src/storage/page/page_guard.cpp", "test/storage/page_guard_test.cpp", "test/buffer/buffer_pool_manager_test.cpp"]

