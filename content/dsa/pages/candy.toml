intuition = """
Each child needs at least one candy, and a child with a higher rating than a neighbour must get more than that neighbour. Handle the two directions **separately**, each in one pass:

- **Left to right:** if a child outranks the one on their left, they get one more than that child. Otherwise 1.
- **Right to left:** if a child outranks the one on their right, make sure they have at least one more than that child (take the max with what the first pass gave).

The sum after both passes is the minimum, because each pass only adds what the constraint on that side forces.
"""
tips = [
    "Two separate passes keep each neighbour rule simple. One pass can't see both sides.",
    "On the second pass use `max(current, right neighbour + 1)`, so the first pass's result isn't lowered.",
    "Equal ratings impose no constraint, so such a child can drop back to 1.",
]

[[approaches]]
name = "A pass in each direction"
label = "greedy"
idea = "Satisfy the left-neighbour rule, then the right-neighbour rule, keeping the larger requirement."
time = "O(n)"
space = "O(n)"
note = "The extra array of candies."
code = '''class Solution:
    def candy(self, ratings: list[int]) -> int:
        n = len(ratings)
        candies = [1] * n
        for i in range(1, n):
            if ratings[i] > ratings[i - 1]:
                candies[i] = candies[i - 1] + 1
        for i in range(n - 2, -1, -1):
            if ratings[i] > ratings[i + 1]:
                candies[i] = max(candies[i], candies[i + 1] + 1)
        return sum(candies)
'''
