intuition = """
Remove duplicates **in place** from a sorted array and return the number of unique values, with the first part of the array holding them. A slow `write` pointer marks where the next unique value goes, and a fast `read` pointer scans. When `nums[read]` differs from the last value kept, copy it to `write` and advance. Equal values are adjacent, so comparing with the previous kept value is enough.
"""
tips = [
    "Compare with the last value KEPT (`nums[write - 1]`).",
    "Return `write`, the count. Anything after it is ignored.",
    "This is the same loop as Remove Element, with 'differs from the previous kept' as the keep rule.",
]

[[approaches]]
name = "Read and write pointers"
label = "two pointers"
idea = "Copy a value forward only when it is different from the last one copied."
time = "O(n)"
space = "O(1)"
note = "One pass."
code = '''class Solution:
    def removeDuplicates(self, nums: list[int]) -> int:
        write = 1
        for read in range(1, len(nums)):
            if nums[read] != nums[write - 1]:
                nums[write] = nums[read]
                write += 1
        return write
'''
