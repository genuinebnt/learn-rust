slug = "interval-list-intersections"
title = "Interval list intersections"
mode = "write"
level = "medium"
stage = "intervals"
order = 12
status = "ready"
tags = ["intervals", "two pointers"]
companies = ["Meta", "Amazon", "Google"]
teaches = [
  "Two pointers over two sorted lists: always advance the interval that ends first.",
  "The overlap of two closed intervals is `(max of starts, min of ends)` when that's non-empty.",
]
constraints = ["0 ≤ a.len(), b.len() ≤ 10⁵", "start ≤ end, both any i32"]
follow_up = "How would you intersect k lists at once?"
related = ["D2", "D7"]

[[examples]]
input = "a = [(0, 2), (5, 10), (13, 23), (24, 25)], b = [(1, 5), (8, 12), (15, 24), (25, 26)]"
output = "[(1, 2), (5, 5), (8, 10), (15, 23), (24, 24), (25, 25)]"

[[hints]]
kind = "approach"
text = "Keep one index in each list. Record the overlap of the two current intervals, then move past whichever ends first: it can't meet anything later."

[[hints]]
kind = "rust"
text = "`let lo = a[i].0.max(b[j].0); let hi = a[i].1.min(b[j].1);` and push `(lo, hi)` when `lo <= hi`."

[[hints]]
kind = "edge case"
text = "Closed intervals: `(1, 5)` and `(5, 8)` intersect in `(5, 5)`."

[solution]
explanation = "The interval that ends first can't overlap anything after the other list's current interval, so dropping it is safe. Each step advances one index."
time = "O(n + m)"
space = "O(1) besides the output"
