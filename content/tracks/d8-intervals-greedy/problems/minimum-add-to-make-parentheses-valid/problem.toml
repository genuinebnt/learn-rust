slug = "minimum-add-to-make-parentheses-valid"
title = "Minimum add to make parentheses valid"
mode = "write"
level = "medium"
stage = "greedy-choices"
order = 20
status = "ready"
tags = ["greedy", "strings", "stack"]
companies = ["Meta", "Amazon", "Google"]
teaches = [
  "With one bracket type, a counter replaces the stack.",
  "Count two different failures: closes with nothing to match, and opens left at the end.",
]
constraints = ["0 ≤ s.len() ≤ 2·10⁵", "s holds only '(' and ')'"]
follow_up = "How would you return one shortest balanced string, not just the count?"
related = ["D3"]

[[examples]]
input = "s = \"())\""
output = "1"

[[examples]]
input = "s = \"(((\""
output = "3"

[[hints]]
kind = "approach"
text = "Scan left to right counting unmatched `(`. A `)` with nothing to match needs an inserted `(`; each `(` still open at the end needs a `)`."

[[hints]]
kind = "rust"
text = "`s.bytes()` and two `usize` counters; with one bracket type you don't need a stack."

[[hints]]
kind = "edge case"
text = "`)(` needs 2 moves even though the counts match."

[solution]
explanation = "Every `)` that arrives with no open `(` forces an insertion before it, and every `(` still open at the end forces one after it. Those two counts are also enough, so their sum is the answer."
time = "O(n)"
space = "O(1)"
