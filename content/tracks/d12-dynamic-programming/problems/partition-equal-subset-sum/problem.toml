slug = "partition-equal-subset-sum"
title = "Partition equal subset sum"
mode = "write"
level = "medium"
stage = "knapsack"
order = 31
status = "ready"
tags = ["0/1 knapsack", "subset sum"]
companies = ["Amazon", "Meta", "Google", "Apple", "Microsoft", "Bloomberg"]
teaches = [
  "Subset sum as a boolean knapsack aiming at half the total.",
  "Rejecting an odd total before building any table.",
]
constraints = ["0 ≤ nums.len() ≤ 200", "1 ≤ nums[i] ≤ 100"]
follow_up = "How would a `u128` or a bitset (`reach |= reach << x`) speed this up?"
related = ["D11", "D13"]

[[examples]]
input = "nums = [1, 5, 11, 5]"
output = "true ([1, 5, 5] and [11])"

[[examples]]
input = "nums = [1, 2, 3, 5]"
output = "false"

[[hints]]
kind = "approach"
text = "Two equal groups each sum to total / 2, so the question is whether some subset sums to exactly half. An odd total is impossible."

[[hints]]
kind = "rust"
text = "A `Vec<bool>` of length half + 1 with `reach[0] = true`; for each number, sweep `s` downwards and set `reach[s] |= reach[s - x]`."

[[hints]]
kind = "edge case"
text = "Sweeping upwards lets one number count twice: [1, 2, 5] would \"reach\" 4 as 2 + 2."

[solution]
explanation = "It is 0/1 knapsack with booleans. The table has one entry per reachable sum up to half the total (at most 10⁴ here)."
time = "O(n × total)"
space = "O(total)"
