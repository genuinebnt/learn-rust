slug = "delete-and-earn"
title = "Delete and earn"
mode = "write"
level = "medium"
stage = "1d-choices"
order = 9
status = "ready"
tags = ["1-D DP", "counting"]
companies = ["Amazon", "Google", "Microsoft", "Goldman Sachs"]
teaches = [
  "Reducing a problem to one you know: total points per value, then House robber over the values.",
  "A counting `Vec` indexed by value instead of sorting.",
]
constraints = ["0 ≤ nums.len() ≤ 2·10⁵", "1 ≤ nums[i] ≤ 10⁵"]
follow_up = "If values went up to 10⁹, how would you avoid a `Vec` that long? (Sort the distinct values; neighbours are only values that differ by 1.)"
related = ["D1", "S4"]

[[examples]]
input = "nums = [2, 2, 3, 3, 3, 4]"
output = "9 (take the three 3s; every 2 and 4 is deleted)"

[[hints]]
kind = "approach"
text = "Taking one copy of x deletes every x - 1 and x + 1, so you may as well take every copy of x. Sum the points per value; then values v and v + 1 are neighbouring houses."

[[hints]]
kind = "rust"
text = "`let Some(&max) = nums.iter().max() else { return 0 };` then a `vec![0u64; max + 1]` of totals, then the House robber loop over it."

[[hints]]
kind = "edge case"
text = "Values that differ by 2 or more don't interfere: [1, 3] → 4."

[solution]
explanation = "Group by value, then it is House robber on the value line. Building the totals is O(n) and the robber pass is O(max value)."
time = "O(n + max)"
space = "O(max)"
