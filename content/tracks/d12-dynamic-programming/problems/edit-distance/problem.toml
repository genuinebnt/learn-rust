slug = "edit-distance"
title = "Edit distance"
mode = "write"
level = "medium"
stage = "strings"
order = 27
status = "ready"
tags = ["2-D DP", "chars", "Unicode"]
companies = ["Google", "Amazon", "Meta", "Microsoft", "Apple", "Bloomberg", "LinkedIn"]
teaches = [
  "Three moves (insert, delete, replace) as three neighbours in the table.",
  "`chars().collect::<Vec<char>>()` when an edit means a character, not a byte.",
]
constraints = ["0 ≤ a and b ≤ 2000 chars each"]
follow_up = "Graphemes like \"é\" written as e + a combining accent are two chars. How would you make that one edit? (Grapheme clusters, e.g. the unicode-segmentation crate.)"
related = ["S2"]

[[examples]]
input = "a = \"horse\", b = \"ros\""
output = "3 (horse → rorse → rose → ros)"

[[hints]]
kind = "approach"
text = "dp[i][j] = dp[i - 1][j - 1] if the characters match, else 1 + min(replace dp[i - 1][j - 1], delete dp[i - 1][j], insert dp[i][j - 1]). Row 0 is j, column 0 is i."

[[hints]]
kind = "rust"
text = "Collect both strings into `Vec<char>` first; `as_bytes()` would count \"é\" as two edits. Two rows plus `std::mem::swap` keep it O(m) space."

[[hints]]
kind = "edge case"
text = "Turning a string into \"\" (or back) costs its length, so the first row and column are 0, 1, 2, …"

[solution]
explanation = "The last characters either match (free), or the last edit was a replace, a delete or an insert, each leaving a smaller pair of prefixes. Collecting into chars makes each edit one Unicode scalar value."
time = "O(n × m)"
space = "O(m)"
