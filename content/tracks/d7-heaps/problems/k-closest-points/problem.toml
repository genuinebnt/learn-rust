slug = "k-closest-points"
title = "K closest points to origin"
mode = "write"
level = "medium"
stage = "heaps-at-work"
order = 4
status = "ready"
tags = ["BinaryHeap", "tuple ordering", "overflow"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "LinkedIn", "Uber"]
teaches = [
  "A max-heap capped at k keeps the k smallest: the worst of them sits on top, ready to be evicted.",
  "Tuples compare field by field, so `(dist, x, y)` is the tie rule written as a heap key.",
  "`i32::unsigned_abs` into `u64`: a squared distance from the i32 corner doesn't fit in i64.",
]
constraints = ["0 ≤ points.len() ≤ 2·10⁵", "0 ≤ k", "coordinates are any i32"]
follow_up = "If the points arrived as an endless stream and you had to answer \"k closest so far\" at any moment, what would you keep?"
related = ["D1", "S5"]

[[examples]]
input = "points = [(1, 3), (-2, 2)], k = 1"
output = "[(-2, 2)]"

[[examples]]
input = "points = [(3, 3), (5, -1), (-2, 4)], k = 2"
output = "[(3, 3), (-2, 4)]"

[[hints]]
kind = "approach"
text = "Keep the k nearest points seen so far in a max-heap. A new point only matters if it beats the farthest of them, which is on top."

[[hints]]
kind = "rust"
text = "Push `(dist, x, y)` tuples: tuples compare field by field, so the tie rule is the key. `into_sorted_vec()` returns them ascending, nearest first."

[[hints]]
kind = "edge case"
text = "`(i32::MIN)² + (i32::MIN)² = 2⁶³` overflows `i64`. Square `x.unsigned_abs() as u64`."

[solution]
explanation = "A max-heap of size k holds the k best candidates; each point costs one comparison with the top and at most one pop and push. Because the key is the whole `(distance², x, y)` tuple, the answer is unique and the heap's order is the output order. Squared distances avoid floats entirely; `u64` holds 2⁶³. Quickselect (`select_nth_unstable_by_key`) gets O(n) on average if the order of the k points didn't matter."
time = "O(n log k)"
space = "O(k)"
