slug = "remove-nth-from-end"
title = "Remove Nth node from end"
mode = "write"
level = "medium"
stage = "cursors"
order = 6
status = "ready"
tags = ["&mut cursor", "Blind 75"]
teaches = [
  "Stepping a `&mut Option<Box<_>>` cursor.",
  "Removing through the slot, not the previous node.",
]
constraints = ["0 ≤ list length ≤ 2·10⁵"]
follow_up = "Do it in one pass. What would you have to give up or use (e.g. indices, `unsafe`)?"

[[hints]]
kind = "approach"
text = "In Rust the two-pointer trick needs two cursors into the same list at once. Counting first, then walking once with a single `&mut`, is simpler."

[[hints]]
kind = "rust"
text = "`cur = &mut cur.as_mut().expect(..).next;` steps a `&mut Option<Box<_>>` cursor forward. Then `*cur = cur.take().and_then(|n| n.next)` unlinks."

[solution]
explanation = "Two passes, but only one mutable cursor, which is the shape the borrow checker likes. Pointing at the slot (not the node before it) removes the need for a dummy head."
time = "O(n)"
space = "O(1)"
