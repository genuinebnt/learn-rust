slug = "swim-in-rising-water"
title = "Swim in rising water"
mode = "write"
level = "hard"
stage = "shortest-paths"
order = 35
status = "ready"
tags = ["Dijkstra", "minimax path", "BinaryHeap"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Uber"]
teaches = [
  "Dijkstra where a path costs its highest cell, not its sum.",
  "`max` instead of `+` keeps Dijkstra's greedy choice valid.",
]
constraints = ["1 ≤ n ≤ 300", "0 ≤ height ≤ 10⁹"]
follow_up = "Solve it with union-find, adding cells in order of height until the corners join."

[[examples]]
input = "grid = [[0,2],[1,3]]"
output = "3"

[[hints]]
kind = "approach"
text = "A route's time is its highest cell. Find the route whose highest cell is lowest."

[[hints]]
kind = "approach"
text = "That's Dijkstra with `max` instead of `+`: pop the cell with the lowest 'time so far', and a neighbour's time is `max(time, height)`."

[[hints]]
kind = "edge case"
text = "You start standing in the top-left cell, so its height counts too."

[solution]
explanation = "`max` never decreases along a path, which is all Dijkstra needs to stop at the target the first time it's popped. Binary search on t plus a flood fill is the other classic solution, at O(n² log H)."
time = "O(n² log n)"
space = "O(n²)"
