slug = "hand-of-straights"
title = "Hand of straights"
mode = "write"
level = "medium"
stage = "hard-greedy"
order = 23
status = "ready"
tags = ["greedy", "BTreeMap", "sorting"]
companies = ["Amazon", "Google"]
teaches = [
  "A `BTreeMap<_, usize>` is a sorted multiset: `first_key_value()` gives the smallest card left.",
  "`card + 1` can overflow at `i32::MAX`; widen the key to `i64`.",
]
constraints = ["0 ≤ hand.len() ≤ 2·10⁵", "hand[i] is any i32", "1 ≤ group_size ≤ 2·10⁵"]
follow_up = "Can you avoid the sorted map, starting runs only from values whose predecessor is missing from a `HashMap`?"
related = ["S4", "D7"]

[[examples]]
input = "hand = [1, 2, 3, 6, 2, 3, 4, 7, 8], group_size = 3"
output = "true"

[[examples]]
input = "hand = [1, 2, 3, 4, 5], group_size = 4"
output = "false"

[[hints]]
kind = "approach"
text = "The smallest card left can only be the start of a run, so that run is forced: it needs the next `group_size - 1` values too. Take it and repeat."

[[hints]]
kind = "rust"
text = "Count cards in a `BTreeMap<i64, usize>`. If the smallest key has count `n`, subtract `n` from each of the next `group_size` keys at once, removing keys that reach 0."

[[hints]]
kind = "edge case"
text = "A run starting near `i32::MAX` needs values past it; `i32` arithmetic overflows there, `i64` keys don't."

[solution]
explanation = "The smallest remaining card can't be in the middle of a run, so the run it starts is forced. With counts in a BTreeMap, each successful lookup removes at least one card, so the work is O(n log n)."
time = "O(n log n)"
space = "O(n)"
