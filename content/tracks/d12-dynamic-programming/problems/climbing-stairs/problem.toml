slug = "climbing-stairs"
title = "Climbing stairs"
mode = "write"
level = "easy"
stage = "1d-basics"
order = 2
status = "ready"
tags = ["1-D DP", "Blind 75"]
companies = ["Amazon", "Apple", "Google", "Microsoft", "Adobe", "Bloomberg", "Uber"]
teaches = [
  "Turning \"how many ways\" into a recurrence over the last step taken.",
  "Rolling two variables instead of a table.",
]
constraints = ["1 ≤ n ≤ 90"]
follow_up = "What changes if you may take 1, 2 or 3 steps, or any step size from a given set?"
related = ["D11"]

[[examples]]
input = "n = 3"
output = "3 (1+1+1, 1+2, 2+1)"

[[hints]]
kind = "approach"
text = "The last move onto step `n` came from step `n - 1` or step `n - 2`, so ways(n) = ways(n - 1) + ways(n - 2)."

[[hints]]
kind = "rust"
text = "Only the previous two values matter: keep them in two `u64`s and update with `(a, b) = (b, a + b)`."

[[hints]]
kind = "edge case"
text = "ways(0) = 1 (do nothing) and ways(1) = 1 are the seeds; n = 90 needs a `u64`."

[solution]
explanation = "The answer is the Fibonacci sequence shifted by one: ways(n) = F(n + 1). Rolling two values gives O(1) space."
time = "O(n)"
space = "O(1)"
