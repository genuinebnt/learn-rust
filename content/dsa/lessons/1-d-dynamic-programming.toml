[[technique]]
id = "1-D Dynamic Programming:recurrence"
group = "Linear and sequence DP"
signals = [
    "the answer for n is built from the answers for a few smaller values (n - 1, n - 2, ...)",
    "count the ways to reach a position, or the cheapest way to get there",
    "each step can be one of a few fixed moves",
]
template = '''
def count_ways(n, steps=(1, 2)):
    # dp[i] = number of ways to land exactly on step i.
    dp = [0] * (n + 1)
    dp[0] = 1
    for i in range(1, n + 1):
        dp[i] = sum(dp[i - s] for s in steps if i - s >= 0)
    return dp[n]
'''
pitfalls = [
    "Write down dp[0] (the empty case) before the loop. Most off-by-one bugs live there.",
    "Only the last few values are needed, so two or three variables can replace the array.",
    "For a minimum instead of a count, swap sum for min and start unreachable states at infinity.",
]

[[technique]]
id = "1-D Dynamic Programming:take-skip"
group = "Linear and sequence DP"
signals = [
    "pick items along a line, but you can't pick two neighbours",
    "maximise a total where taking one item rules out the next",
    "at each item the choice is: take it, or skip it",
]
template = '''
def rob(nums):
    # take: best total if the current house is used; skip: if it is not.
    skip, take = 0, 0
    for x in nums:
        skip, take = max(skip, take), skip + x
    return max(skip, take)
'''
pitfalls = [
    "Taking the current item adds it to the best total from two steps back, not one.",
    "On a circle the first and last items are neighbours: solve twice, once without the first and once without the last.",
    "Start both totals at 0 so an empty list returns 0.",
]

[[technique]]
id = "1-D Dynamic Programming:expand"
group = "Palindromic DP"
signals = [
    "palindromic substrings: find the longest one, or count them all",
    "there are only 2n - 1 possible centres",
    "checking every substring would be O(n cubed)",
]
template = '''
def longest_palindrome(s):
    best = ""
    for centre in range(2 * len(s) - 1):
        lo, hi = centre // 2, (centre + 1) // 2  # a letter or a gap
        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:
            lo, hi = lo - 1, hi + 1
        if hi - lo - 1 > len(best):
            best = s[lo + 1:hi]
    return best
'''
pitfalls = [
    "Even-length palindromes have a centre between two letters. Trying only odd centres misses them.",
    "After the loop lo and hi have moved one step too far, so the palindrome is s[lo + 1:hi].",
    "To count palindromes, add one for every successful step of the expansion instead of tracking the longest.",
]

[[technique]]
id = "1-D Dynamic Programming:unbounded"
group = "Coin change"
signals = [
    "the same item or coin can be used any number of times",
    "fewest items to reach a total, or the number of ways to reach it",
    "the total is small enough to index an array by it",
]
template = '''
def coin_change(coins, amount):
    # dp[a] = fewest coins that make exactly a (infinity if impossible).
    INF = float("inf")
    dp = [0] + [INF] * amount
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a and dp[a - c] + 1 < dp[a]:
                dp[a] = dp[a - c] + 1
    return dp[amount] if dp[amount] != INF else -1
'''
pitfalls = [
    "Greedy (always take the biggest coin) fails for coins like [1, 3, 4]. Use the table.",
    "To count combinations instead of minimising, loop over coins on the outside and amounts on the inside, or orderings get counted too.",
    "Return -1 when dp[amount] is still infinity.",
]

[[technique]]
id = "1-D Dynamic Programming:min-max-run"
group = "Linear and sequence DP"
signals = [
    "the best product or value of a subarray, where a negative can flip a bad run into a good one",
    "a running maximum alone gives the wrong answer",
    "you need both the best and the worst ending at each position",
]
template = '''
def max_product(nums):
    best = hi = lo = nums[0]
    for x in nums[1:]:
        # A negative number turns the smallest product into the largest.
        candidates = (x, hi * x, lo * x)
        hi, lo = max(candidates), min(candidates)
        best = max(best, hi)
    return best
'''
pitfalls = [
    "Keep the minimum as well as the maximum: two negatives multiply to a positive.",
    "A zero resets both runs. Including x itself among the candidates handles that.",
    "Compute both candidates from the old hi and lo before assigning either.",
]

[[technique]]
id = "1-D Dynamic Programming:prefix-dp"
group = "Linear and sequence DP"
signals = [
    "can a string be split into pieces from a dictionary?",
    "dp[i] says whether the first i characters work",
    "each position looks back at every earlier position that could end a piece",
]
template = '''
def word_break(s, words):
    words = set(words)
    dp = [True] + [False] * len(s)  # dp[i]: can s[:i] be built from words?
    for i in range(1, len(s) + 1):
        for j in range(i):
            if dp[j] and s[j:i] in words:
                dp[i] = True
                break
    return dp[len(s)]
'''
pitfalls = [
    "dp[0] is True: the empty prefix is always buildable.",
    "Bound the inner loop by the longest word, to turn O(n squared) slicing into O(n times that length).",
    "A recursive version needs a memo, or a string like 'aaaa...ab' takes exponential time.",
]

[[technique]]
id = "1-D Dynamic Programming:lis"
group = "Longest increasing subsequence"
signals = [
    "the longest strictly increasing subsequence, or a chain where each item must exceed the last",
    "items may be skipped, but their order is kept",
    "n is large enough that O(n squared) is too slow",
]
template = '''
from bisect import bisect_left


def length_of_lis(nums):
    # tails[k]: smallest last value of an increasing run of length k + 1.
    tails = []
    for x in nums:
        i = bisect_left(tails, x)  # first tail that is >= x
        if i == len(tails):
            tails.append(x)
        else:
            tails[i] = x
    return len(tails)
'''
pitfalls = [
    "tails is not itself a subsequence of the input, only its length is the answer.",
    "bisect_left makes the run strictly increasing. bisect_right would allow equal values.",
    "The simple version is dp[i] = 1 + max(dp[j] for j < i if nums[j] < nums[i]). Start there, then optimise.",
]

[[technique]]
id = "1-D Dynamic Programming:subset"
group = "Knapsack family"
signals = [
    "choose some items so their total hits a target exactly",
    "split an array into two groups with equal sums",
    "each item is used once or not at all",
]
template = '''
def can_make(nums, target):
    reachable = [True] + [False] * target  # reachable[t]: some subset = t
    for x in nums:
        for t in range(target, x - 1, -1):  # downwards: use each item once
            if reachable[t - x]:
                reachable[t] = True
    return reachable[target]
'''
pitfalls = [
    "Loop the target downwards. Going upwards reuses an item several times (that is the unbounded version).",
    "For equal halves, check that the total is even first, then look for total / 2.",
    "A bitset (an integer shifted and OR-ed) does the same in a single line and is much faster in Python.",
]

[[technique]]
id = "1-D Dynamic Programming:partition-dp"
group = "Linear and sequence DP"
signals = [
    "cut a sequence into consecutive groups, and each group has a cost",
    "the cost of a group depends on its contents (its tallest item, its sum)",
    "dp[i] is the best way to handle the first i items",
]
template = '''
def min_total_height(books, shelf_width):
    # books are (thickness, height). dp[i]: least height for the first i.
    n = len(books)
    dp = [0] + [float("inf")] * n
    for i in range(1, n + 1):
        width = height = 0
        for j in range(i, 0, -1):  # the last shelf: books j - 1 .. i - 1
            width += books[j - 1][0]
            if width > shelf_width:
                break
            height = max(height, books[j - 1][1])
            dp[i] = min(dp[i], dp[j - 1] + height)
    return dp[n]
'''
pitfalls = [
    "Grow the last group backwards from i, updating its width and height as you add each item.",
    "Stop as soon as the group no longer fits. Later (smaller) groups can only be wider.",
    "dp[0] = 0 is the empty prefix, so a group that covers everything works.",
]

[[technique]]
id = "1-D Dynamic Programming:count-states"
group = "Counting DP"
signals = [
    "count the sequences of a given length when each step is limited by the current state",
    "a small number of states (digits, positions, last letter) with fixed transitions",
    "the answer is asked modulo 10^9 + 7",
]
template = '''
MOVES = {0: (4, 6), 1: (6, 8), 2: (7, 9), 3: (4, 8), 4: (0, 3, 9),
         5: (), 6: (0, 1, 7), 7: (2, 6), 8: (1, 3), 9: (2, 4)}


def knight_dialer(n):
    MOD = 10**9 + 7
    ways = [1] * 10  # ways[d] = sequences of the current length ending on d
    for _ in range(n - 1):
        ways = [sum(ways[s] for s in MOVES if d in MOVES[s]) % MOD
                for d in range(10)]
    return sum(ways) % MOD
'''
pitfalls = [
    "Keep one count per state, not one entry per sequence. The number of sequences grows exponentially.",
    "Apply the modulus at each step so the numbers stay small.",
    "Build each new count from the previous step only. That is why the whole table is never stored.",
]

[[technique]]
id = "1-D Dynamic Programming:game"
group = "Game and minimax DP"
signals = [
    "two players take turns and both play perfectly",
    "each turn takes a few items from one end of a line",
    "who wins, or by how much?",
]
template = '''
def stone_game(values):
    # lead[i] = (mover's total) - (opponent's total) from stones i onwards.
    n = len(values)
    lead = [0] * (n + 1)
    for i in range(n - 1, -1, -1):
        take, best = 0, float("-inf")
        for k in range(1, 4):  # take 1, 2 or 3 stones
            if i + k > n:
                break
            take += values[i + k - 1]
            best = max(best, take - lead[i + k])  # then the opponent leads
        lead[i] = best
    return lead[0]
'''
pitfalls = [
    "Track the difference between the two players, not two separate scores. One number is enough.",
    "After your move the opponent is the one to move, so subtract their lead.",
    "Positive means the first player wins, negative the second, zero a tie.",
]

[[technique]]
id = "1-D Dynamic Programming:bitmask"
group = "Bitmask DP"
signals = [
    "n is tiny (about 12 to 20) and you must try combinations of items",
    "each item is in or out of a group, so a subset is an integer",
    "two groups must not share an item",
]
template = '''
def max_palindrome_product(s):
    n = len(s)
    size = [0] * (1 << n)  # size[mask]: its length if it is a palindrome
    for mask in range(1, 1 << n):
        chosen = [s[i] for i in range(n) if mask >> i & 1]
        if chosen == chosen[::-1]:
            size[mask] = len(chosen)
    best = 0
    for a in range(1, 1 << n):
        if size[a]:
            rest = ((1 << n) - 1) ^ a
            b = rest
            while b:  # every subset of the remaining letters
                if size[b]:
                    best = max(best, size[a] * size[b])
                b = (b - 1) & rest
    return best
'''
pitfalls = [
    "Bit i of the mask says whether item i is chosen. Test it with mask >> i & 1.",
    "Disjoint groups: a & b == 0. Enumerating the submasks of the complement guarantees it.",
    "3 to the power n is the cost of all disjoint pairs, so this only works for small n.",
]

[[extra]]
id = "1-D Dynamic Programming:memo-vs-table"
name = "Memoisation and tabulation"
group = "Memoisation versus tabulation"
signals = [
    "you can say the answer for a state in terms of smaller states, and the same state is reached again and again",
    "the plain recursion is exponential and the number of distinct states is small",
    "you are not sure in which order to fill a table: write the recursion first and let the calls find the order",
]
template_name = "Top-down (memoised)"
template = '''
from functools import cache


def min_cost_climbing(cost):
    """Cheapest way to the top, starting on step 0 or step 1."""
    n = len(cost)

    @cache
    def best(i):  # cheapest cost to stand on step i
        if i < 2:
            return 0
        return min(best(i - 1) + cost[i - 1], best(i - 2) + cost[i - 2])

    return best(n)
'''
pitfalls = [
    "Recursion depth is the length of the chain of states: about 1000 in Python. Rewrite bottom-up (or raise the limit) for long inputs.",
    "The memo key must contain everything the answer depends on, and nothing it does not (a mutable list cannot be a key).",
    "Top-down only visits the states it needs: on a sparse state space it can be much cheaper than filling the whole table.",
]
examples = ["climbing-stairs", "min-cost-climbing-stairs", "house-robber", "decode-ways"]

[[extra.variant]]
name = "Bottom-up (table)"
note = "The same recurrence with the order written out: no recursion limit, and the table can often shrink to a few variables."
template = '''
def min_cost_climbing(cost):
    n = len(cost)
    dp = [0] * (n + 1)  # dp[i]: cheapest cost to stand on step i
    for i in range(2, n + 1):
        dp[i] = min(dp[i - 1] + cost[i - 1], dp[i - 2] + cost[i - 2])
    return dp[n]
'''

[[extra]]
id = "1-D Dynamic Programming:rolling-row"
name = "Rolling array: keep only the previous row"
group = "Space optimisation"
signals = [
    "a 2-D table whose row i only reads row i - 1 (and the cells to its left in the same row)",
    "the table is too large for memory, or you only need the final cell",
    "edit distance, LCS, grid paths: the answer is one number, not the path",
]
template_name = "Two rows"
template = '''
def edit_distance(a, b):
    prev = list(range(len(b) + 1))  # the row for the empty prefix of a
    for i in range(1, len(a) + 1):
        cur = [i] + [0] * len(b)
        for j in range(1, len(b) + 1):
            if a[i - 1] == b[j - 1]:
                cur[j] = prev[j - 1]
            else:
                cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])
        prev = cur
    return prev[-1]
'''
pitfalls = [
    "You cannot rebuild the answer (the edit script, the LCS) from the last row alone: reconstruction needs the table or Hirschberg's method.",
    "Put the shorter string on the inside so the row is short.",
    "Rows that read only the row above can drop to one array, but the order of the writes then matters (see the next tab).",
]
examples = ["edit-distance", "longest-common-subsequence", "minimum-path-sum", "unique-paths"]

[[extra.variant]]
name = "One row and a diagonal"
note = "Overwrite the row in place. The cell to the upper left is about to be overwritten, so carry it in a variable."
template = '''
def edit_distance(a, b):
    row = list(range(len(b) + 1))
    for i in range(1, len(a) + 1):
        diag = row[0]  # the previous row's value at column j - 1
        row[0] = i
        for j in range(1, len(b) + 1):
            above = row[j]  # needed as `diag` for the next column
            if a[i - 1] == b[j - 1]:
                row[j] = diag
            else:
                row[j] = 1 + min(above, row[j - 1], diag)
            diag = above
    return row[-1]
'''

[[extra]]
id = "1-D Dynamic Programming:reconstruct"
name = "Rebuild the answer, not only its value"
group = "Reconstruction"
signals = [
    "the problem asks for the subset, the sequence or the path itself, not its size or cost",
    "the table has the optimal value; you now need the choices that produced it",
    "any optimal answer is accepted, or a specific one (the lexicographically smallest)",
]
template = '''
def largest_divisible_subset(nums):
    nums = sorted(nums)
    n = len(nums)
    best = [1] * n   # best[i]: size of the largest chain ending at i
    prev = [-1] * n  # prev[i]: the element before i in that chain
    for i in range(n):
        for j in range(i):
            if nums[i] % nums[j] == 0 and best[j] + 1 > best[i]:
                best[i] = best[j] + 1
                prev[i] = j
    end = max(range(n), key=best.__getitem__, default=-1)
    chain = []
    while end != -1:  # walk back through the parent pointers
        chain.append(nums[end])
        end = prev[end]
    return chain[::-1]
'''
pitfalls = [
    "Store the choice (a parent index) when you improve a cell, in the same place you update the value.",
    "Walk back from the best cell, which is not always the last one.",
    "With ties, the answer you rebuild depends on < versus <=: say which one you keep.",
]
examples = ["largest-divisible-subset", "shortest-common-supersequence", "word-break-ii"]

[[extra]]
id = "1-D Dynamic Programming:window-dp"
name = "Sliding-window DP: prefix sums and a monotonic deque"
group = "Prefix-sum and monotonic-queue optimisation"
signals = [
    "dp[i] is a sum or a maximum over the previous k states, so the plain recurrence is O(n k)",
    "the transition range slides one step per position",
    "n and k are both around 10^5",
]
template_name = "Prefix sums (range-sum transition)"
template = '''
def new_21_game(n, k, max_pts):
    """Probability of ending with at most n points, drawing 1..max_pts
    until the total reaches k."""
    if k == 0 or n >= k + max_pts - 1:
        return 1.0
    dp = [0.0] * (n + 1)  # dp[i]: probability of reaching exactly i
    dp[0] = 1.0
    window = 1.0  # sum of dp[j] over the last max_pts j with j < k
    answer = 0.0
    for i in range(1, n + 1):
        dp[i] = window / max_pts
        if i < k:
            window += dp[i]
        else:
            answer += dp[i]
        if i - max_pts >= 0 and i - max_pts < k:
            window -= dp[i - max_pts]
    return answer
'''
pitfalls = [
    "Add the new state to the window and drop the one that leaves it in the same step, in that order.",
    "Only states that can still move on belong in the window (here: totals below k).",
    "A range-max transition needs a deque of candidates, not a running sum (see the next tab).",
]
examples = ["new-21-game", "jump-game-vii", "constrained-subsequence-sum", "sliding-window-maximum"]

[[extra.variant]]
name = "Monotonic deque (range-max transition)"
note = "Keep the indices of the window in decreasing order of dp: the front is always the best one."
template = '''
from collections import deque


def constrained_subset_sum(nums, k):
    """Largest sum of a non-empty subsequence whose chosen indices are
    at most k apart."""
    dp = [0] * len(nums)
    queue = deque()  # indices in the window, dp decreasing
    best = float("-inf")
    for i, x in enumerate(nums):
        dp[i] = x + (dp[queue[0]] if queue and dp[queue[0]] > 0 else 0)
        best = max(best, dp[i])
        while queue and dp[queue[-1]] <= dp[i]:
            queue.pop()  # i is better and later: they can never win
        queue.append(i)
        if queue[0] <= i - k:
            queue.popleft()  # out of the window for the next position
    return best
'''

