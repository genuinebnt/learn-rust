slug = "path-sum"
title = "Path sum"
mode = "write"
level = "easy"
stage = "basics"
order = 6
status = "ready"
tags = ["recursion", "root-to-leaf"]
companies = ["Amazon", "Meta", "Microsoft"]
teaches = [
  "Carrying state down a recursion.",
  "Leaf means no children, not 'a missing child'.",
]
constraints = ["0 ≤ nodes ≤ 2·10⁵", "height ≤ 10⁵", "path sums fit in i32"]
follow_up = "Return every matching path instead of a `bool` (that's Path sum II, later in this track)."
related = ["S1"]

[[examples]]
input = "root = [5,4,8,11,null,13,4,7,2,null,null,null,1], target_sum = 22"
output = "true"

[[hints]]
kind = "approach"
text = "Subtract the node's value from the target and ask the same question of each child. At a leaf, check whether what's left is 0."

[[hints]]
kind = "rust"
text = "`let Some(node) = root else { return false };` handles the empty tree up front."

[[hints]]
kind = "edge"
text = "Values can be negative, so you can't stop early when the running sum passes the target."

[solution]
explanation = "Passing the remaining target down turns the question into a leaf check. Only nodes with no children end a path."
time = "O(n)"
space = "O(h)"
