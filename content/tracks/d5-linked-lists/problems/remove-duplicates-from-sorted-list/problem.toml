slug = "remove-duplicates-from-sorted-list"
title = "Remove duplicates from a sorted list"
mode = "write"
level = "easy"
stage = "owned-lists"
order = 3
status = "ready"
tags = ["as_mut", "and_then"]
teaches = [
  "Walking with `as_mut()`.",
  "Splicing with `take().and_then(..)`.",
]
follow_up = "Remove every value that has duplicates (so [1,1,2] becomes [2])."

[[hints]]
kind = "rust"
text = "`head.as_mut()` gives `Option<&mut Box<ListNode>>` to walk with, while `head` keeps ownership."

[[hints]]
kind = "rust"
text = "`node.next.take().and_then(|n| n.next)` removes one node: the box is dropped, its tail is kept."

[solution]
explanation = "Only one `&mut` cursor exists at a time, and removing a node is a move out of the box being dropped."
time = "O(n)"
space = "O(1)"
