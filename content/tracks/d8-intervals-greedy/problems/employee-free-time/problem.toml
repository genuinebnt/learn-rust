slug = "employee-free-time"
title = "Employee free time"
mode = "write"
level = "hard"
stage = "hard-greedy"
order = 27
status = "ready"
tags = ["intervals", "heap", "k-way merge"]
companies = ["Amazon", "Google", "Airbnb", "Uber"]
teaches = [
  "k-way merge of sorted lists with a `BinaryHeap<Reverse<(start, list, index)>>`.",
  "Merge intervals, but keep the gaps instead of the merged blocks.",
]
constraints = ["0 ≤ total number of intervals ≤ 2·10⁵", "start < end, both any i32", "each employee's list is sorted and non-overlapping"]
follow_up = "If each calendar were a live stream of new meetings, how would you report shared free time as soon as it is certain?"
related = ["D7", "S5"]

[[examples]]
input = "schedule = [[(1, 2), (5, 6)], [(1, 3)], [(4, 10)]]"
output = "[(3, 4)]"

[[examples]]
input = "schedule = [[(1, 3), (6, 7)], [(2, 4)], [(2, 5), (9, 12)]]"
output = "[(5, 6), (7, 9)]"

[[hints]]
kind = "approach"
text = "Treat all intervals as one stream sorted by start, tracking the latest end seen so far. A start after that end opens a free gap."

[[hints]]
kind = "rust"
text = "Each list is already sorted, so merge them with a `BinaryHeap<Reverse<(i32, usize, usize)>>` holding each employee's next interval. Flattening and sorting also works in O(N log N)."

[[hints]]
kind = "edge case"
text = "Keep the max end: one long interval can cover several later ones. A gap must have positive length, so `(1, 2)` then `(2, 3)` leaves no free time."

[solution]
explanation = "This is merge intervals across every employee, keeping the gaps between merged blocks. The heap holds one interval per employee, so N intervals from k employees cost O(N log k)."
time = "O(N log k)"
space = "O(k) for the heap, plus the output"
