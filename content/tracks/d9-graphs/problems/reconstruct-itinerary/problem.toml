slug = "reconstruct-itinerary"
title = "Reconstruct itinerary"
mode = "write"
level = "hard"
stage = "hard-traversals"
order = 50
status = "ready"
tags = ["Euler path", "Hierholzer", "interning"]
teaches = [
  "Hierholzer's algorithm: finish a node when it runs out of edges, then reverse.",
  "Popping the smallest neighbour from a Vec sorted in reverse.",
]
constraints = ["tickets.len() ≤ 2·10⁵ (LeetCode: 300)", "airport names are ASCII"]
follow_up = "How would you check first whether an Euler path from JFK exists at all?"

[[examples]]
input = "tickets = [(\"MUC\",\"LHR\"), (\"JFK\",\"MUC\"), (\"SFO\",\"SJC\"), (\"LHR\",\"SFO\")]"
output = "[\"JFK\",\"MUC\",\"LHR\",\"SFO\",\"SJC\"]"

[[examples]]
input = "tickets = [(\"JFK\",\"SFO\"), (\"JFK\",\"ATL\"), (\"SFO\",\"ATL\"), (\"ATL\",\"JFK\"), (\"ATL\",\"SFO\")]"
output = "[\"JFK\",\"ATL\",\"JFK\",\"SFO\",\"ATL\",\"SFO\"]"

[[hints]]
kind = "approach"
text = "Hierholzer: from JFK keep taking the smallest unused ticket. When an airport has none left, it's finished: add it to the route. The route comes out backwards."

[[hints]]
kind = "rust"
text = "Sort each airport's destinations largest first so `Vec::pop` gives the smallest. An explicit `stack` of airports replaces the recursion."

[[hints]]
kind = "edge case"
text = "The smallest choice can be the one-way branch that must be flown last. Greedy without Hierholzer strands tickets; backtracking finds the answer but can retry that branch once per visit."

[solution]
explanation = "Each ticket is pushed and popped once, so after sorting the walk is linear. An airport is added to the route only when all its tickets are used, which is what puts a dead-end branch at the end."
time = "O(E log E)"
space = "O(E)"
