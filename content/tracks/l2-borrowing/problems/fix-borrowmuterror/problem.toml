[[hints]]
kind = "rust"
text = "`borrow()` returns a guard that holds the shared borrow until it's dropped. When is `names` dropped?"

[solution]
explanation = "The guard lived to the end of the function, so `borrow_mut` found it still active and panicked. Ending the shared borrow in the same statement fixes it."
