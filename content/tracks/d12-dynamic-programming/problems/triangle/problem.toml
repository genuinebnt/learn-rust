slug = "triangle"
title = "Triangle"
mode = "write"
level = "medium"
stage = "2d-grids"
order = 21
status = "ready"
tags = ["2-D DP", "bottom-up"]
companies = ["Amazon", "Google", "Apple", "Microsoft", "Bloomberg"]
teaches = [
  "Solving bottom-up so every cell has exactly two choices below it and the answer lands at the top.",
  "Reusing one `Vec` that shrinks by one live cell per row.",
]
constraints = ["1 ≤ triangle.len() ≤ 2000", "triangle[r].len() == r + 1", "-10⁴ ≤ triangle[r][c] ≤ 10⁴"]
follow_up = "Can you do it in O(1) extra space by overwriting the input, and when would that be acceptable?"
related = ["D11"]

[[examples]]
input = "triangle = [[2], [3, 4], [6, 5, 7], [4, 1, 8, 3]]"
output = "11 (2 + 3 + 5 + 1)"

[[hints]]
kind = "approach"
text = "Go bottom-up: the best walk from (r, c) is triangle[r][c] plus the better of the best walks from (r + 1, c) and (r + 1, c + 1)."

[[hints]]
kind = "rust"
text = "Start `below` as the last row (as `i64`), then for each row above update `below[c]` left to right; `below[c + 1]` hasn't been overwritten yet."

[[hints]]
kind = "edge case"
text = "Stepping to the smaller child greedily fails when a small number leads to a big one below."

[solution]
explanation = "Bottom-up, every cell has exactly two children and the answer ends up at below[0]; top-down you would need to take a min over the whole last row. Each row reuses the same `Vec`."
time = "O(n²) for n rows (every cell once)"
space = "O(n)"
