slug = "largest-rectangle-in-histogram"
title = "Largest rectangle in histogram"
mode = "write"
level = "hard"
stage = "hard-stacks"
order = 11
status = "ready"
tags = ["monotonic stack", "u64"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Uber"]
teaches = [
  "Monotonic stacks for nearest-smaller boundaries.",
  "Sentinels via `get(..).unwrap_or(..)`.",
]
follow_up = "Use this to find the largest rectangle of 1s in a binary matrix."

[[hints]]
kind = "approach"
text = "For each bar, the widest rectangle of its height stretches to the nearest lower bar on each side. A stack of rising heights finds both."

[[hints]]
kind = "rust"
text = "`heights.get(i).copied().unwrap_or(0)` adds a height-0 sentinel at the end, which flushes the stack."

[[hints]]
kind = "edge case"
text = "Area can exceed `u32`: 10⁵ × 10⁹. Multiply in `u64`."

[solution]
explanation = "When a bar is popped, the bar that pops it is its right limit and the new top is its left limit. Every bar is pushed and popped once."
time = "O(n)"
space = "O(n)"
