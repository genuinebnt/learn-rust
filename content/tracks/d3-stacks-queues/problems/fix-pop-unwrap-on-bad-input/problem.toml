slug = "fix-pop-unwrap-on-bad-input"
title = "Fix: pop().unwrap() on bad input"
mode = "fix"
level = "medium"
stage = "monotonic-parsing"
order = 10
status = "ready"
tags = ["Result", "?", "error enums"]
teaches = [
  "`Option::ok_or` + `?` instead of `unwrap`.",
  "`checked_div` for panicking arithmetic.",
]
follow_up = "Should `i64::MIN / -1` really be reported as division by zero? Design a better error."
related = ["S1", "L8"]

[[hints]]
kind = "rust"
text = "`stack.pop().ok_or(RpnError::NotEnoughOperands)?` turns `None` into an early `Err`."

[[hints]]
kind = "rust"
text = "`a.checked_div(b)` is `None` for division by zero, and also for `i64::MIN / -1`, which overflows."

[[hints]]
kind = "edge case"
text = "After the loop, exactly one value must be left."

[solution]
explanation = "Every `unwrap` becomes an explicit error, and `?` keeps the happy path readable. `checked_div` covers both panicking divisions. (Overflow in `+ - *` would still panic in debug builds; `checked_add` and friends fix that the same way.)"
time = "O(n)"
space = "O(n)"

[rules]
forbid_methods = ["unwrap", "expect", "unwrap_unchecked", "unwrap_or_default"]
