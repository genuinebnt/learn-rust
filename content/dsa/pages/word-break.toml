intuition = """
`can[i]` is true if the first `i` characters of `s` can be split into dictionary words. It's true when some earlier position `j` has `can[j]` true **and** `s[j:i]` is a word. With `can[0] = True` (the empty prefix), fill `i` from 1 to `len(s)`; the answer is `can[len(s)]`.

Put the words in a set so each `s[j:i] in words` is O(1) (plus the cost of slicing).
"""
tips = [
    "Break out of the inner loop on the first success: `can[i]` only needs one valid split point.",
    "Limit `j` to `i - max_word_length`, which prunes the search a lot (words are at most 20 letters).",
    "A pure recursion (\"try every prefix\") is exponential without memoisation.",
    "A Trie of the words, or BFS over positions, are the follow-ups.",
]

[[approaches]]
name = "Bottom-up prefixes"
label = "bottom-up"
idea = "`can[i]` is true when some split `j < i` has `can[j]` and `s[j:i]` in the dictionary."
time = "O(n · L)"
space = "O(n)"
time_why = "Each of the n prefix ends checks up to L candidate word lengths (the longest word, at most 20), each a slice and a set lookup."
space_why = "One flag for each position."
note = "L is the longest word (at most 20), so about n · 20 slice checks."
code = '''class Solution:
    def wordBreak(self, s: str, wordDict: list[str]) -> bool:
        words = set(wordDict)
        longest = max(map(len, words))
        can = [True] + [False] * len(s)
        for i in range(1, len(s) + 1):
            for j in range(max(0, i - longest), i):
                if can[j] and s[j:i] in words:
                    can[i] = True
                    break
        return can[-1]
'''

[[approaches]]
name = "Top-down with memoisation"
label = "memoised"
idea = "`fits(i)` asks whether the suffix from i can be split; try every word that matches at i and recurse on what's left."
time = "O(n · L)"
space = "O(n)"
time_why = "Each of the n start positions is solved once and tries up to L word lengths."
space_why = "The cache has n entries and the recursion goes up to n deep."
note = "Recursion depth up to n (300)."
code = '''from functools import cache


class Solution:
    def wordBreak(self, s: str, wordDict: list[str]) -> bool:
        words = set(wordDict)

        @cache
        def fits(i: int) -> bool:
            if i == len(s):
                return True
            return any(s.startswith(w, i) and fits(i + len(w)) for w in words)

        return fits(0)
'''
