slug = "unique-paths-ii"
title = "Unique paths II"
mode = "write"
level = "medium"
stage = "2d-grids"
order = 19
status = "ready"
tags = ["2-D DP", "rolling row"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "Bloomberg"]
teaches = [
  "An obstacle cell has 0 paths, and that zero flows on to the cells after it.",
  "Iterating a grid of rows (`&[Vec<u8>]`) with one rolling row.",
]
constraints = ["1 ≤ m, n ≤ 100", "grid[i][j] is 0 or 1", "the path count to every cell fits in a u64"]
follow_up = "What if the robot could also move diagonally, or if some cells cost more to cross?"
related = ["D9"]

[[examples]]
input = "grid = [[0, 0, 0], [0, 1, 0], [0, 0, 0]]"
output = "2"

[[hints]]
kind = "approach"
text = "Same recurrence as Unique paths, except an obstacle cell is 0. Seed the start with 1 (or 0 if it's a rock)."

[[hints]]
kind = "rust"
text = "One `Vec<u64>` row: for each cell, set `row[j] = 0` on a rock, else `row[j] += row[j - 1]` for j > 0."

[[hints]]
kind = "edge case"
text = "A rock in the first row blocks every cell to its right in that row; don't initialise the first row and column to 1 blindly."

[solution]
explanation = "Rocks contribute 0, and that zero propagates: cells past a rock in the first row or column are unreachable. Seeding row[0] = 1 before the first row handles a rock at the start too."
time = "O(m × n)"
space = "O(n)"
