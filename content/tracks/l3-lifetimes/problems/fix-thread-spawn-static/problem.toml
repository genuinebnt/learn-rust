slug = "fix-thread-spawn-static"
title = "Fix: thread::spawn needs 'static, scope doesn't"
mode = "fix"
level = "medium"
stage = "static-bounds"
order = 15
status = "ready"
tags = ["E0521", "E0310", "thread::scope", "Send + 'static", "thread::Builder"]
teaches = [
  "`spawn` needs `'static` because the thread may outlive the caller.",
  "`thread::scope` lets threads borrow, because it joins them first.",
  "Wrappers around `spawn` repeat its `Send + 'static` bounds.",
]
follow_up = "`count_later` could take `Arc<[String]>` instead of copying. When is that better, and what does it cost the caller?"
