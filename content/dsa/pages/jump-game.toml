intuition = """
You don't need to find the path, only whether the last index is **reachable**. Sweep left to right keeping the **furthest index reachable so far**. If you ever stand on an index beyond that, you're stuck and the answer is `False`. Otherwise extend the furthest reach with `i + nums[i]`.

The greedy choice works because reachability is **contiguous**: if you can reach index `j`, you can reach every index before it that you passed over.
"""
tips = [
    "Check `i > furthest` **before** using `nums[i]`: it means index `i` was never reachable.",
    "A zero in the array is only a problem if the furthest reach can't get past it.",
    "You can also scan backwards, moving a `goal` index left whenever the current index can reach it. Same answer.",
    "Dynamic programming (`can_reach[i]`) is O(n²) and works but is the one to avoid at 10,000 elements.",
]

[[approaches]]
name = "Furthest reachable index"
label = "greedy"
idea = "Walk forward tracking the furthest index you can reach. Fail if the current index is past it; succeed if it reaches the end."
time = "O(n)"
space = "O(1)"
note = "One pass."
code = '''class Solution:
    def canJump(self, nums: list[int]) -> bool:
        furthest = 0
        for i, jump in enumerate(nums):
            if i > furthest:
                return False
            furthest = max(furthest, i + jump)
            if furthest >= len(nums) - 1:
                return True
        return True
'''

[[approaches]]
name = "Move the goal backwards"
label = "backward goal"
idea = "Start with the goal at the last index. Going left, any index that can reach the goal becomes the new goal. You can jump if the goal ends at 0."
time = "O(n)"
space = "O(1)"
note = "The same greedy argument, read from the other end."
code = '''class Solution:
    def canJump(self, nums: list[int]) -> bool:
        goal = len(nums) - 1
        for i in range(len(nums) - 2, -1, -1):
            if i + nums[i] >= goal:
                goal = i
        return goal == 0
'''
