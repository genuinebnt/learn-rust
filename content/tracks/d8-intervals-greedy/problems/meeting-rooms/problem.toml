slug = "meeting-rooms"
title = "Meeting rooms"
mode = "write"
level = "easy"
stage = "first-greedy"
order = 4
status = "ready"
tags = ["intervals", "sorting", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "`sort_unstable_by_key(|m| m.0)` orders tuples by one field.",
  "`windows(2)` compares each pair of neighbours.",
]
constraints = ["0 ≤ meetings.len() ≤ 2·10⁵", "start < end, both any i32"]
follow_up = "If they do overlap, how many rooms would you need? (That's Meeting rooms II.)"
related = ["S3", "D7"]

[[examples]]
input = "meetings = [(0, 30), (5, 10), (15, 20)]"
output = "false"

[[examples]]
input = "meetings = [(7, 10), (2, 4)]"
output = "true"

[[hints]]
kind = "approach"
text = "Sort by start time. Then only neighbours can clash: check each meeting ends by the time the next one starts."

[[hints]]
kind = "rust"
text = "Copy with `to_vec()`, `sort_unstable_by_key(|m| m.0)`, then `windows(2).all(|w| w[0].1 <= w[1].0)`."

[[hints]]
kind = "edge case"
text = "`end == next start` is not an overlap."

[solution]
explanation = "After sorting by start, if any two meetings overlap then some adjacent pair does, so one pass over neighbours decides it."
time = "O(n log n)"
space = "O(n) for the sorted copy"
