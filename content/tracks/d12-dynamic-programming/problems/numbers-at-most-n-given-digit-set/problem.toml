slug = "numbers-at-most-n-given-digit-set"
title = "Numbers at most N given digit set"
mode = "write"
level = "hard"
stage = "bitmasks-digits"
order = 47
status = "ready"
tags = ["digit DP", "counting"]
companies = ["Amazon", "Google"]
teaches = [
  "Digit DP: count everything shorter than N, then walk N's digits and count what first drops below it at each position.",
  "`to_string().bytes()` to get an integer's digits, `u64::pow` for the free positions.",
]
constraints = ["0 ≤ digits.len() ≤ 9", "digits are distinct, sorted, and each in 1..=9", "1 ≤ n ≤ u64::MAX"]
follow_up = "How would the count change if 0 were allowed in `digits` (numbers can't start with 0)?"
related = ["D13"]

[[examples]]
input = "digits = [1, 3, 5, 7], n = 100"
output = "20 (1, 3, 5, 7, 11, 13, …, 77)"

[[examples]]
input = "digits = [7], n = 8"
output = "1"

[[hints]]
kind = "approach"
text = "Numbers with fewer digits than n are all fine: d¹ + d² + … + d^(len - 1). For numbers as long as n, go through n's digits left to right: at position i, any smaller digit from the set makes the rest free (d^(remaining) ways)."

[[hints]]
kind = "rust"
text = "`n.to_string().bytes().map(|b| b - b'0')` gives the digits; `d.pow(k)` counts the free positions."

[[hints]]
kind = "edge case"
text = "Stop as soon as n's digit isn't in the set, since no number can keep matching n past it. If you get through every digit, n itself counts: add 1."

[solution]
explanation = "Every number below n of the same length agrees with n up to some position, then has a smaller digit there. Grouping by that position gives one term per digit of n, so the work is proportional to the number of digits."
time = "O(log n · |digits|)"
space = "O(log n)"
