slug = "generic-max-by-key"
title = "Generic max_by_key with borrowed keys"
mode = "fix"
level = "medium"
stage = "generic-code"
order = 4
status = "ready"
tags = ["HRTB", "?Sized", "closures returning references"]
teaches = [
  "Higher-ranked trait bounds: `for<'a> Fn(&'a T) -> &'a K`.",
  "`?Sized` for type parameters used only behind a reference.",
]
follow_up = "Write the where clause with an explicit `for<'a>`. Why can't `Iterator::max_by_key` offer this signature?"
related = ["L5", "L3", "L6"]

[[hints]]
kind = "rust"
text = "`F: FnMut(&T) -> K` means one `K` for every call, whatever the argument's lifetime, so `K` can't borrow from the argument. Tie the output to the input: `F: FnMut(&T) -> &K`."

[[hints]]
kind = "rust"
text = "Elided, `FnMut(&T) -> &K` is the higher-ranked `for<'a> FnMut(&'a T) -> &'a K`."

[[hints]]
kind = "rust"
text = "`K` is `str` or `[i32]` in the tests. Generic parameters are `Sized` unless you opt out: `K: Ord + ?Sized`."

[solution]
explanation = "The key closure must work for every borrow of an item, so its bound is higher-ranked: `for<'a> FnMut(&'a T) -> &'a K`, which the `Fn(&T) -> &K` sugar writes for you. `K: ?Sized` lets the key be `str` or `[T]` behind the reference. This is exactly why std's `max_by_key` can't return `p.name.as_str()`: its `B` is fixed before any item is borrowed."
time = "O(n) key calls"
space = "O(1)"

[rules]
max_changed_lines = 2
