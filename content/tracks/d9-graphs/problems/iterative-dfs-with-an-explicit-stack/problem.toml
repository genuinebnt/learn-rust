slug = "iterative-dfs-with-an-explicit-stack"
title = "Iterative DFS with an explicit stack"
mode = "write"
level = "medium"
stage = "traversal"
order = 13
status = "ready"
tags = ["DFS", "stack", "no recursion"]
teaches = [
  "Why deep recursion overflows a 2 MiB thread stack.",
  "Pushing neighbours in reverse to keep recursive order.",
]
follow_up = "How would you also record postorder (finish times) without recursion?"

[[examples]]
input = "adj = [[1, 2], [3], [3], []], start = 0"
output = "[0, 1, 3, 2]"

[[hints]]
kind = "approach"
text = "Mark a node visited when you pop it, not when you push it; skip it if it's already been visited."

[[hints]]
kind = "approach"
text = "The stack is last-in, first-out, so push the neighbours in reverse to try the first one first."

[solution]
explanation = "Marking on pop is what makes this match recursive DFS exactly; marking on push gives a different order. Test threads get a 2 MiB stack, and 200,000 recursive frames don't fit."
time = "O(V + E)"
space = "O(V + E)"
