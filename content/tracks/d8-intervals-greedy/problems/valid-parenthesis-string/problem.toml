slug = "valid-parenthesis-string"
title = "Valid parenthesis string"
mode = "write"
level = "medium"
stage = "greedy-choices"
order = 21
status = "ready"
tags = ["greedy", "strings"]
companies = ["Meta", "Amazon", "Google", "Microsoft"]
teaches = [
  "Track a range of possible states (`lo..=hi` open counts) instead of branching on each `*`.",
  "`saturating_sub` keeps the low end of a `usize` range at 0.",
]
constraints = ["0 ≤ s.len() ≤ 2·10⁵", "s holds only '(', ')' and '*'"]
follow_up = "How would you produce one concrete replacement for the stars that balances `s`?"
related = ["D3", "D12"]

[[examples]]
input = "s = \"()\""
output = "true"

[[examples]]
input = "s = \"(*)\""
output = "true"

[[examples]]
input = "s = \"(*))\""
output = "true"

[[hints]]
kind = "approach"
text = "Don't branch on each `*`. Track the lowest and highest number of open `(` any choice could give: `(` raises both, `)` lowers both, `*` lowers the low end and raises the high end."

[[hints]]
kind = "rust"
text = "Two `usize` counters; `lo.saturating_sub(1)` keeps the low end at 0, since no valid choice goes negative."

[[hints]]
kind = "edge case"
text = "Fail as soon as `hi` would drop below 0; at the end the answer is `lo == 0`. Order matters: `*(` is not balanced."

[solution]
explanation = "Every open count between lo and hi is reachable by some choice of stars, and clamping lo at 0 drops choices that would close too much. If even the most-open choice goes negative, nothing works; at the end, some choice lands on 0 exactly when lo is 0."
time = "O(n)"
space = "O(1)"
