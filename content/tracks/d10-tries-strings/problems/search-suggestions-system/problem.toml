slug = "search-suggestions-system"
title = "Search suggestions system"
mode = "write"
level = "medium"
stage = "tries-at-work"
order = 9
status = "ready"
tags = ["trie", "autocomplete", "sorting"]
companies = ["Meta", "Amazon", "Google", "Microsoft"]
teaches = [
  "Autocomplete keeps a cursor into the trie and moves it one node per typed letter.",
  "Insert products in sorted order and let each node remember its first three: suggestions are then a lookup, not a search.",
]
constraints = ["0 ≤ products.len() ≤ 2·10⁴, total length ≤ 2·10⁷", "0 ≤ search_word.len() ≤ 1000", "lowercase ASCII"]
follow_up = "Real search boxes rank by popularity, not alphabet, and learn from what people pick. How would the node data change? (The hard stage's autocomplete does this.)"
related = ["S3", "S1"]

[[examples]]
input = "products = [\"mobile\", \"mouse\", \"moneypot\", \"monitor\", \"mousepad\"], search_word = \"mouse\""
output = "[[mobile, moneypot, monitor], [mobile, moneypot, monitor], [mouse, mousepad], [mouse, mousepad], [mouse, mousepad]]"

[[hints]]
kind = "approach"
text = "Sort the products, then insert them into a trie in that order. Each node keeps the first three products that pass through it: those are its three smallest."

[[hints]]
kind = "rust"
text = "Keep the cursor as `Option<&Node>`: each keystroke does `cursor = cursor.and_then(|n| n.children[i].as_deref())`, and `None` means every later list is empty."

[[hints]]
kind = "edge case"
text = "Suggestions must match the whole typed prefix, not only the latest letter, and they're capped at three."

[solution]
explanation = "Sorting first means no node ever needs re-sorting: the first three products to reach it are the smallest. Each keystroke is then one step down the trie plus copying at most three strings. Sort + binary search (`partition_point` on the prefix) is the other classic answer, O(log n) per keystroke with no trie."
time = "O(n log n · L) to build, O(1) steps per keystroke (plus copying the three results)"
space = "O(total letters × 26)"
