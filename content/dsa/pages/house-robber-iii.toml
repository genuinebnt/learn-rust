intuition = """
House Robber on a tree: you can't rob a house and its parent or children on the same night. At each node there are two numbers to know: the best total **if you rob this node** (so you must skip its children, and add their "skipped" values) and the best total **if you don't** (each child is then free to be robbed or not, whichever is better).

Return the pair `(robbed, skipped)` from each call, post-order, and the answer at the root is the larger of the two. It is a DFS that returns two values.
"""
tips = [
    "`robbed = node.val + left.skipped + right.skipped`.",
    "`skipped = max(left) + max(right)`, because skipping this node lets each child choose freely.",
    "Compute both for every node in one post-order pass. Recursing with a memo on the node does the same.",
]

[[approaches]]
name = "Return (best if robbed, best if skipped)"
label = "dfs"
idea = "Each subtree reports two totals, so the parent can combine them without recomputing."
time = "O(n)"
space = "O(h)"
time_why = "Each node is visited once and combines two numbers from each child."
space_why = "The recursion goes as deep as the tree is tall."
note = "One pass."
code = '''class Solution:
    def rob(self, root: TreeNode | None) -> int:
        def solve(node: TreeNode | None) -> tuple[int, int]:
            if node is None:
                return 0, 0
            left_rob, left_skip = solve(node.left)
            right_rob, right_skip = solve(node.right)
            robbed = node.val + left_skip + right_skip
            skipped = max(left_rob, left_skip) + max(right_rob, right_skip)
            return robbed, skipped

        return max(solve(root))
'''
