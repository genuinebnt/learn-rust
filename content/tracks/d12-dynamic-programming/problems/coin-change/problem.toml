slug = "coin-change"
title = "Coin change"
mode = "write"
level = "medium"
stage = "1d-choices"
order = 10
status = "ready"
tags = ["unbounded knapsack", "Option", "Blind 75"]
companies = ["Amazon", "Google", "Meta", "Apple", "Microsoft", "Bloomberg", "Uber", "Goldman Sachs"]
teaches = [
  "\"Fewest\" DP over amounts: each amount tries every coin as its last coin.",
  "`Option<u32>` for \"can't be made\" instead of a -1 or `u32::MAX` sentinel.",
]
constraints = ["0 ≤ coins.len() ≤ 12, all distinct", "1 ≤ coins[i] ≤ 2³¹ - 1", "0 ≤ amount ≤ 10⁵"]
follow_up = "How would you also return which coins to use? And how would BFS over amounts compare?"
related = ["D9", "S1"]

[[examples]]
input = "coins = [1, 2, 5], amount = 11"
output = "Some(3) (5 + 5 + 1)"

[[examples]]
input = "coins = [2], amount = 3"
output = "None"

[[hints]]
kind = "approach"
text = "fewest(a) = 1 + min over coins c ≤ a of fewest(a - c). Fill it for a = 0, 1, …, amount."

[[hints]]
kind = "rust"
text = "A `Vec<Option<u32>>` table keeps \"unreachable\" in the type: `filter_map` skips the `None`s and `.min().map(|n| n + 1)` stays `None` when nothing works."

[[hints]]
kind = "edge case"
text = "Taking the largest coin first fails: [1, 3, 4] for 6 is 3 + 3, not 4 + 1 + 1. A `u32::MAX` sentinel overflows when you add 1 to it."

[solution]
explanation = "Every amount is built from a smaller amount plus one coin, so a table over amounts 0..=amount answers it bottom-up. `Option` makes the unreachable case impossible to add to by accident."
time = "O(amount × coins)"
space = "O(amount)"
