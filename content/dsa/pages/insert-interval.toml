intuition = """
The intervals are already sorted and don't overlap, so the new interval falls into three zones: intervals that end **before** it starts (keep as they are), intervals that **overlap** it (merge them all into one), and intervals that start **after** it ends (keep as they are).

Walk through once: copy the ones entirely to the left, merge every overlapping one into the new interval by taking the smaller start and the larger end, add the merged interval, then copy the rest.
"""
tips = [
    "Two intervals overlap when `a.start <= b.end and b.start <= a.end`. The \"entirely left\" test is `interval.end < new.start`, and \"entirely right\" is `interval.start > new.end`.",
    "Touching counts as overlapping (`[1,2]` and `[2,3]` merge), so use `<=` in the overlap test (`<` in the left-zone test).",
    "Don't forget to append the merged interval when the loop finishes, if it was never placed.",
    "A binary search can find the insertion point in O(log n), but the merge itself is still O(n), so a linear scan is fine.",
]

[[approaches]]
name = "Three zones in one pass"
label = "one pass"
idea = "Copy intervals that end before the new one, merge the ones that overlap it, then copy the intervals that start after it."
time = "O(n)"
space = "O(n)"
time_why = "Each interval is looked at once, in one of the three zones, so a single pass."
space_why = "The output list holds up to n + 1 intervals."
note = "The output list; the scan itself uses O(1) extra."
code = '''class Solution:
    def insert(self, intervals: list[list[int]], newInterval: list[int]) -> list[list[int]]:
        result = []
        i = 0
        n = len(intervals)
        while i < n and intervals[i][1] < newInterval[0]:
            result.append(intervals[i])
            i += 1
        merged = list(newInterval)
        while i < n and intervals[i][0] <= merged[1]:
            merged[0] = min(merged[0], intervals[i][0])
            merged[1] = max(merged[1], intervals[i][1])
            i += 1
        result.append(merged)
        result.extend(intervals[i:])
        return result
'''

[[approaches]]
name = "Append, sort and merge"
label = "sort + merge"
idea = "Add the new interval to the list and run the standard Merge Intervals. Simpler to write, but it re-sorts a list that was already sorted."
time = "O(n log n)"
space = "O(n)"
time_why = "Sorting n + 1 intervals costs O(n log n), then merging is one pass."
space_why = "The sorted and merged lists each hold up to n + 1 intervals."
note = "Mention that it ignores the sorted input."
code = '''class Solution:
    def insert(self, intervals: list[list[int]], newInterval: list[int]) -> list[list[int]]:
        merged = []
        for start, end in sorted(intervals + [newInterval]):
            if merged and start <= merged[-1][1]:
                merged[-1][1] = max(merged[-1][1], end)
            else:
                merged.append([start, end])
        return merged
'''
