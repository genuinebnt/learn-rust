slug = "split-hot-from-cold"
title = "Split hot fields from cold"
mode = "fix"
level = "hard"
stage = "locality"
order = 13
status = "ready"
tags = ["hot/cold splitting", "cache lines", "PGPROC", "MVCC snapshots", "databases"]
teaches = [
  "A scan that reads 8 bytes of a 256-byte record costs a cache miss per record; moving those 8 bytes into their own dense array makes it 8 records per line.",
  "Split by access pattern, not by meaning: what every snapshot reads goes in the hot array, what `pg_stat_activity` reads stays cold.",
  "Make the hot path self-sufficient: if the scan still checks a flag in the cold record, the split buys nothing.",
]
constraints = ["up to 2¹⁷ backends", "connect only targets a free slot; begin only a backend without a transaction", "names and queries are cut to 64 and 128 bytes without splitting a character"]
follow_up = "PostgreSQL 14 also keeps the dense arrays compacted over connected backends only. What does that save when 90% of the slots are empty, and what does `disconnect` have to do to keep it dense?"
related = ["F6", "D14"]
source = "PostgreSQL PGPROC / PGXACT split (9.2) and the dense ProcGlobal arrays in 14 (procarray.c, GetSnapshotData)"

[[examples]]
input = "backends running xids 120 and 110, one holding xmin 90; oldest_xmin(200)"
output = "90"

[[examples]]
input = "the same; snapshot(200, &mut xip)"
output = "110, xip = [110, 120]"

[[hints]]
kind = "approach"
text = "Two arrays indexed by slot: a dense `Vec` of just `xid` and `xmin` (8 bytes a backend), and a `Vec` of everything else. The scans read only the first."

[[hints]]
kind = "rust"
text = "Keep the hot array self-sufficient: store 0 for a slot with no backend or no transaction, so `oldest_xmin` never has to read `connected` from the cold record. A fold with `min` over the hot array vectorizes when there's no branch: map 0 to `u32::MAX` first."

[[hints]]
kind = "edge case"
text = "`disconnect`, `connect` and `end` must reset the hot entry too, or a dead backend's xmin holds vacuum back forever."

[solution]
explanation = "The scans read `xid` and `xmin`, 8 bytes, but each backend's record is 256 bytes, so every slot is a separate cache miss and the scan moves 32 times more memory than it uses. Moving the two hot fields into their own dense array puts 8 backends in each cache line; the cold record (identity, timing, names, query) is only read when someone asks about that backend. The hot array has to stand alone: if `oldest_xmin` still checked the cold `connected` flag, it would touch every cold record again and the split would buy nothing, so disconnected and idle slots simply hold 0. Measured in the test on the x86_64 runner, `oldest_xmin` is 8–13× faster than the wide scan (the test asks for 4×) and `snapshot` 6–9× (the test asks for 2×).\n\nThis is PostgreSQL's history: in 9.2 the hot fields of `PGPROC` moved into a separate dense `PGXACT` array because `GetSnapshotData` was cache-miss bound with many connections, and in 14 they moved again into plain dense arrays (`ProcGlobal->xids`, `subxidStates`, `statusFlags`) compacted over connected backends only. The Linux kernel does the same inside single structs, grouping `sk_buff` and `task_struct` fields by which paths touch them."
time = "O(n) per scan, 8 bytes a backend"
space = "the same 256 bytes a backend, split 8 + 248"

[perf]
release = true
