slug = "invert-tree"
title = "Invert binary tree"
mode = "write"
level = "easy"
stage = "basics"
order = 4
status = "ready"
tags = ["recursion", "borrow_mut", "Blind 75"]
companies = ["Google", "Amazon", "Meta", "Microsoft"]
teaches = [
  "`borrow_mut()` to change a node behind an `Rc`.",
  "`mem::swap` on two fields of the same struct.",
]
constraints = ["0 ≤ nodes ≤ 2·10⁵", "height ≤ 10⁵"]
follow_up = "Write it iteratively with a queue. Does the order you visit nodes in matter?"
related = ["S7", "L2"]

[[examples]]
input = "root = [4,2,7,1,3,6,9]"
output = "[4,7,2,9,6,3,1]"

[[hints]]
kind = "approach"
text = "Swap the root's two children, then invert each subtree. The order doesn't matter as long as both get inverted."

[[hints]]
kind = "rust"
text = "`std::mem::swap(&mut n.left, &mut n.right)` swaps two fields of the same `RefMut`; reborrow it as `&mut *n` first so both field borrows are allowed."

[[hints]]
kind = "edge"
text = "Return the same `root` you were given; inverting changes the nodes it points to, not the root pointer."

[solution]
explanation = "The `RefCell` gives mutable access through a shared `Rc`. Swapping the `Option`s moves two pointers, no subtree is copied."
time = "O(n)"
space = "O(h)"
