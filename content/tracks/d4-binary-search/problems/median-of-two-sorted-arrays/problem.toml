slug = "median-of-two-sorted-arrays"
title = "Median of two sorted arrays"
mode = "write"
level = "hard"
stage = "hard-searches"
order = 11
status = "ready"
tags = ["partition search"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Adobe", "Bloomberg", "Goldman Sachs"]
teaches = [
  "Binary search over a partition, not a value.",
  "Sentinels that can't collide: widen the type.",
]
follow_up = "Generalise this to the k-th smallest element of the union."

[[hints]]
kind = "approach"
text = "Split both arrays so the left parts together hold half the elements. The split is right when every left value ≤ every right value."

[[hints]]
kind = "approach"
text = "Binary search the split point in the shorter array; the other array's split follows from it."

[[hints]]
kind = "edge case"
text = "At the ends, use −∞/+∞ sentinels. Widen to `i64` first, or `i32::MIN` in the data collides with the sentinel."

[solution]
explanation = "Searching the shorter array bounds the work by O(log min). Widening to `i64` also keeps `left + right` from overflowing for extreme values."
time = "O(log min(m, n))"
space = "O(1)"
