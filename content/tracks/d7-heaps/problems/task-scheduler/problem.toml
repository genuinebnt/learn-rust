[[examples]]
input = "tasks = \"AAAAAABCDEFG\", n = 2"
output = "16"

[[hints]]
kind = "approach"
text = "The most frequent task sets the frame: `most − 1` gaps of `n + 1` slots, plus one slot per task tied for most. With enough different tasks there are no idles at all."

[[hints]]
kind = "rust"
text = "For the schedule: a `BinaryHeap<(usize, char)>` of ready tasks by runs left, and a `VecDeque` of `(ready_at, left, id)` for tasks cooling down. Each slot, move ready ones back, then pop."

[[hints]]
kind = "edge case"
text = "Ids aren't limited to `A`–`Z`; `c as u8 - b'A'` panics on `'é'`. And never finish on an idle slot."

[solution]
explanation = "Counting: the most frequent task needs `most − 1` gaps of `n + 1` slots, and the tasks tied with it fill the last frame; other tasks fit in the gaps, and if they overflow them no idle is needed at all, so the answer is `max(len, (most − 1)(n + 1) + tied)`. The schedule comes from the greedy \"run the ready task with the most runs left\": the heap holds ready tasks, the queue holds cooling ones in the order they wake up. Each slot costs O(log k) for k different tasks."
time = "O(len) to count, O(T log k) to schedule T slots"
space = "O(k)"
