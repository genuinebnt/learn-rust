code = "3e"
title = "Access-method executors"
summary = "The operators that touch tables: a sequential scan (with a pushed-down predicate), insert, delete and update that keep every index in step, and an index scan that reads in key order or looks keys up. BusTub Project 3, task 1: the first queries that read and write real data."
lectures = ["queryexecution1", "indexes1"]
bustub = ["src/include/execution/executors/seq_scan_executor.h", "src/execution/seq_scan_executor.cpp", "src/include/execution/executors/insert_executor.h", "src/execution/insert_executor.cpp", "src/execution/update_executor.cpp", "src/execution/delete_executor.cpp", "src/execution/index_scan_executor.cpp", "src/include/execution/plans/seq_scan_plan.h", "src/include/execution/plans/index_scan_plan.h", "test/sql/p3.00-primer.slt", "test/sql/p3.01-seqscan.slt", "test/sql/p3.02-insert.slt", "test/sql/p3.03-update.slt", "test/sql/p3.04-delete.slt"]
files = [
    "tests/sql/p3.00-primer.slt",
    "tests/sql/p3.01-seqscan.slt",
    "tests/sql/p3.02-insert.slt",
    "tests/sql/p3.03-update.slt",
    "tests/sql/p3.04-delete.slt",
]

