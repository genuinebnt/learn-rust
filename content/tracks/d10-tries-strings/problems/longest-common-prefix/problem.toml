slug = "longest-common-prefix"
title = "Longest common prefix"
mode = "write"
level = "easy"
stage = "first-tries"
order = 1
status = "ready"
tags = ["&str", "chars"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Adobe", "Bloomberg"]
teaches = [
  "Return a slice of the input (`&'a str`) instead of building a new `String`.",
  "Compare `chars()`, not bytes, so the prefix never ends inside a character.",
]
constraints = ["0 ≤ strs.len() ≤ 10⁵", "total length ≤ 2·10⁶ bytes"]
follow_up = "If you had to answer this query many times for a changing set of strings, what structure would you keep?"
related = ["S2", "L3"]

[[examples]]
input = "strs = [\"flower\", \"flow\", \"flight\"]"
output = "\"fl\""

[[examples]]
input = "strs = [\"dog\", \"racecar\", \"car\"]"
output = "\"\""

[[hints]]
kind = "approach"
text = "Start with the first string as the answer and shorten it against each of the others."

[[hints]]
kind = "rust"
text = "`a.chars().zip(b.chars()).take_while(|(x, y)| x == y)` walks the shared characters; sum their `len_utf8()` to get a byte length you can slice with."

[[hints]]
kind = "edge case"
text = "`\"café\"` and `\"cafè\"` share a first byte inside the last character. Slicing at a byte count there panics."

[solution]
explanation = "The answer is a prefix of the first string, so it can be a slice of it: no allocation. Shortening against each string touches every character at most once. Comparing `char`s keeps the cut on a character boundary."
time = "O(total length)"
space = "O(1)"
