slug = "utf8-chunk-decoder"
title = "Decode UTF-8 that arrives in chunks"
mode = "write"
level = "medium"
stage = "understand"
order = 18
status = "ready"
tags = ["from_utf8", "Utf8Error", "valid_up_to", "error_len", "from_utf8_lossy"]
teaches = [
  "`str::from_utf8` fails with a `Utf8Error` that says how much was valid (`valid_up_to`) and whether the rest is bad (`error_len() == Some(n)`) or just cut short (`None`).",
  "A character split across two reads is not an error: keep its first bytes until the next chunk arrives.",
  "Decoding each chunk with `from_utf8_lossy` on its own corrupts every character that straddles a boundary.",
]
follow_up = "`std::str::from_utf8(good).unwrap()` re-validates bytes that were just validated. When is `from_utf8_unchecked` justified here, and what would you write in its `// SAFETY:` comment?"
related = ["S1"]

[[examples]]
input = "push([0xC3]), push([0xA9]), finish"
output = "\"é\""

[[examples]]
input = "push(b\"a\\xffb\"), finish"
output = "\"a\\u{FFFD}b\""

[[examples]]
input = "push([0x61, 0xE2, 0x82]), finish"
output = "\"a\\u{FFFD}\""

[[hints]]
kind = "rust"
text = "`std::str::from_utf8(bytes)` → `Err(e)`: `&bytes[..e.valid_up_to()]` is valid UTF-8. `e.error_len()` is `Some(n)` for `n` bad bytes to replace and skip, `None` when the input just ended mid-character."

[[hints]]
kind = "approach"
text = "Keep the unfinished bytes in a small `Vec<u8>`. On the next push, put them in front of the new chunk and decode from there."

[[hints]]
kind = "edge case"
text = "The held bytes may turn out invalid once the next byte arrives (`[0xE2]` then `b\"A\"` is `\"\\u{FFFD}A\"`): decode them, don't assume they'll complete."

[solution]
explanation = "`from_utf8` doesn't just say \"invalid\": `valid_up_to()` is how many bytes are fine, and `error_len()` distinguishes a real error (`Some(n)`: replace and skip `n` bytes, which is how `from_utf8_lossy` produces one U+FFFD per maximal invalid subpart) from a truncated character (`None`: wait for more). That second case is the whole job of a streaming decoder, and the difference between this and calling `from_utf8_lossy` on each read. This version copies the chunk behind the held bytes when there are any; a tighter one completes just the held character from the first 1–3 bytes of the chunk and decodes the rest in place. `BufRead::read_line` has the same problem and solves it by buffering. Syntax to remember: `std::str::from_utf8(&b)` → `Result<&str, Utf8Error>`, `String::from_utf8(vec)` (takes ownership, `into_bytes()` on the error gives it back), `e.valid_up_to()`, `e.error_len()`, `String::from_utf8_lossy(&b)` → `Cow<str>`, `char::REPLACEMENT_CHARACTER`, `std::str::from_utf8_unchecked` (unsafe)."
time = "O(n) over all chunks"
space = "O(1) held between chunks"
