slug = "sorted-array-to-bst"
title = "Convert sorted array to BST"
mode = "write"
level = "easy"
stage = "basics"
order = 7
status = "ready"
tags = ["divide and conquer", "slices", "BST"]
companies = ["Amazon", "Google", "Microsoft"]
teaches = [
  "Divide and conquer on sub-slices.",
  "Why picking the middle keeps the tree balanced.",
]
constraints = ["0 ≤ nums.len() ≤ 2·10⁵", "nums is strictly increasing"]
follow_up = "Build the same tree from a sorted linked list without converting it to a `Vec` first."
related = ["S3", "D4"]

[[examples]]
input = "nums = [-10,-3,0,5,9]"
output = "[0,-3,9,-10,null,5]"

[[hints]]
kind = "approach"
text = "Pick the middle element as the root; everything left of it goes in the left subtree, everything right of it in the right."

[[hints]]
kind = "rust"
text = "Recurse on sub-slices `&nums[..mid]` and `&nums[mid + 1..]`: no copying, no index bookkeeping."

[[hints]]
kind = "edge"
text = "For an even length, `len / 2` is the upper of the two middles: `[1,3]` gives root 3."

[solution]
explanation = "Splitting at the middle keeps the two halves within one element of each other, so the tree is height-balanced; the sorted order makes it a BST."
time = "O(n)"
space = "O(log n) recursion"
