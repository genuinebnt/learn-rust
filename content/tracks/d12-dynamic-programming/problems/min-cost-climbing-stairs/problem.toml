slug = "min-cost-climbing-stairs"
title = "Min cost climbing stairs"
mode = "write"
level = "easy"
stage = "1d-basics"
order = 3
status = "ready"
tags = ["1-D DP"]
companies = ["Amazon", "Google", "Microsoft", "Adobe"]
teaches = [
  "The DP state is \"cheapest cost to stand here\"; the answer is a state past the last index.",
  "Widening to `u64` once, at the accumulator.",
]
constraints = ["0 ≤ cost.len() ≤ 2·10⁵", "0 ≤ cost[i] ≤ 10⁴"]
follow_up = "How would you also return which steps you stepped on?"
related = ["D11"]

[[examples]]
input = "cost = [10, 15, 20]"
output = "15 (start on step 1, pay 15, climb 2)"

[[hints]]
kind = "approach"
text = "Let reach(i) be the cheapest way to stand on step i. reach(0) = reach(1) = 0, and reach(i) = min(reach(i-1) + cost[i-1], reach(i-2) + cost[i-2]). The answer is reach(n)."

[[hints]]
kind = "rust"
text = "Keep two `u64`s and convert each cost with `as u64` as you add it."

[[hints]]
kind = "edge case"
text = "With 0 or 1 steps you are already at the top: the answer is 0."

[solution]
explanation = "The state is where you stand, and the cost is paid when you leave a step. The top is index n, one past the end, so the loop runs up to n inclusive."
time = "O(n)"
space = "O(1)"
