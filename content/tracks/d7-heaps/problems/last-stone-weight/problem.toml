slug = "last-stone-weight"
title = "Last stone weight"
mode = "write"
level = "easy"
stage = "heap-basics"
order = 2
status = "ready"
tags = ["BinaryHeap", "simulation"]
companies = ["Amazon", "Google", "Microsoft"]
teaches = [
  "`BinaryHeap::from(vec)` heapifies in O(n), faster than n pushes.",
  "`let … else` to stop when the second pop comes back empty.",
  "`Option<u32>` for \"no stone left\" instead of 0.",
]
constraints = ["0 ≤ stones.len() ≤ 2·10⁵", "1 ≤ stones[i] ≤ 10⁹"]
follow_up = "Last stone weight II lets you pick any two stones each turn and asks for the smallest possible result. Why does a heap no longer help?"
related = ["S5", "D12"]

[[examples]]
input = "stones = [2, 7, 4, 1, 8, 1]"
output = "Some(1)"

[[examples]]
input = "stones = [3, 3]"
output = "None"

[[hints]]
kind = "approach"
text = "You need the two largest stones over and over while new stones arrive: a max-heap."

[[hints]]
kind = "rust"
text = "`BinaryHeap::from(stones.to_vec())` builds the heap in O(n). Pop `y`, then `let Some(x) = heap.pop() else { return Some(y) };`."

[[hints]]
kind = "edge case"
text = "Equal stones leave nothing. Pushing a 0 back would turn `None` into `Some(0)`."

[solution]
explanation = "Every turn removes at least one stone, so there are at most n turns of O(log n) each. `BinaryHeap::from` reuses the vector's buffer and heapifies bottom-up in O(n). Returning `Option` keeps \"nothing left\" out of the weight range."
time = "O(n log n)"
space = "O(n)"
