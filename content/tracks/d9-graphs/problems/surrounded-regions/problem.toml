[[examples]]
input = "board = [\"XXXX\", \"XOOX\", \"XXOX\", \"XOXX\"]"
output = "[\"XXXX\", \"XXXX\", \"XXXX\", \"XOXX\"]"

[[hints]]
kind = "approach"
text = "An 'O' survives exactly when it's connected to an 'O' on the border. Start from the border and mark what you reach."

[[hints]]
kind = "approach"
text = "Then one pass flips every unmarked 'O' to 'X'."

[[hints]]
kind = "rust"
text = "Collect the border cells into the initial stack with `flat_map` and `chain`; a separate `safe` grid keeps `board` untouched until the final pass."

[solution]
explanation = "Asking each region whether it escapes means one search per region; searching once from the border answers it for all of them. Every cell is visited at most once."
time = "O(rows · cols)"
space = "O(rows · cols)"
