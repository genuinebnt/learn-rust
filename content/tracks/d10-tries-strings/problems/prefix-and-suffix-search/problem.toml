slug = "prefix-and-suffix-search"
title = "Prefix and suffix search"
mode = "write"
level = "medium"
stage = "tries-at-work"
order = 11
status = "ready"
tags = ["trie", "design"]
companies = ["Meta", "Google"]
teaches = [
  "Turn a two-sided query into a one-sided one: store `suffix + '{' + word` so one trie walk checks both ends.",
  "`[Option<Box<Node>>; 27]`: `'{'` is the byte after `'z'`, so it gets index 26.",
]
constraints = ["1 ≤ words.len() ≤ 10⁴", "1 ≤ words[i].len() ≤ 7", "prefix, suffix: 0–7 lowercase letters", "up to 2·10⁵ calls to f"]
follow_up = "A `HashMap<(String, String), usize>` of every prefix/suffix pair also works. Compare its memory with the trie's."
related = ["S4"]

[[examples]]
input = "words = [\"apple\"], f(\"a\", \"e\")"
output = "Some(0)"

[[hints]]
kind = "approach"
text = "For each word and each of its suffixes, insert `suffix + '{' + word` into one trie. A query walks `suffix + '{' + prefix`: the separator ends the suffix part and the rest is a prefix of the word."

[[hints]]
kind = "rust"
text = "`'{'` is `b'z' + 1`, so `(b - b'a') as usize` gives it index 26 in a 27-slot array. `w[start..].bytes().chain([b'{']).chain(w.bytes())` builds each key without allocating."

[[hints]]
kind = "edge case"
text = "Write the index into every node on the path as you insert words in order: later words overwrite, so each node holds the largest index."

[solution]
explanation = "A word of length L makes L + 1 keys of length at most 2L + 1, so building is O(n · L²) and each query is O(|prefix| + |suffix|), independent of n. Scanning the words per query is O(n · L) each, too slow for 2·10⁵ queries."
time = "build O(n · L²), query O(|prefix| + |suffix|)"
space = "O(n · L² × 27)"
