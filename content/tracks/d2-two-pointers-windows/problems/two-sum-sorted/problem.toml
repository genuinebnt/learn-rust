slug = "two-sum-sorted"
title = "Two sum II (sorted input)"
mode = "write"
level = "medium"
stage = "pointers"
order = 6
status = "ready"
tags = ["two pointers"]
teaches = [
  "On sorted input, move the pointer that brings the sum toward the target.",
  "O(1) space versus the hash-map version.",
]
constraints = ["0 ≤ nums.len() ≤ 2·10⁵", "at most one pair sums to target"]
follow_up = "Prove that moving the smaller side never skips the answer."
related = ["D1"]

[[examples]]
input = "nums = [2, 7, 11, 15], target = 9"
output = "Some((0, 1))"

[[hints]]
kind = "approach"
text = "Start at both ends. If the sum is too small, which pointer should move?"

[[hints]]
kind = "edge case"
text = "Two i32s can overflow when added; widen first."

[solution]
explanation = "Each step discards one candidate that can't be part of the answer. `match` on `Ordering` reads better than nested ifs."
time = "O(n)"
space = "O(1)"
