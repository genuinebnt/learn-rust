slug = "maximum-subarray"
title = "Maximum subarray"
mode = "write"
level = "easy"
stage = "first-greedy"
order = 5
status = "ready"
tags = ["Kadane", "greedy", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "LinkedIn", "Bloomberg"]
teaches = [
  "Kadane's rule: drop a running sum the moment it would only drag the next element down.",
  "`split_first()?` returns `None` for an empty slice in one step.",
]
constraints = ["0 ≤ nums.len() ≤ 2·10⁵", "nums[i] is any i32"]
follow_up = "How would you also return the start and end indices of the best run?"
related = ["D12", "D2"]

[[examples]]
input = "nums = [-2, 1, -3, 4, -1, 2, 1, -5, 4]"
output = "Some(6)"

[[examples]]
input = "nums = [5, 4, -1, 7, 8]"
output = "Some(23)"

[[hints]]
kind = "approach"
text = "At each element decide: extend the best run ending just before it, or start fresh here. Start fresh when the previous run's sum is negative."

[[hints]]
kind = "rust"
text = "Work in `i64` so the sum can't overflow; `let (&first, rest) = nums.split_first()?;` handles the empty slice."

[[hints]]
kind = "edge case"
text = "When every number is negative the answer is the largest single number, not 0."

[solution]
explanation = "`current` is the best sum of a run ending at this element: either the element alone or the element plus the best run ending just before it. The answer is the best `current` seen."
time = "O(n)"
space = "O(1)"
