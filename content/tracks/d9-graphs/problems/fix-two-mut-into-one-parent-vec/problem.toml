slug = "fix-two-mut-into-one-parent-vec"
title = "Fix: two &mut into one parent Vec"
mode = "fix"
level = "hard"
stage = "union-find-mst"
order = 41
status = "ready"
tags = ["E0499", "recursion"]
teaches = [
  "A `&mut` into a Vec element blocks every other use of the Vec.",
  "Copy the index out, recurse, then write back.",
]
follow_up = "Rewrite `find` without recursion. Which version would you ship?"
related = ["L2"]

[[hints]]
kind = "rust"
text = "`p` is a `&mut` into `parent`, and the recursive call needs all of `parent` while `p` is still alive."

[[hints]]
kind = "approach"
text = "Read the parent index as a plain `usize`, recurse, then write the result back with a fresh index."

[solution]
explanation = "Copying the `usize` out ends the borrow before the recursive call; the write afterwards is a new, short borrow. Recursion depth is the path length, fine once union keeps trees shallow."
time = "O(α(n)) amortised"
space = "O(depth) stack"

[rules]
forbid_methods = ["clone", "to_vec"]
