slug = "fix-heap-ordering-with-a-custom-ord"
title = "Fix: heap ordering with a custom Ord"
mode = "fix"
level = "medium"
stage = "shortest-paths"
order = 31
status = "ready"
tags = ["Ord", "PartialOrd", "BinaryHeap"]
teaches = [
  "`PartialOrd` must agree with `Ord`.",
  "Tie-breaks belong in `cmp`, or `Eq` and `Ord` disagree.",
]
follow_up = "When would you reach for `Reverse` instead of a hand-written `Ord`?"
related = ["L4", "D7"]

[[hints]]
kind = "rust"
text = "`BinaryHeap` compares with `<` and `<=`, which come from `PartialOrd`, not `Ord`. Here the two disagree."

[[hints]]
kind = "rust"
text = "Implement `partial_cmp` as `Some(self.cmp(other))` so there's one source of truth."

[[hints]]
kind = "rust"
text = "`Eq` says two jobs with different names differ, so `cmp` must not call them `Equal`: add `.then_with(...)` on the name."

[solution]
explanation = "The contract: `partial_cmp` agrees with `cmp`, and `cmp` returns `Equal` exactly when `==` holds. Breaking it isn't undefined behaviour, but heaps, sorts and maps give wrong answers. Clippy flags the first half with `non_canonical_partial_ord_impl`."
time = "O(n log n)"
space = "O(n)"

[rules]
forbid_types = ["Reverse"]
