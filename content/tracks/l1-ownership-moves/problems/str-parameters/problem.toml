[[hints]]
kind = "rust"
text = "`&String` derefs to `&str`, but a `&str` can't become a `&String`. Take `&str`, and return `&str` slices of it: elision ties the output to the input."

[[hints]]
kind = "rust"
text = "For `join_nonempty`, a generic `S: AsRef<str>` accepts `&[&str]` and `&[String]`. For `count_word`, take `I: IntoIterator` with `I::Item: AsRef<str>`."

[solution]
explanation = "`&str` is the parameter for text you only read: literals are `&str`, and `&String` coerces to it. Returning a slice of the input (`split_whitespace().next()`, `rsplit_once`) costs nothing, and elision ties the result's lifetime to the parameter. For collections, `AsRef<str>` accepts both element types, and `IntoIterator` with an `AsRef<str>` item accepts owned vectors, borrowed vectors and lazy iterators alike.\n\nSyntax to remember: `fn join_nonempty<S: AsRef<str>>(parts: &[S], sep: &str) -> String` · `fn count_word<I>(words: I, needle: &str) -> usize where I: IntoIterator, I::Item: AsRef<str>` · `name.rsplit_once('.')?`."
time = "O(n)"
space = "O(1) except the joined String"
