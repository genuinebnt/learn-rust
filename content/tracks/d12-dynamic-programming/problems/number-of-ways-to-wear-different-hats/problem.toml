slug = "number-of-ways-to-wear-different-hats"
title = "Number of ways to wear different hats"
mode = "write"
level = "hard"
stage = "bitmasks-digits"
order = 50
status = "ready"
tags = ["bitmask DP", "modulo"]
companies = ["Google", "Amazon"]
teaches = [
  "Putting the bitmask on the small side: 10 people fit a mask, 40 hats don't.",
  "Walking masks downwards so each hat is used at most once, as in 0/1 knapsack.",
]
constraints = ["0 ≤ hats.len() ≤ 10", "1 ≤ hats[i][j] ≤ 40", "each hats[i] has distinct values"]
follow_up = "If there were 40 people and 10 hats, which side would the mask go on, and what would the answer be?"
related = ["D11", "D13"]

[[examples]]
input = "hats = [[3, 4], [4, 5], [5]]"
output = "1 (hat 3, then 4, then 5)"

[[examples]]
input = "hats = [[3, 5, 1], [3, 5]]"
output = "4"

[[hints]]
kind = "approach"
text = "There are at most 10 people but 40 hats, so keep a mask of which people are dressed and hand the hats out one at a time: each hat goes to nobody or to one person who likes it and isn't dressed yet."

[[hints]]
kind = "rust"
text = "`likes[h]` as a people-mask; `ways: Vec<u64>` of length `1 << n`; `mask & mask.wrapping_neg()` isolates the lowest set bit."

[[hints]]
kind = "edge case"
text = "Go through the masks from high to low for each hat, or the same hat gets handed to two people. Reduce modulo 1 000 000 007 as you add."

[solution]
explanation = "A mask over hats would have 2⁴⁰ states; a mask over people has 2¹⁰. Each of the 40 hats updates every mask once per person who likes it."
time = "O(40 · 2ⁿ · n)"
space = "O(2ⁿ)"
