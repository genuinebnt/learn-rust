slug = "first-missing-positive"
title = "First missing positive"
mode = "write"
level = "hard"
stage = "in-place"
order = 22
status = "ready"
tags = ["in place", "swap"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Oracle"]
teaches = [
  "Use the array itself as the hash: put value v at index v − 1.",
  "`swap` in a `while` until the slot is right.",
]
follow_up = "Why is the answer always at most n + 1?"
related = ["S3"]

[[examples]]
input = "nums = [3, 4, -1, 1]"
output = "2"

[[hints]]
kind = "approach"
text = "The answer is in 1..=n+1. Can each value v in that range live at index v − 1?"

[[hints]]
kind = "edge case"
text = "Duplicates would swap forever; stop when the target slot already holds the value."

[solution]
explanation = "Each swap puts one value in its final slot, so there are at most n swaps in total."
time = "O(n)"
space = "O(1)"
