slug = "fix-conflicting-impls"
title = "Fix: a blanket impl that conflicts (E0119)"
mode = "fix"
level = "hard"
stage = "coherence-extension"
order = 18
status = "ready"
tags = ["E0119", "coherence", "blanket impls", "?Sized"]
teaches = [
  "Blanket impls overlap any other impl whose type could meet their bound, even in a future std.",
  "Concrete impls via a macro, or a newtype, resolve E0119 on stable.",
]
follow_up = "Why does `impl<T: Display> ToString for T` in std not conflict with anything, while yours does?"
related = ["L10", "S8"]

[[hints]]
kind = "approach"
text = "Two overlapping impls can't both exist, so one side has to go. The containers are the point of the trait; drop the blanket and implement `Label` for each printable type instead (a small `macro_rules!` keeps it short)."

[[hints]]
kind = "rust"
text = "`\"hi\".label()` and `vec![\"a\"]` need `str` and `&str` covered: `impl Label for str` plus a forwarding `impl<T: Label + ?Sized> Label for &T`. Neither overlaps `Vec<T>` or `Option<T>`."

[solution]
explanation = "Coherence forbids two impls that could apply to the same type. For `impl<T: Display> Label for T` and `impl<T: Label> Label for Vec<T>`, the compiler has to assume `Vec<T>` might implement `Display` one day (std is allowed to add that), so they may overlap. Specialization, which would pick the more specific impl, is unstable. The stable options are concrete impls (often generated by a macro, as std does for numbers), a newtype around one side, or a separate trait.\n\nSyntax: `macro_rules! m { ($($t:ty),*) => { $(impl Label for $t { .. })* }; }` · `impl<T: Label + ?Sized> Label for &T { fn label(&self) -> String { (**self).label() } }`."
time = "O(output)"
space = "O(output)"
