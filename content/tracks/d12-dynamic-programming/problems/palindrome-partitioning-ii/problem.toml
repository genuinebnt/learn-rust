slug = "palindrome-partitioning-ii"
title = "Palindrome partitioning II"
mode = "write"
level = "hard"
stage = "intervals-games"
order = 43
status = "ready"
tags = ["1-D DP", "palindromes"]
companies = ["Amazon", "Google", "Microsoft", "Meta", "Bloomberg"]
teaches = [
  "Combining two DPs: which substrings are palindromes, and the fewest pieces for each prefix.",
  "Expanding around each centre to visit every palindrome once, in O(n²) total.",
]
constraints = ["0 ≤ s.len() ≤ 2000", "s is ASCII lowercase letters"]
follow_up = "How would you list one optimal partition? And all partitions (Palindrome partitioning I, a backtracking problem)?"
related = ["D11", "D10"]

[[examples]]
input = "s = \"aab\""
output = "1 (\"aa\" | \"b\")"

[[hints]]
kind = "approach"
text = "pieces(k) = the fewest palindromes for s[..k] = 1 + min over palindromes s[j..k] of pieces(j). The answer is pieces(n) - 1."

[[hints]]
kind = "rust"
text = "Instead of testing every (j, k), expand around each centre (odd and even); every palindrome s[lo..=hi] you reach updates `pieces[hi + 1]` from `pieces[lo]`."

[[hints]]
kind = "edge case"
text = "Cutting off the longest palindrome first is greedy and can cost more: \"bbab\" → \"bb\" | \"a\" | \"b\" (2 cuts) instead of \"b\" | \"bab\" (1)."

[solution]
explanation = "Centre expansion visits each palindrome once in O(1) and stops at the first mismatch, so the whole thing is O(n²) with O(n) memory. Palindromes ending at lo - 1 have centres before the current one, so pieces[lo] is final when it's read."
time = "O(n²)"
space = "O(n)"
