slug = "shortest-path-visiting-all-nodes"
title = "Shortest path visiting all nodes"
mode = "write"
level = "hard"
stage = "bitmasks-digits"
order = 49
status = "ready"
tags = ["BFS on states", "bitmask"]
companies = ["Google", "Amazon", "Meta"]
teaches = [
  "BFS over (node, visited set) states, with the set as a bitmask.",
  "Multi-source BFS: start from every node at distance 0.",
]
constraints = ["0 ≤ graph.len() ≤ 12", "the graph is connected, with no self-loops or repeated edges", "v is in graph[u] exactly when u is in graph[v]"]
follow_up = "How would you solve it with weighted edges? (Held–Karp: all-pairs distances, then a DP over (mask, last).)"
related = ["D9"]

[[examples]]
input = "graph = [[1, 2, 3], [0], [0], [0]]"
output = "4 (1 → 0 → 2 → 0 → 3)"

[[examples]]
input = "graph = [[1], [0, 2, 4], [1, 3, 4], [2], [1, 2]]"
output = "4 (0 → 1 → 4 → 2 → 3)"

[[hints]]
kind = "approach"
text = "Where you are isn't enough to describe progress; where you are plus which nodes you've visited is. BFS over those (node, mask) states from every node at once; the first state with every bit set gives the answer."

[[hints]]
kind = "rust"
text = "`1usize << n` masks; `seen: Vec<Vec<bool>>` indexed `[node][mask]`; a `VecDeque<(usize, usize, usize)>` of (node, mask, distance)."

[[hints]]
kind = "edge case"
text = "The walk may revisit nodes (a star needs to), and it may start anywhere, so seed the queue with every node. One node (or none) needs 0 edges."

[solution]
explanation = "There are n · 2ⁿ states and each has at most n - 1 neighbours, so BFS over them is exact and fast for n ≤ 12, while trying visiting orders is n!."
time = "O(2ⁿ · n²)"
space = "O(2ⁿ · n)"
