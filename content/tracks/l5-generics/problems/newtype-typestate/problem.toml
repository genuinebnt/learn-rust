tags = ["newtype", "typestate", "PhantomData"]
teaches = [
  "Newtypes with private fields for validated values.",
  "Typestate transitions that consume `self`, including fallible ones that hand the value back.",
]
follow_up = "When is typestate the wrong tool? Compare it with an enum state machine for an account whose state comes from a database row."
