code = "3i"
title = "The SQL surface"
summary = "The everyday SQL that BusTub's engine does not run, added to your engine in six steps: the operators it left out (`*`, `/`, `%`, `||`, `NOT`, unary minus, `IS NULL`), `BETWEEN` and `IN` with their NULL traps, `CASE`, `COALESCE` and `NULLIF`, `LIKE` without exponential backtracking, `OFFSET` and `DISTINCT` aggregates, and then two tools: `EXPLAIN ANALYZE` and prepared statements. The boss checks the whole surface against a model of three-valued logic. New in this course: none of it is in BusTub's projects."
lectures = ["modernsql", "queryexecution1"]
