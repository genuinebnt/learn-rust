slug = "implement-trie"
title = "Implement trie"
mode = "write"
level = "easy"
stage = "first-tries"
order = 2
status = "ready"
tags = ["trie", "Box", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Bloomberg", "Uber"]
teaches = [
  "A node is `[Option<Box<Node>>; 26]` plus an end-of-word flag.",
  "`get_or_insert_with` creates a child and hands back a cursor in one step.",
]
constraints = ["words and prefixes: 0–100 lowercase ASCII letters", "up to 10⁵ calls"]
follow_up = "Twenty-six pointers per node is a lot when most are `None`. What would you use instead, and what does each choice cost?"
related = ["S7", "S4"]

[[examples]]
input = "insert \"apple\"; search \"apple\", search \"app\", starts_with \"app\""
output = "true, false, true"

[[hints]]
kind = "approach"
text = "Each node has one slot per letter and a flag saying a word ends here. Insert walks down, creating missing nodes; search walks down and checks the flag."

[[hints]]
kind = "rust"
text = "`node = node.children[i].get_or_insert_with(Default::default);` moves a `&mut` cursor one level down. For lookups, `children[i].as_deref()?` turns `&Option<Box<Node>>` into `Option<&Node>`."

[[hints]]
kind = "edge case"
text = "`search` and `starts_with` share the walk; they differ only in whether the last node must end a word."

[solution]
explanation = "A trie shares common prefixes, so every operation costs O(length of the word) no matter how many words are stored. `[Option<Box<Node>>; 26]` gives O(1) child lookup; `derive(Default)` builds an empty node because arrays up to 32 elements implement `Default`."
time = "O(L) per call"
space = "O(total letters inserted × 26)"
