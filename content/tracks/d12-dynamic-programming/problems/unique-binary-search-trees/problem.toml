slug = "unique-binary-search-trees"
title = "Unique binary search trees"
mode = "write"
level = "medium"
stage = "intervals-games"
order = 40
status = "ready"
tags = ["Catalan", "1-D DP"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "Apple", "Bloomberg"]
teaches = [
  "Splitting on the root: the left and right subtrees are independent smaller problems.",
  "A sum of products over every split, the pattern behind the interval DPs in this stage.",
]
constraints = ["0 ≤ n ≤ 36"]
follow_up = "How would you build every such tree (Unique binary search trees II), and how many are there for n = 8?"
related = ["D6", "D13"]

[[examples]]
input = "n = 3"
output = "5"

[[hints]]
kind = "approach"
text = "Choose the root r. The keys below it form the left subtree (r - 1 keys) and the keys above form the right (n - r keys); multiply their counts and add over every r."

[[hints]]
kind = "rust"
text = "Fill a `Vec<u64>` from 0 up with `(0..k).map(|l| trees[l] * trees[k - 1 - l]).sum()`."

[[hints]]
kind = "edge case"
text = "trees[0] = 1: an empty side is one shape, not zero, or every tree with a leaf root disappears."

[solution]
explanation = "Only the number of keys on each side matters, not which keys, so the state is one integer. These are the Catalan numbers."
time = "O(n²)"
space = "O(n)"
