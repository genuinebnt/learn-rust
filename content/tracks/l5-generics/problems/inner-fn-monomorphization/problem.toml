tags = ["monomorphization", "dyn vs generics", "io::Read"]
teaches = [
  "Monomorphization cost and the non-generic inner function trick.",
  "`&mut dyn Read` vs `R: Read`.",
  "Readers can return short reads and `Interrupted`.",
]
follow_up = "When is the generic version the better choice, despite the code size? What does `impl Read` in argument position change for callers (hint: turbofish)?"
