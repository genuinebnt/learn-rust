slug = "combination-sum-iii"
title = "Combination sum III"
mode = "write"
level = "medium"
stage = "choices-grids"
order = 15
status = "ready"
tags = ["backtracking", "pruning"]
companies = ["Meta", "Amazon", "Google", "Microsoft"]
teaches = [
  "Two limits at once: exactly k numbers and exactly the sum n.",
  "Prune on both: stop when the path is full or the next digit is already too big.",
]
constraints = ["1 ≤ k ≤ 9", "1 ≤ n ≤ 60"]
follow_up = "Could you answer this with one pass over the 512 bitmasks instead? What does that trade?"
related = ["D12"]

[[examples]]
input = "k = 3, n = 7"
output = "[[1, 2, 4]]"

[[examples]]
input = "k = 3, n = 9"
output = "[[1, 2, 6], [1, 3, 5], [2, 3, 4]]"

[[examples]]
input = "k = 4, n = 1"
output = "[]"

[[hints]]
kind = "approach"
text = "Choose digits in increasing order from `next` to 9; stop when you have k of them and check the sum."

[[hints]]
kind = "rust"
text = "`fn go(next: u32, k: usize, left: u32, path: &mut Vec<u32>, out: &mut Vec<Vec<u32>>)`; `break` once `d > left`."

[[hints]]
kind = "edge case"
text = "A full path whose sum is not n is a dead end, and so is a sum reached with fewer than k digits."

[solution]
explanation = "There are only 2⁹ subsets of the digits, so any correct search is fast; pruning on the remaining sum and the count keeps it to the useful branches."
time = "O(C(9, k) · k)"
space = "O(k)"
