slug = "word-search-ii"
title = "Word search II"
mode = "write"
level = "hard"
stage = "hard-tries-strings"
order = 18
status = "ready"
tags = ["trie", "backtracking", "grid", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Airbnb", "Uber"]
teaches = [
  "One depth-first search over the board, steered by a trie of all the words, instead of one search per word.",
  "Prune the trie as words are found: a branch with nothing left to find is cut, so later searches stop at once.",
]
constraints = ["0 ≤ rows, columns ≤ 12, all rows the same length", "0 ≤ words.len() ≤ 3·10⁴", "1 ≤ words[i].len() ≤ 16, lowercase ASCII"]
follow_up = "If the board were huge and fixed and the words arrived one query at a time, what would you precompute instead?"
related = ["D11", "D9"]

[[examples]]
input = "board = [\"oaan\", \"etae\", \"ihkr\", \"iflv\"], words = [\"oath\", \"pea\", \"eat\", \"rain\"]"
output = "[\"eat\", \"oath\"]"

[[examples]]
input = "board = [\"ab\", \"cd\"], words = [\"abcb\"]"
output = "[]"

[[hints]]
kind = "approach"
text = "Put all the words in a trie, then start a depth-first search from every cell, moving down the trie as you move across the board. A cell's letter with no matching child ends that branch."

[[hints]]
kind = "rust"
text = "Mark the current path by writing `b'#'` into a `Vec<Vec<u8>>` copy of the board and restore the letter on the way back. Pass `&mut Node` down the recursion; `child.word.take()` reports each word once."

[[hints]]
kind = "edge case"
text = "Count, in each node, the words still unfound below it, and drop the child (`node.children[i] = None`) when that reaches 0. On a board full of one letter this is the difference between stopping after the first path and exploring every path."

[solution]
explanation = "The trie lets one search check every word at once: a path is abandoned as soon as it isn't a prefix of any remaining word. Removing found words keeps the trie as small as what's left to find, which is what makes the all-same-letter boards fast. The worst case is still exponential in the word length (4 · 3^(L−1) paths from each cell), but the trie shares that work across all words."
time = "O(rows · cols · 4 · 3^(L−1)) worst case, L = longest word"
space = "O(total letters in words)"
