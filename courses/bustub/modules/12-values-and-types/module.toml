code = "3a"
title = "Values and types"
summary = "SQL's types as Rust: a Value that is a number, a boolean, a string or a typed NULL, with range-checked casts, three-valued comparison, checked arithmetic with BusTub's promotion rules, and a byte encoding that reserves a number for NULL. BusTub Project 3, the type system."
lectures = ["storage1", "queryexecution1"]
bustub = ["src/include/type/type_id.h", "src/include/type/type.h", "src/type/type.cpp", "src/include/type/value.h", "src/type/value.cpp", "src/include/type/limits.h", "src/type/integer_type.cpp", "src/include/type/integer_parent_type.h", "src/type/decimal_type.cpp", "src/type/boolean_type.cpp", "src/type/varlen_type.cpp", "src/type/timestamp_type.cpp", "test/type/type_test.cpp"]
files = ["src/common/exception.rs"]

