slug = "format-width-precision"
title = "format! specs: tables, registers, hexdump"
mode = "write"
level = "easy"
stage = "use"
order = 5
status = "ready"
tags = ["format!", "writeln!", "{:>w$.p$}", "{:#010x}", "{:08b}", "{:02x}"]
teaches = [
  "Widths and precisions can come from variables: `{v:>w$.p$}`. Width counts `char`s, not bytes.",
  "`{:#010x}`: `#` adds `0x` and the width 10 includes it. `{:08b}` zero-pads binary.",
  "`write!`/`writeln!` into a `String` needs `std::fmt::Write` in scope and returns a `fmt::Result`.",
]
follow_up = "`format!(\"{v:.prec$}\")` allocates once per row just to measure the width. How would you measure it without allocating?"
related = ["L4"]

[[examples]]
input = "table(&[(\"coffee\", 3.5), (\"tea\", 12.25)], 2)"
output = "\"coffee |  3.50\\ntea    | 12.25\\n\""

[[examples]]
input = "register(0xdead)"
output = "\"0x0000dead = 00000000_00000000_11011110_10101101\""

[[examples]]
input = "hexdump_line(0x10, b\"Hi!\\n\")"
output = "\"00000010  48 69 21 0a                                       |Hi!.|\""

[[hints]]
kind = "rust"
text = "`{name:<name_w$}` and `{value:>value_w$.prec$}` take the width and precision from variables. The widest value is the longest `format!(\"{v:.prec$}\")`."

[[hints]]
kind = "rust"
text = "`use std::fmt::Write;` then `writeln!(out, \"…\").unwrap()` (it can't fail on a `String`, but returns a `fmt::Result`). `value.to_be_bytes()` gives the bytes most significant first; `{a:08b}` prints one as 8 binary digits."

[[hints]]
kind = "edge case"
text = "`b as char` on a byte ≥ 0x80 gives a Latin-1 character like `é`, which is two bytes of UTF-8. Only ASCII graphic bytes and space are shown."

[solution]
explanation = "The format mini-language does all of it: `<`/`>`/`^` align, the number after them is a minimum width (in `char`s), `.p` is precision for floats (and truncation for strings), `0` pads numbers with zeros after the sign, `#` adds `0x`/`0b` and counts toward the width. `name$` takes an argument by name, so runtime widths need no string building. `write!` into a `String` goes through `fmt::Write`, which conflicts with `io::Write` if both are imported by name (import one `as _`). Syntax to remember: `{:<8}` `{:>8.2}` `{:^8}` `{:*>8}`, `{v:>w$.p$}`, `{:#010x}` `{:08b}` `{:02X}` `{:e}` `{:+}`, positional `{0} {1} {0}`, named `format!(\"{n}\", n = x)`, `{:?}` / `{:#?}`, `use std::fmt::Write; write!(s, …)?`."
time = "O(total output)"
space = "O(total output)"
