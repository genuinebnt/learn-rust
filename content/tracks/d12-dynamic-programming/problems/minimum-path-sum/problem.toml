slug = "minimum-path-sum"
title = "Minimum path sum"
mode = "write"
level = "medium"
stage = "2d-grids"
order = 20
status = "ready"
tags = ["2-D DP", "rolling row"]
companies = ["Amazon", "Google", "Meta", "Apple", "Microsoft", "Goldman Sachs"]
teaches = [
  "The min-cost version of the grid walk: each cell adds its value to the cheaper of above and left.",
  "Seeding a rolling row with `u64::MAX` so the first row only takes from the left.",
]
constraints = ["1 ≤ m, n ≤ 1000", "0 ≤ grid[i][j] ≤ 10⁴"]
follow_up = "How would you print the path itself, and how would the approach change if moves in all four directions were allowed? (Then it's Dijkstra.)"
related = ["D9"]

[[examples]]
input = "grid = [[1, 3, 1], [1, 5, 1], [4, 2, 1]]"
output = "7 (1 → 3 → 1 → 1 → 1)"

[[hints]]
kind = "approach"
text = "best(i, j) = grid[i][j] + min(best(i - 1, j), best(i, j - 1)); the first row and column have only one way in."

[[hints]]
kind = "rust"
text = "A rolling `Vec<u64>` seeded with `u64::MAX` except `best[0] = 0` makes the first row take only from the left without special cases."

[[hints]]
kind = "edge case"
text = "Stepping to the cheaper neighbour each time is not optimal: a cheap step can lead into an expensive region."

[solution]
explanation = "Each cell is entered from above or from the left, so its best cost is its own value plus the cheaper of those two. Sweeping rows top to bottom and cells left to right means both are ready."
time = "O(m × n)"
space = "O(n)"
