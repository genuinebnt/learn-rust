slug = "longest-palindromic-substring"
title = "Longest palindromic substring"
mode = "write"
level = "medium"
stage = "string-algorithms"
order = 14
status = "ready"
tags = ["palindrome", "chars", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Adobe", "Bloomberg"]
teaches = [
  "Expand around each of the 2n − 1 centres: a palindrome grows outwards while both ends match.",
  "Work on characters, return a byte slice: keep each character's byte offset so the answer is `&s[a..b]`.",
]
constraints = ["0 ≤ number of characters ≤ 5000"]
follow_up = "Manacher's algorithm finds the answer in O(n). What does it reuse from palindromes already found?"
related = ["D12", "S2"]

[[examples]]
input = "s = \"babad\""
output = "\"bab\""

[[examples]]
input = "s = \"cbbd\""
output = "\"bb\""

[[hints]]
kind = "approach"
text = "Every palindrome has a centre: a character (odd length) or the gap between two (even length). From each of the 2n − 1 centres, grow outwards while the ends match, and keep the longest."

[[hints]]
kind = "rust"
text = "Collect `chars()` into a `Vec<char>` to index characters, and keep `char_indices()` offsets (plus `s.len()`) to turn the best char range back into `&s[a..b]`."

[[hints]]
kind = "edge case"
text = "Comparing bytes breaks on `\"é\"`: a one-byte \"palindrome\" there ends inside the character, and slicing it panics."

[solution]
explanation = "Expanding from a centre costs the length of the palindrome found, so the total is O(n²) in the worst case (`\"aaaa…\"`) and much less on typical text. Checking every substring is O(n³). Manacher's algorithm reuses the mirror image of palindromes already found to get O(n). Replacing strictly-longer with longer-or-equal returns the last of the tied answers instead of the first."
time = "O(n²)"
space = "O(n) for the characters"
