intuition = """
You need a format that survives **any** characters in the strings, including whatever delimiter you'd pick. A delimiter alone fails: if the strings may contain `,` or `#`, you can't tell content from separator.

Fix it by **writing each string's length first**: `"4#abcd"`. When decoding, read digits up to the `#` to get the length, then take exactly that many characters. The content is never inspected, so it can contain anything, including `#` and digits.
"""
tips = [
    "This is the \"length-prefix\" idea used by real protocols (HTTP chunking, Redis's wire format).",
    "Decode with an index and jump by lengths. Don't `split` on the delimiter; that's exactly the bug the problem is testing for.",
    "Find the `#` with `s.find(\"#\", i)` starting at the current index, so a `#` inside the content is never mistaken for the separator.",
    "The empty string encodes as `\"0#\"` and an empty list as `\"\"`; both decode correctly without special cases.",
    "This is a Premium problem on LeetCode. The class is `Codec`, and your two methods are `encode` and `decode`.",
]

[[approaches]]
name = "Length prefix"
label = "length prefix"
idea = "Encode each string as `<length>#<string>` and concatenate. Decode by reading the length, skipping the `#`, and slicing exactly that many characters."
time = "O(n)"
space = "O(n)"
note = "n is the total number of characters; both directions touch each character once."
code = '''class Codec:
    def encode(self, strs: list[str]) -> str:
        """Encodes a list of strings to a single string."""
        return "".join(f"{len(s)}#{s}" for s in strs)

    def decode(self, s: str) -> list[str]:
        """Decodes a single string to a list of strings."""
        result = []
        i = 0
        while i < len(s):
            hash_at = s.find("#", i)
            length = int(s[i:hash_at])
            start = hash_at + 1
            result.append(s[start:start + length])
            i = start + length
        return result
'''
