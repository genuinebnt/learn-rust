status = "ready"
tags = ["reborrow", "blanket impls", "?Sized", "Box<dyn Trait>"]
teaches = [
  "A blanket `impl Trait for &mut T` lets by-value generic APIs borrow instead of consume.",
  "`(**self).method()` reaches the value behind `&mut &mut T`.",
  "`?Sized` admits trait objects.",
