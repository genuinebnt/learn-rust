slug = "number-of-islands"
title = "Number of islands"
mode = "write"
level = "easy"
stage = "traversal"
order = 9
status = "ready"
tags = ["flood fill", "grid", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Bloomberg", "LinkedIn", "Uber"]
teaches = [
  "Grid neighbours with `wrapping_sub` and one bounds check.",
  "An explicit stack instead of recursion.",
]
constraints = ["1 ≤ rows, cols ≤ 300"]
follow_up = "How would you count islands in a grid too large to fit in memory, streamed row by row?"

[[examples]]
input = "grid = [\"11000\", \"11000\", \"00100\", \"00011\"]"
output = "3"

[[hints]]
kind = "approach"
text = "Scan every cell. Each unvisited land cell starts a new island; flood it so its other cells don't count again."

[[hints]]
kind = "rust"
text = "`r.wrapping_sub(1)` turns -1 into `usize::MAX`, so one `nr < h` check covers both edges."

[solution]
explanation = "Every cell is pushed at most once. The explicit stack means a 300×300 island can't overflow the call stack, which a recursive flood fill can."
time = "O(rows · cols)"
space = "O(rows · cols)"
