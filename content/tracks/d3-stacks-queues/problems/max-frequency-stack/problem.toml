[[hints]]
kind = "approach"
text = "Group elements by the frequency they had when pushed. The last group holds the most frequent, and its last element is the most recent."

[[hints]]
kind = "rust"
text = "`self.freq.entry(x)` and `self.groups` are different fields, so both can be borrowed mutably at once."

[solution]
explanation = "An element with frequency 3 sits in groups 1, 2 and 3. Popping from the top group automatically exposes its earlier copies in lower groups."
time = "O(1)"
space = "O(n)"
