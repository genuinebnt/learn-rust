[[hints]]
kind = "approach"
text = "Numbers go on a stack; an operator pops two and pushes the result."

[[hints]]
kind = "edge case"
text = "Pop `b` first, then `a`: `a - b`, not `b - a`. And `\"-11\"` is a number, not an operator."

[solution]
explanation = "Trying `parse` first means negative numbers are never mistaken for the `-` operator. Rust's `/` truncates toward zero, as required."
time = "O(n)"
