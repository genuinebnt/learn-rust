code = "2a"
title = "Typed pages"
summary = "Safe views over page bytes: integers at offsets, optional page ids, record ids, fixed-size keys and entries, an array view with insert/remove/search, and layouts checked at compile time. The toolkit BusTub Project 2's pages are built from."
lectures = ["storage2", "indexes1"]
bustub = ["src/include/common/rid.h", "src/include/storage/index/generic_key.h", "src/include/storage/index/int_comparator.h", "src/include/storage/page/extendible_htable_bucket_page.h", "src/include/storage/page/extendible_htable_directory_page.h", "src/include/storage/page/extendible_htable_header_page.h"]

