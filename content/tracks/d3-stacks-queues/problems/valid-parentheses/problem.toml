slug = "valid-parentheses"
title = "Valid parentheses"
mode = "write"
level = "easy"
stage = "stack-basics"
order = 1
status = "ready"
tags = ["stack", "bytes", "Blind 75"]
teaches = [
  "`Vec` as a stack: `push` / `pop` / `last`.",
  "`match` on byte literals.",
]
follow_up = "How would you report the position of the first bad bracket?"

[[examples]]
input = "\"()[]{}\""
output = "true"

[[examples]]
input = "\"([)]\""
output = "false"

[[hints]]
kind = "approach"
text = "The most recent unclosed bracket must be the next to close. That's a stack."

[[hints]]
kind = "rust"
text = "Push the closer you expect, not the opener; then a close is just `pop() == Some(b)`."

[solution]
explanation = "Pushing the expected closing byte turns the check into one comparison. `pop()` returning `None` on an extra closer falls out of the same comparison."
time = "O(n)"
space = "O(n)"
