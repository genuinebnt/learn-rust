tags = ["NLL case 3", "E0502"]
teaches = [
  "NLL problem case 3: a conditionally returned borrow is live on every path.",
  "Restructure so the check returns a value, not a reference.",
]
follow_up = "Why does the entry API avoid this problem entirely?"
