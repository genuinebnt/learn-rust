slug = "house-robber-ii"
title = "House robber II"
mode = "write"
level = "medium"
stage = "1d-basics"
order = 7
status = "ready"
tags = ["1-D DP", "Blind 75"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "Adobe", "Bloomberg"]
teaches = [
  "Breaking a cycle by solving two straight lines: without the first house and without the last.",
  "Reusing a helper over subslices (`&nums[1..]`, `&nums[..n - 1]`).",
]
constraints = ["0 ≤ nums.len() ≤ 10⁶", "0 ≤ nums[i] ≤ 10⁴"]
follow_up = "How would you solve it if the street were a tree instead of a circle? (That is House robber III, at the end of this track.)"
related = ["D11"]

[[examples]]
input = "nums = [2, 3, 2]"
output = "3 (houses 0 and 2 are neighbours)"

[[hints]]
kind = "approach"
text = "Any valid plan skips the first house or skips the last one. Solve the straight street twice and take the better."

[[hints]]
kind = "rust"
text = "Write `rob_line(&[u32]) -> u64` and call it on `&nums[1..]` and `&nums[..n - 1]`; a slice pattern handles the short cases."

[[hints]]
kind = "edge case"
text = "One house: `nums[1..]` and `nums[..0]` are both empty, but the single house can still be robbed."

[solution]
explanation = "The circle only forbids taking both house 0 and house n - 1, so the answer is the better of the line without house 0 and the line without house n - 1."
time = "O(n)"
space = "O(1)"
