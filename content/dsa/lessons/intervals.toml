pattern = "Intervals"
intro = "Almost every interval problem starts with a sort. Sort by start to merge or insert, sort by end to choose the most that fit, or turn each interval into two events and sweep. Decide which sort first, and the loop that follows is short."
groups = ["Merge and combine", "Intersection and subtraction", "Selection by earliest end (non-overlapping)", "Covering points and ranges", "Meeting rooms", "Line sweep", "Range updates with difference arrays", "Interval scheduling: weighted, bounded and deadline", "Calendar booking", "Gaps and free time", "Interval tree and stabbing queries", "Skyline problem", "Interval DP (cross-reference to 2-D Dynamic Programming)", "Union length and area", "Queries on intervals (offline sort + heap)", "Circular intervals", "Interval graphs and matching", "Intervals built from other data", "Core implementation patterns"]










