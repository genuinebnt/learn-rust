intuition = """
Each course is a node and each prerequisite `[a, b]` is an edge `b → a` ("b must come before a"). You can finish every course unless some courses **wait on each other in a loop**, so the question is: **does this directed graph have a cycle?**

Two standard ways to find out. **DFS with three states** (unseen, on the current path, done): reaching a node that's on the current path means a cycle. **Kahn's algorithm** (BFS topological sort): repeatedly take a course with no remaining prerequisites; if you can take all of them, there's no cycle.
"""
tips = [
    "Get the edge direction right: `[a, b]` means `b → a`. For this problem either direction gives the same yes/no, but not for Course Schedule II, where you return the order.",
    "The graph can be disconnected: start a search from **every** course, not just course 0.",
    "A plain `visited` set isn't enough for directed graphs: a diamond (0→1, 0→2, 1→3, 2→3) reaches 3 twice with no cycle. Use three states.",
    "`numCourses` goes up to 2000, deeper than Python's default recursion limit of 1000. Raise it with `sys.setrecursionlimit`, or use Kahn's algorithm, which needs no recursion.",
    "In an interview, say the reduction out loud first: \"this is cycle detection in a directed graph\". It's most of the credit.",
]

[[approaches]]
name = "DFS with three states"
label = "DFS"
idea = "Walk from each course. Mark a node **visiting** while it's on the current path and **done** once everything after it is explored. Reaching a visiting node means a cycle."
time = "O(V + E)"
space = "O(V + E)"
time_why = "The DFS visits every course once and follows every prerequisite edge once."
space_why = "The adjacency lists hold V + E, and the recursion goes up to V deep along a chain."
note = "Each course and prerequisite is visited once; the graph and the recursion stack take the space."
code = '''import sys


class Solution:
    def canFinish(self, numCourses: int, prerequisites: list[list[int]]) -> bool:
        sys.setrecursionlimit(10_000)  # up to 2000 courses deep
        graph = [[] for _ in range(numCourses)]
        for course, pre in prerequisites:
            graph[pre].append(course)

        UNSEEN, VISITING, DONE = 0, 1, 2
        state = [UNSEEN] * numCourses

        def has_cycle(node: int) -> bool:
            if state[node] == VISITING:
                return True   # back on our own path: a cycle
            if state[node] == DONE:
                return False  # already proven cycle-free
            state[node] = VISITING
            if any(has_cycle(nxt) for nxt in graph[node]):
                return True
            state[node] = DONE
            return False

        return not any(has_cycle(c) for c in range(numCourses))
'''

[[approaches]]
name = "Kahn's algorithm (BFS topological sort)"
label = "topological sort"
idea = "Repeatedly take a course with no remaining prerequisites (in-degree 0) and remove its outgoing edges. If every course gets taken, there's an order; if some are left, they're stuck in a cycle."
time = "O(V + E)"
space = "O(V + E)"
time_why = "Each course is queued once and each prerequisite edge is followed once."
space_why = "The adjacency lists hold V + E, and the in-degree array and queue hold up to V."
note = "No recursion, so no depth limit."
code = '''from collections import deque


class Solution:
    def canFinish(self, numCourses: int, prerequisites: list[list[int]]) -> bool:
        graph = [[] for _ in range(numCourses)]
        indegree = [0] * numCourses
        for course, pre in prerequisites:
            graph[pre].append(course)
            indegree[course] += 1

        queue = deque(c for c in range(numCourses) if indegree[c] == 0)
        taken = 0
        while queue:
            node = queue.popleft()
            taken += 1
            for nxt in graph[node]:
                indegree[nxt] -= 1
                if indegree[nxt] == 0:
                    queue.append(nxt)
        return taken == numCourses
'''
