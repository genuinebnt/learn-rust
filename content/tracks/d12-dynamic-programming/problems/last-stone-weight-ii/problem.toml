slug = "last-stone-weight-ii"
title = "Last stone weight II"
mode = "write"
level = "medium"
stage = "knapsack"
order = 33
status = "ready"
tags = ["0/1 knapsack", "subset sum"]
companies = ["Google", "Amazon", "Microsoft"]
teaches = [
  "Seeing through the story: any sequence of smashes is a split into two piles.",
  "Finding the reachable subset sum closest to half with a backwards scan.",
]
constraints = ["0 ≤ stones.len() ≤ 100", "1 ≤ stones[i] ≤ 100"]
follow_up = "Prove that every split into two groups can be realised by some order of smashes."
related = ["D7"]

[[examples]]
input = "stones = [2, 7, 4, 1, 8, 1]"
output = "1"

[[examples]]
input = "stones = [31, 26, 33, 21, 40]"
output = "5"

[[hints]]
kind = "approach"
text = "Every smash subtracts one stone from another, so whatever is left is (sum of one group) - (sum of the other). Make the two groups as even as possible."

[[hints]]
kind = "rust"
text = "Build a `Vec<bool>` of reachable sums up to total / 2 (0/1 knapsack, sweeping down), then `(0..=half).rev().find(|&s| reach[s])`."

[[hints]]
kind = "edge case"
text = "Always smashing the two heaviest stones (Last stone weight I) is not optimal here: [31, 26, 33, 21, 40] leaves 9 that way, but 5 is possible."

[solution]
explanation = "Signs again: each stone ends up added or subtracted, and any split can be realised by some smash order. The best split puts the lighter group as close to total / 2 as possible."
time = "O(n × total)"
space = "O(total)"
