slug = "min-cost-flow"
title = "Min-cost flow"
mode = "write"
level = "hard"
stage = "flows-matching"
order = 58
status = "ready"
tags = ["min-cost flow", "SPFA", "negative residual costs"]
teaches = [
  "Successive shortest paths on a residual graph with negative reverse costs.",
  "Bellman–Ford with a queue (SPFA).",
]
constraints = ["n ≤ 200", "edges ≤ 2000", "want ≤ 10⁴"]
follow_up = "Add Johnson potentials so each round can use Dijkstra. What invariant makes the reduced costs non-negative?"

[[examples]]
input = "n = 4, edges = [(0,1,2,1), (0,2,1,2), (1,2,1,1), (1,3,1,3), (2,3,2,1)], s = 0, t = 3, want = 2"
output = "Some(6)"

[[hints]]
kind = "approach"
text = "Repeatedly send flow along the cheapest s→t path in the residual graph, as much as its bottleneck allows."

[[hints]]
kind = "approach"
text = "A reverse edge refunds the cost, so it has cost −w. Dijkstra can't handle that directly; Bellman–Ford (SPFA) can."

[[hints]]
kind = "rust"
text = "Same flat-edge layout as Edmonds-Karp: reverse of `e` is `e ^ 1`, with `cost[e ^ 1] = -cost[e]`."

[solution]
explanation = "Successive shortest paths stays optimal because the residual graph never has a negative cycle. Johnson potentials would let you use Dijkstra instead of SPFA."
time = "O(F · V · E)"
space = "O(V + E)"
