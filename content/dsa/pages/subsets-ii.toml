intuition = """
Subsets again, but the input **has duplicates** and the answer must not repeat a subset. Sort so equal values are adjacent, then use the loop form of backtracking: from `start`, pick `nums[i]`, recurse with `i + 1`, and **skip `nums[i]` when it equals `nums[i-1]` at the same level** (`i > start`).

Every path of the recursion is itself a subset, so record the path **at every call**, not only at the end.
"""
tips = [
    "In the loop form, record `path[:]` at the top of every call: each node of the tree is a subset.",
    "The skip condition is `i > start and nums[i] == nums[i - 1]`; the `start` part is what keeps `[1, 1]` as a valid subset.",
    "Sort first. Without sorting, equal numbers aren't adjacent and the rule doesn't work.",
    "Alternatively, group equal numbers and choose how many copies of each to take.",
]

[[approaches]]
name = "Sort and skip repeats at the same level"
label = "backtracking"
idea = "Record the path at every node, then extend it with each number from `start`, skipping a value equal to the previous one at this level."
time = "O(n · 2^n)"
space = "O(n)"
time_why = "There are up to 2ⁿ subsets, and copying each one into the answer costs up to n."
space_why = "The current path and the recursion, n deep. The output isn't counted."
note = "Each subset is generated exactly once."
code = '''class Solution:
    def subsetsWithDup(self, nums: list[int]) -> list[list[int]]:
        nums = sorted(nums)
        result = []
        path = []

        def search(start: int) -> None:
            result.append(path[:])
            for i in range(start, len(nums)):
                if i > start and nums[i] == nums[i - 1]:
                    continue
                path.append(nums[i])
                search(i + 1)
                path.pop()

        search(0)
        return result
'''

[[approaches]]
name = "Choose how many copies of each value"
label = "counts"
idea = "Group equal numbers; for each distinct value take 0 up to its count of copies."
time = "O(n · 2^n)"
space = "O(n)"
time_why = "There are up to 2ⁿ subsets, and copying each one into the answer costs up to n."
space_why = "The current path and the recursion, n deep. The output isn't counted."
note = "Distinct values mean no duplicate subsets can appear."
code = '''from collections import Counter


class Solution:
    def subsetsWithDup(self, nums: list[int]) -> list[list[int]]:
        result = [[]]
        for value, count in Counter(nums).items():
            result += [subset + [value] * k for subset in result for k in range(1, count + 1)]
        return result
'''
