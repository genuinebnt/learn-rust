[[hints]]
kind = "rust"
text = "It looks like a shared and a mutable borrow at once. It compiles because the mutable borrow of an autoref'd method receiver isn't active until the arguments are evaluated."

[solution]
explanation = "Two-phase borrows exist precisely so `v.push(v.len())` compiles. They only apply to autoref'd method calls and compound assignment."
time = "O(n)"
space = "O(1) amortised"
