slug = "merge-k-sorted-arrays"
title = "Merge k sorted arrays"
mode = "write"
level = "medium"
stage = "heaps-at-work"
order = 7
status = "ready"
tags = ["BinaryHeap", "Reverse", "k-way merge"]
companies = ["Amazon", "Google", "Microsoft", "Meta"]
teaches = [
  "A k-way merge keeps one candidate per array in a min-heap of `Reverse((value, array, index))`.",
  "Tuple fields after the value say where the next candidate comes from.",
  "Merging arrays one by one into an accumulator is O(N·k); the heap is O(N log k).",
]
constraints = ["0 ≤ arrays.len() ≤ 2·10⁴", "total length N ≤ 2·10⁵", "values are any i32"]
follow_up = "How would you merge pairwise, like merge sort's merge tree, and what does that cost?"
related = ["D5", "S5"]

[[examples]]
input = "arrays = [[1, 4, 5], [1, 3, 4], [2, 6]]"
output = "[1, 1, 2, 3, 4, 4, 5, 6]"

[[examples]]
input = "arrays = []"
output = "[]"

[[hints]]
kind = "approach"
text = "The next output is the smallest of the k array heads. Keep the heads in a min-heap; after popping one, push its array's next value."

[[hints]]
kind = "rust"
text = "`BinaryHeap<Reverse<(i32, usize, usize)>>`: value first so it decides the order, then the array and the index to continue from."

[[hints]]
kind = "edge case"
text = "Seed the heap only from non-empty arrays: `v.first().map(...)` inside `filter_map`."

[solution]
explanation = "The heap never holds more than one value per array, so each of the N outputs costs O(log k). Merging arrays into an accumulator one after another re-copies the accumulator k times: O(N·k). Concatenating and sorting is O(N log N) and fine in memory; the heap version is the one that also works when the arrays are streams (see External merge sort)."
time = "O(N log k)"
space = "O(k) besides the output"
