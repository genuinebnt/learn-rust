slug = "insert-interval"
title = "Insert interval"
mode = "write"
level = "medium"
stage = "intervals"
order = 8
status = "ready"
tags = ["intervals", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "LinkedIn"]
teaches = [
  "Three phases in one pass: copy what ends before, absorb what overlaps, copy the rest.",
  "`extend_from_slice(&intervals[i..])` copies the tail at once.",
]
constraints = ["0 ≤ intervals.len() ≤ 2·10⁵", "start ≤ end, both any i32"]
follow_up = "If you had to insert many intervals one after another, what structure would keep each insert fast?"
related = ["S3", "D4"]

[[examples]]
input = "intervals = [(1, 3), (6, 9)], new = (2, 5)"
output = "[(1, 5), (6, 9)]"

[[hints]]
kind = "approach"
text = "The list is already sorted: copy intervals that end before `new` starts, absorb every interval that starts before `new` ends, then copy the rest."

[[hints]]
kind = "rust"
text = "Two `while` loops over one index `i`, then `out.extend_from_slice(&intervals[i..])`."

[[hints]]
kind = "edge case"
text = "Touching counts: `(1, 3)` and `(3, 4)` merge, so compare with `<` and `<=` carefully."

[solution]
explanation = "Because the input is sorted and disjoint, the intervals that overlap `new` form one contiguous run; everything before and after is copied unchanged."
time = "O(n)"
space = "O(n) for the output"
