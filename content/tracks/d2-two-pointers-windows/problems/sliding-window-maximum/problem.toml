slug = "sliding-window-maximum"
title = "Sliding window maximum"
mode = "write"
level = "hard"
stage = "hard-windows"
order = 17
status = "ready"
tags = ["VecDeque", "monotonic queue"]
teaches = [
  "A monotonic deque of indices: the front is always the window's max.",
  "`VecDeque::pop_back` while the new value dominates.",
]
follow_up = "How would you support a stream where k changes over time?"
related = ["S5", "D3"]

[[examples]]
input = "nums = [1, 3, -1, -3, 5, 3, 6, 7], k = 3"
output = "[3, 3, 5, 5, 6, 7]"

[[hints]]
kind = "approach"
text = "A value that's smaller than a later value in the window can never be the max again."

[[hints]]
kind = "rust"
text = "Keep indices in a `VecDeque` in decreasing value order; drop the front when it leaves the window."

[solution]
explanation = "Each index is pushed and popped at most once, so the whole pass is linear."
time = "O(n)"
space = "O(k)"
