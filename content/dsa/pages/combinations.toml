intuition = """
Choose `k` numbers from `1..n`. This is Subsets with a fixed size, and with the **start index** from Combination Sum so each combination is built in increasing order and never repeated. At each step try every number from `start` to `n`, recurse with `start = i + 1`, and record the path when it reaches length `k`.

Pruning: if there aren't enough numbers left to reach `k` items, stop the loop early (`i` can't be larger than `n - (k - len(path)) + 1`).
"""
tips = [
    "Append a copy of the path (`path[:]`) when it reaches size `k`.",
    "The start index keeps combinations in increasing order, so `[1, 2]` appears and `[2, 1]` doesn't.",
    "The prune on the upper bound of the loop avoids branches that can no longer reach size `k`.",
]

[[approaches]]
name = "Backtracking with a start index"
label = "backtracking"
idea = "Build the combination in increasing order; stop at size k, and don't start numbers that can't leave enough room."
time = "O(k · C(n, k))"
space = "O(k)"
time_why = "There are C(n, k) combinations, and copying each one into the answer costs k."
space_why = "The current combination holds k numbers, and the recursion is k deep."
note = "The output size dominates."
code = '''class Solution:
    def combine(self, n: int, k: int) -> list[list[int]]:
        result, path = [], []

        def go(start: int) -> None:
            if len(path) == k:
                result.append(path[:])
                return
            for i in range(start, n - (k - len(path)) + 2):
                path.append(i)
                go(i + 1)
                path.pop()

        go(1)
        return result
'''
