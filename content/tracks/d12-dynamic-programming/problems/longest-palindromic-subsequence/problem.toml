slug = "longest-palindromic-subsequence"
title = "Longest palindromic subsequence"
mode = "write"
level = "medium"
stage = "strings"
order = 26
status = "ready"
tags = ["interval DP", "as_bytes"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "LinkedIn", "Uber"]
teaches = [
  "Interval DP: the answer for `s[i..=j]` from the answers for shorter intervals inside it.",
  "Iterating `i` downwards so every inner interval is ready.",
]
constraints = ["0 ≤ s.len() ≤ 2000", "s is ASCII lowercase letters"]
follow_up = "How would you find the fewest insertions that make s a palindrome? (n - LPS.)"
related = ["D2", "S2"]

[[examples]]
input = "s = \"bbbab\""
output = "4 (\"bbbb\")"

[[hints]]
kind = "approach"
text = "For s[i..=j]: if the ends match they wrap the best palindrome inside (2 + LPS(i + 1, j - 1)); otherwise drop one end: max(LPS(i + 1, j), LPS(i, j - 1))."

[[hints]]
kind = "rust"
text = "Loop `i` from n - 1 down to 0 and `j` upwards; one `Vec` works if you save the old `best[j]` before overwriting it (it is the next j's inner interval)."

[[hints]]
kind = "edge case"
text = "The characters must stay in order: \"abab\" gives 3 (\"aba\"), not 4. A subsequence, not a substring: \"aebcbda\" gives 5."

[solution]
explanation = "Every interval depends only on intervals strictly inside it, so filling by decreasing i and increasing j works. It also equals LCS(s, reverse(s))."
time = "O(n²)"
space = "O(n)"
