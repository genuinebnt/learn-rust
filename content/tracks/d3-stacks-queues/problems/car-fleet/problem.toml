  "Exact comparisons of ratios by cross-multiplication.",
  "Processing sorted items against a running 'fleet ahead'.",
]
follow_up = "What if cars could also have different lengths?"

[[hints]]
kind = "approach"
text = "Sort by distance to the target. Going backwards from the front car, a car forms a new fleet only if it would arrive later than the fleet ahead of it."

[[hints]]
kind = "rust"
text = "Compare arrival times `d1/s1 > d2/s2` as `d1 * s2 > d2 * s1` in `u64`, with no floating point."

[solution]
explanation = "Cross-multiplying keeps the comparison exact; with `f64`, two nearly equal arrival times can compare the wrong way. `Option::is_none_or` handles the first car."
time = "O(n log n)"
space = "O(n)"
