constraints = ["0 ≤ next.len() ≤ 2·10⁵"]
follow_up = "How would you get a cycle with `Rc<RefCell<Node>>`, and what happens to its memory?"
related = ["D9", "S7"]

[[hints]]
kind = "approach"
text = "Floyd: a slow and a fast pointer meet inside the cycle. Then one pointer from the head and one from the meeting point meet at the cycle's start."

[[hints]]
kind = "rust"
text = "Indices are `Copy` and can point anywhere, including backwards: that's how Rust code represents cyclic structure without `Rc` cycles."

[solution]
explanation = "Floyd's algorithm needs only two indices. Storing `next` as `Vec<Option<usize>>` is the arena pattern used for graphs and lists that aren't trees."
time = "O(n)"
space = "O(1)"
