slug = "fix-missing-bound"
title = "Fix: missing bound (E0369)"
mode = "fix"
level = "easy"
stage = "generic-code"
order = 2
status = "ready"
tags = ["E0369", "trait bounds", "PartialOrd"]
teaches = [
  "A generic function can only use what its bounds promise.",
  "Comparison operators come from `PartialOrd`; pick the weakest bound that works.",
]
follow_up = "Why does `Ord` reject `f64` while `PartialOrd` accepts it? What happens here if the slice holds a NaN?"
related = ["L5"]

[[hints]]
kind = "rust"
text = "`largest` only uses `>` on the items. Which trait provides `>`?"

[[hints]]
kind = "rust"
text = "Add the bound in the generic parameter list: `<T: PartialOrd>`. `PartialOrd` rather than `Ord` keeps `f64` working."

[solution]
explanation = "Inside a generic function the compiler only lets you do what the bounds promise. `>` comes from `PartialOrd`, so the signature has to ask for it."
time = "O(n)"
space = "O(1)"

