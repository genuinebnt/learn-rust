slug = "minimum-number-of-refueling-stops"
title = "Minimum number of refueling stops"
mode = "write"
level = "hard"
stage = "hard-greedy"
order = 28
status = "ready"
tags = ["greedy", "heap"]
companies = ["Amazon", "Google"]
teaches = [
  "Defer the decision: remember every station you passed and take the best one only when you must.",
  "`passed.pop()?` in a function returning `Option` exits with `None` when the heap is empty.",
]
constraints = ["1 ≤ target ≤ 10¹²", "0 ≤ start_fuel ≤ 10¹²", "0 ≤ stations.len() ≤ 2·10⁵", "0 < position < target, strictly increasing", "1 ≤ fuel ≤ 10⁹"]
follow_up = "If each stop also took time proportional to the fuel pumped, how would you minimise total travel time instead?"
related = ["D7", "D12", "S5"]

[[examples]]
input = "target = 1, start_fuel = 1, stations = []"
output = "Some(0)"

[[examples]]
input = "target = 100, start_fuel = 1, stations = [(10, 100)]"
output = "None"

[[examples]]
input = "target = 100, start_fuel = 10, stations = [(10, 60), (20, 30), (30, 30), (60, 40)]"
output = "Some(2)"

[[hints]]
kind = "approach"
text = "Drive as far as your fuel allows, remembering the fuel of every station you pass. When you can't reach the target, pretend you had stopped at the passed station with the most fuel."

[[hints]]
kind = "rust"
text = "`BinaryHeap<u64>` is already a max-heap; `reach += passed.pop()?;` returns `None` from the function when no passed station is left."

[[hints]]
kind = "edge case"
text = "Reaching a station or the target with exactly 0 fuel is fine, so compare positions with `<=`."

[solution]
explanation = "When fuel runs out, any passed station could have been a stop, and the one with the most fuel reaches at least as far as any other single choice. Deferring each choice until it's needed never uses more stops. Each station enters and leaves the heap once."
time = "O(n log n)"
space = "O(n)"
