slug = "unique-paths"
title = "Unique paths"
mode = "write"
level = "medium"
stage = "2d-grids"
order = 18
status = "ready"
tags = ["2-D DP", "rolling row", "Blind 75"]
companies = ["Amazon", "Google", "Meta", "Apple", "Microsoft", "Bloomberg", "Goldman Sachs"]
teaches = [
  "A grid DP where each cell adds the cell above and the cell to the left.",
  "One rolling row: updating `row[j] += row[j - 1]` in place reads \"above\" and \"left\" at once.",
]
constraints = ["1 ≤ m, n ≤ 100", "the answer fits in a u64"]
follow_up = "How would you compute C(m + n - 2, m - 1) directly without overflowing?"
related = ["D13"]

[[examples]]
input = "m = 3, n = 7"
output = "28"

[[examples]]
input = "m = 3, n = 2"
output = "3"

[[hints]]
kind = "approach"
text = "paths(i, j) = paths(i - 1, j) + paths(i, j - 1), and every cell in the first row or column has one path."

[[hints]]
kind = "rust"
text = "Keep one `Vec<u64>` row. `row[j] += row[j - 1]` adds the new left value to the old above value in place."

[[hints]]
kind = "edge case"
text = "The closed form C(m + n - 2, m - 1) is right, but computing it with factorials overflows a `u64` from 21! on."

[solution]
explanation = "Each cell is reached from above or from the left, so its count is the sum of those two. A single row is enough because the update reads the old value (above) and the freshly updated one (left)."
time = "O(m × n)"
space = "O(n)"
