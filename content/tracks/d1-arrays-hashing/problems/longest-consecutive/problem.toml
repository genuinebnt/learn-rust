slug = "longest-consecutive"
title = "Longest consecutive sequence"
mode = "write"
level = "medium"
stage = "sorting-order"
order = 20
status = "ready"
tags = ["HashSet", "Blind 75"]
teaches = [
  "Only start counting from a number with no predecessor.",
  "A `HashSet` gives O(n) where sorting gives O(n log n).",
]
follow_up = "How would you solve it with union-find, and what would that buy you?"
related = ["S4", "D9"]

[[examples]]
input = "nums = [100, 4, 200, 1, 3, 2]"
output = "4"

[[hints]]
kind = "approach"
text = "Put everything in a set. A run starts at x only if x − 1 isn't in the set."

[[hints]]
kind = "edge case"
text = "`x - 1` overflows at `i32::MIN` in a debug build."

[solution]
explanation = "Each number is visited by at most one run, so the inner loop is O(n) in total. Guarding `i32::MIN`/`MAX` avoids overflow panics."
time = "O(n)"
space = "O(n)"
