code = "3c"
title = "Table heap, iterator and catalog"
summary = "A table as a linked list of pages in the buffer pool, a scan that stops where it started, indexes over tuples (key bytes, a column-wise comparator, a B+ tree behind a trait), and the catalog that names tables and indexes. BusTub Project 3, the storage layer the executors stand on."
lectures = ["storage2", "storage3", "indexes1"]
bustub = ["src/include/storage/table/table_heap.h", "src/storage/table/table_heap.cpp", "src/include/storage/table/table_iterator.h", "src/storage/table/table_iterator.cpp", "src/include/storage/index/index.h", "src/include/storage/index/generic_key.h", "src/storage/index/b_plus_tree_index.cpp", "src/include/catalog/catalog.h", "test/table/tuple_test.cpp"]
files = []

