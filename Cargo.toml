[workspace]
resolver = "3"
members = ["crates/content", "crates/runner", "crates/rules", "crates/cli", "crates/api", "crates/ai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anneal-content = { path = "crates/content" }
anneal-runner = { path = "crates/runner" }
anneal-rules = { path = "crates/rules" }
anneal-ai = { path = "crates/ai" }
anyhow = "1"
argon2 = "0.5"
# OsRng for argon2 salts and session tokens.
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
toml = "0.9"
