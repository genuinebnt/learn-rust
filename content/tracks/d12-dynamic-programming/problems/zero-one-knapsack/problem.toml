slug = "zero-one-knapsack"
title = "0/1 knapsack"
mode = "write"
level = "medium"
stage = "knapsack"
order = 30
status = "ready"
tags = ["0/1 knapsack", "1-D DP"]
companies = ["Amazon", "Google", "Microsoft", "Goldman Sachs"]
teaches = [
  "The 0/1 knapsack table over capacities, and why each item's pass runs downwards.",
  "Going from `dp[i][c]` to one `Vec` indexed by capacity.",
]
constraints = ["0 ≤ items.len() ≤ 100", "0 ≤ weight ≤ 10⁵, 0 ≤ value ≤ 10⁹", "0 ≤ capacity ≤ 10⁵"]
follow_up = "How would you list which items were taken? And what if capacity were 10⁹ but values small? (DP over value instead of weight.)"
related = ["D8"]

[[examples]]
input = "items = [(1, 1), (3, 4), (4, 5), (5, 7)], capacity = 7"
output = "9 (weights 3 + 4)"

[[hints]]
kind = "approach"
text = "Take items one at a time: best(c) with this item is max(best(c) without it, value + best(c - weight) without it)."

[[hints]]
kind = "rust"
text = "One `Vec<u64>` of length capacity + 1. For each item, loop `for c in (weight..=capacity).rev()` so `best[c - weight]` is still the value before this item."

[[hints]]
kind = "edge case"
text = "Looping capacities upwards lets an item be added again and again (that is the unbounded knapsack). Sorting by value per weight is not optimal either."

[solution]
explanation = "The 2-D table best[i][c] only reads row i - 1, and only at capacities ≤ c. Sweeping c downwards in one row reads those old values before they are overwritten."
time = "O(n × capacity)"
space = "O(capacity)"
