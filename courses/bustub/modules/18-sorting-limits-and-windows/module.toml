code = "3g"
title = "Sorting, limits and window functions"
summary = "ORDER BY for data bigger than memory (sorted runs on buffer-pool pages merged in passes), LIMIT, ORDER BY ... LIMIT with a bounded heap, and window functions (partitions, running aggregates with peers, rank). BusTub Project 3, task 3."
lectures = ["sorting", "queryexecution2"]
bustub = ["src/include/execution/executors/external_merge_sort_executor.h", "src/include/execution/executors/limit_executor.h", "src/include/execution/executors/topn_executor.h", "src/include/execution/executors/window_function_executor.h", "src/execution/execution_common.cpp", "src/include/execution/plans/sort_plan.h", "src/include/execution/plans/window_plan.h", "test/sql/p3.16-sort-limit.slt", "test/sql/p3.18-integration-1.slt", "test/sql/p3.19-integration-2.slt", "test/sql/p3.20-window-function.slt"]
files = [
    "tests/sql/p3.16-sort-limit.slt",
    "tests/sql/p3.18-integration-1.slt",
    "tests/sql/p3.19-integration-2.slt",
    "tests/sql/p3.20-window-function.slt",
]

