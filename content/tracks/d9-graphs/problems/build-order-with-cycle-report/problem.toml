slug = "build-order-with-cycle-report"
title = "Build order with cycle report"
mode = "write"
level = "medium"
stage = "topological-sort"
order = 13
status = "ready"
tags = ["Result", "BinaryHeap", "Reverse"]
companies = ["Meta", "Amazon", "Google", "Microsoft"]
teaches = [
  "`Result<Vec<_>, Vec<_>>` carrying data on both sides.",
  "The lexicographically smallest topological order with a min-heap.",
]
constraints = ["1 ≤ n ≤ 2·10⁵", "deps.len() ≤ 2·10⁵"]
follow_up = "How would you print one cycle as a path for the error message?"
related = ["S1", "D7"]

[[examples]]
input = "n = 4, deps = [(2, 0), (0, 1), (3, 1)]"
output = "Ok([2, 0, 3, 1])"

[[examples]]
input = "n = 4, deps = [(0, 1), (1, 2), (2, 1), (2, 3)]"
output = "Err([1, 2, 3])"

[[hints]]
kind = "approach"
text = "Kahn's algorithm, but take the smallest ready package each time."

[[hints]]
kind = "rust"
text = "`BinaryHeap<Reverse<usize>>` pops the smallest. `.map(Reverse)` wraps while collecting."

[[hints]]
kind = "edge case"
text = "After the loop, the packages that can't be built are exactly those whose in-degree never reached 0."

[solution]
explanation = "The min-heap makes the order deterministic and lexicographically smallest. Leftover in-degrees identify every package in or behind a cycle, so the error needs no extra search."
time = "O((V + E) log V)"
space = "O(V + E)"
