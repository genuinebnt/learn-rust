slug = "find-median-from-data-stream"
title = "Find median from data stream"
mode = "write"
level = "hard"
stage = "two-heaps-merges"
order = 9
status = "ready"
tags = ["two heaps", "lazy deletion", "Reverse", "Blind 75"]
companies = ["Amazon", "Meta", "Google", "Microsoft", "Apple", "Uber", "Goldman Sachs"]
teaches = [
  "Two heaps: a max-heap for the smaller half and a `Reverse` min-heap for the larger half, sizes within one.",
  "Lazy deletion: `BinaryHeap` can't remove from the middle, so record the removal and drop the copy when it reaches a top.",
  "Keep both tops live after every mutation so `find_median` can take `&self`.",
]
constraints = ["up to 3·10⁵ operations", "values are any i32"]
follow_up = "Sliding window median gives you the window as a slice and a width k. Which parts of this design would you keep?"
related = ["S5", "S4", "D14"]

[[examples]]
input = "add 1, add 2, find_median, add 3, find_median"
output = "Some(1.5), Some(2.0)"

[[examples]]
input = "add 1, add 2, add 3, remove 2, find_median"
output = "Some(2.0)"

[[hints]]
kind = "approach"
text = "Split the numbers into a lower half (max-heap) and an upper half (min-heap) whose sizes differ by at most one; the median is on the tops."

[[hints]]
kind = "rust"
text = "`BinaryHeap` has no `remove`. Count removed copies in a `HashMap<i32, usize>` and pop them only when they surface; balance the halves by *live* sizes, not `len()`."

[[hints]]
kind = "edge case"
text = "Average the two middles in `f64`: `i32::MAX + i32::MAX` overflows. And a removed value equal to the lower top belongs to the lower half."

[solution]
explanation = "The lower half's top and the upper half's top straddle the median. Adding goes to the side the value belongs to, then one top may move across to restore the sizes. Removal is lazy: the copy is marked in `doomed` and the live size of its half drops; any doomed copy that reaches a top is popped then. Each copy is pushed and popped at most a constant number of times, so everything is O(log n) amortized. Since every mutation prunes the tops, `find_median` only peeks. A sorted `Vec` with binary search is simpler but O(n) per update."
time = "O(log n) amortized per operation"
space = "O(n), including removed copies not yet popped"
