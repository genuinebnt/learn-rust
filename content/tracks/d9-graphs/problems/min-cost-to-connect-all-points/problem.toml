slug = "min-cost-to-connect-all-points"
title = "Min cost to connect all points"
mode = "write"
level = "medium"
stage = "union-find-mst"
order = 44
status = "ready"
tags = ["MST", "Prim", "dense graph"]
teaches = [
  "Prim's algorithm with an array instead of a heap on a complete graph.",
  "O(n²) beats sorting n² edges when every pair is an edge.",
]
constraints = ["1 ≤ points.len() ≤ 3000 (LeetCode: 1000)", "-10⁶ ≤ x, y ≤ 10⁶", "points are distinct"]
follow_up = "With 10⁵ points, how would you avoid looking at all n² pairs? (Hint: for Manhattan distance, each point needs only a few candidate neighbours.)"
related = ["D8"]

[[examples]]
input = "points = [(0,0), (2,2), (3,10), (5,2), (7,0)]"
output = "20"

[[examples]]
input = "points = [(3,12), (-2,5), (-4,1)]"
output = "18"

[[hints]]
kind = "approach"
text = "Every pair is an edge, so there are n² of them. Prim's grows one tree: keep `best[v]`, the cheapest link from each outside point to the tree, and add the smallest each round."

[[hints]]
kind = "rust"
text = "Two `Vec`s (`best`, `inside`) and a linear scan per round; no heap needed on a complete graph. `i32::abs_diff` gives a `u32` with no overflow."

[[hints]]
kind = "edge case"
text = "After adding a point, refresh `best` for every outside point: the cheapest link may be to any tree point, not just the newest."

[solution]
explanation = "On a complete graph, array-based Prim is O(n²), while Kruskal or heap-Prim touch all n² edges plus a log factor."
time = "O(n²)"
space = "O(n)"
