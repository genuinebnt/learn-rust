slug = "three-sum"
title = "3Sum"
mode = "write"
level = "medium"
stage = "pointers"
order = 7
status = "ready"
tags = ["two pointers", "dedup", "Blind 75"]
teaches = [
  "Sort, fix one value, two-pointer the rest.",
  "Skip equal neighbours to avoid duplicate triplets.",
]
follow_up = "How does this generalise to k-sum?"
related = ["D1"]

[[examples]]
input = "nums = [-1, 0, 1, 2, -1, -4]"
output = "[[-1, -1, 2], [-1, 0, 1]]"

[[hints]]
kind = "approach"
text = "Sort. For each first value, find pairs in the rest with two pointers."

[[hints]]
kind = "edge case"
text = "Skip a first value equal to the previous one, and skip repeated left values after a match."

[solution]
explanation = "Sorting makes duplicates adjacent, so skipping neighbours is enough to dedupe. `[i32; 3]` is `Copy` and compares element-wise."
time = "O(n²)"
space = "O(n) for the sorted copy"
