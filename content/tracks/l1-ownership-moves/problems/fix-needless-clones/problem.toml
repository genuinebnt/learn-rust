[solution]
explanation = "The returned `&str`s borrow `self`, so elision ties them to `&self`. No method allocates now except `search`'s result Vec."
time = "O(n)"
space = "O(k)"

[rules]
forbid_methods = ["clone", "cloned", "to_string", "to_owned"]
