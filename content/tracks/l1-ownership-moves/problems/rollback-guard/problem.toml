[[hints]]
kind = "approach"
text = "Remember the length. What runs whether `f` returns or panics?"

[[hints]]
kind = "rust"
text = "A local struct with a `Drop` impl and an `armed` flag: disarm it only after `f` returns."

[solution]
explanation = "Unwinding drops `guard`, which truncates. On success the flag is cleared first, so the drop does nothing. std uses the same pattern inside `Vec::retain` and sort."
time = "O(1) plus the truncate"
space = "O(1)"
