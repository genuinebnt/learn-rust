intuition = """
The judge is trusted by **everyone else** (`n - 1` people) and trusts **nobody**. Give every person a score: **+1 for each person who trusts them, −1 for each person they trust.** The judge ends with exactly `n - 1`: trusted by `n - 1` people and trusting no one. Anyone else who is trusted by all `n - 1` others must also trust someone (at least the judge), so their score is lower, and nobody else can reach `n - 1`.

So one pass over the trust pairs and one pass over the scores finds the judge, or reports `-1`.
"""
tips = [
    "A single net score captures both conditions, because trusting anyone drops you below `n - 1`.",
    "`n = 1` with no trust pairs: the lone person is the judge. The score loop returns `1` since `0 == n - 1`.",
    "People are numbered from 1, so size the array `n + 1`.",
    "Two arrays (`trusted_by` and `trusts`) say the same thing with more code, and are easier to explain.",
]

[[approaches]]
name = "Net trust score"
label = "degree counting"
idea = "Add one to the trusted person and subtract one from the truster; the judge is the only one who can reach n - 1."
time = "O(n + t)"
space = "O(n)"
note = "t is the number of trust pairs."
code = '''class Solution:
    def findJudge(self, n: int, trust: list[list[int]]) -> int:
        score = [0] * (n + 1)
        for a, b in trust:
            score[a] -= 1
            score[b] += 1
        for person in range(1, n + 1):
            if score[person] == n - 1:
                return person
        return -1
'''

[[approaches]]
name = "In-degree and out-degree"
label = "degree counting"
idea = "Count how many trust each person and whom each person trusts; the judge has n - 1 incoming and 0 outgoing."
time = "O(n + t)"
space = "O(n)"
note = "Same idea with two arrays."
code = '''class Solution:
    def findJudge(self, n: int, trust: list[list[int]]) -> int:
        trusted_by = [0] * (n + 1)
        trusts = [0] * (n + 1)
        for a, b in trust:
            trusts[a] += 1
            trusted_by[b] += 1
        for person in range(1, n + 1):
            if trusts[person] == 0 and trusted_by[person] == n - 1:
                return person
        return -1
'''
