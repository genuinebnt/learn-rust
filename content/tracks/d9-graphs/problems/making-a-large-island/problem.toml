slug = "making-a-large-island"
title = "Making a large island"
mode = "write"
level = "hard"
stage = "hard-traversals"
order = 48
status = "ready"
tags = ["grid", "component labels", "flood fill"]
teaches = [
  "Label every island once, then answer each question from the labels.",
  "Counting a neighbour island once even when it touches from several sides.",
]
constraints = ["1 ≤ rows, cols ≤ 500 (LeetCode's grid is square)", "cells are 0 or 1"]
follow_up = "What if you could flip up to k zeros?"
related = ["D6"]

[[examples]]
input = "grid = [[1,0],[0,1]]"
output = "3"

[[examples]]
input = "grid = [[1,1],[1,0]]"
output = "4"

[[examples]]
input = "grid = [[1,1],[1,1]]"
output = "4"

[[hints]]
kind = "approach"
text = "First give every island an id and record its size. Then each 0 is worth 1 plus the sizes of the distinct islands next to it."

[[hints]]
kind = "rust"
text = "Label with an explicit stack (`Vec<(usize, usize)>`): a 250 000-cell island would overflow the call stack with recursion. At most 4 neighbour ids, so a small `Vec` with `contains` dedupes them."

[[hints]]
kind = "edge case"
text = "The same island can touch a 0 on two sides; count it once. A grid with no 0 at all has nothing to flip."

[solution]
explanation = "One labelling pass and one pass over the zeros, each O(1) per cell. Flipping each 0 and re-flooding is O((rows · cols)²)."
time = "O(rows · cols)"
space = "O(rows · cols)"
