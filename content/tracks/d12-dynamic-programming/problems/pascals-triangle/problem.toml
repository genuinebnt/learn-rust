slug = "pascals-triangle"
title = "Pascal's triangle"
mode = "write"
level = "easy"
stage = "1d-basics"
order = 4
status = "ready"
tags = ["Vec<Vec<_>>", "binomials"]
companies = ["Amazon", "Apple", "Google", "Microsoft", "Adobe", "Bloomberg"]
teaches = [
  "Each row is built from the previous one: the smallest table DP.",
  "`windows(2)` sums neighbouring pairs without index arithmetic.",
]
constraints = ["0 ≤ num_rows ≤ 60"]
follow_up = "How would you return only row n in O(n) space?"
related = ["D13", "S3"]

[[examples]]
input = "num_rows = 4"
output = "[[1], [1, 1], [1, 2, 1], [1, 3, 3, 1]]"

[[hints]]
kind = "approach"
text = "Build row r from row r - 1: a 1, then the sums of each neighbouring pair above, then a 1."

[[hints]]
kind = "rust"
text = "`above.windows(2).map(|w| w[0] + w[1])` yields the inner values; `rows.last()` is `None` for the first row."

[[hints]]
kind = "edge case"
text = "Computing C(n, k) with factorials overflows a `u64` from 21! on; adding neighbours never does for these sizes."

[solution]
explanation = "Each row depends only on the row above, so the triangle is its own DP table. Adding neighbours keeps every intermediate value no bigger than the answer."
time = "O(n²)"
space = "O(n²) for the output"
