slug = "find-if-path-exists"
title = "Find if path exists in graph"
mode = "write"
level = "easy"
stage = "representation"
order = 4
status = "ready"
tags = ["BFS", "Vec<Vec<usize>>"]
companies = ["Amazon", "Google", "Microsoft"]
teaches = [
  "Build the adjacency list once, then search it.",
  "A `seen` Vec instead of a `HashSet` when nodes are `0..n`.",
]
constraints = ["1 ≤ n ≤ 2·10⁵", "edges.len() ≤ 2·10⁵"]
follow_up = "With 10⁵ source/destination queries on the same graph, what would you precompute?"

[[examples]]
input = "n = 3, edges = [(0, 1), (1, 2), (2, 0)], source = 0, destination = 2"
output = "true"

[[hints]]
kind = "approach"
text = "Build an adjacency list, then search from `source` with a stack or queue, marking nodes as you go."

[[hints]]
kind = "rust"
text = "`vec![Vec::new(); n]` for the lists and `vec![false; n]` for `seen`; push each undirected edge both ways."

[[hints]]
kind = "edge case"
text = "A 200,000-node path overflows a recursive DFS. Use an explicit stack."

[solution]
explanation = "Each node is pushed once and each edge looked at twice. Union-find answers the same question, and pays off when there are many queries."
time = "O(V + E)"
space = "O(V + E)"
