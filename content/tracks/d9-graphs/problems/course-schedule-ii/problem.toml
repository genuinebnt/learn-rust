slug = "course-schedule-ii"
title = "Course schedule II"
mode = "write"
level = "medium"
stage = "topological-sort"
order = 25
status = "ready"
tags = ["Kahn's", "Option<Vec>"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Uber"]
teaches = [
  "Returning the order Kahn's algorithm produces, not just whether it finishes.",
  "Tests that check a property when many answers are right.",
]
constraints = ["1 ≤ n ≤ 2·10⁵", "prereqs.len() ≤ 2·10⁵"]
follow_up = "How would you return the order that finishes in the fewest semesters, taking any number of courses per semester?"

[[examples]]
input = "n = 4, prereqs = [(0, 1), (0, 2), (1, 3), (2, 3)]"
output = "Some([0, 1, 2, 3]) or Some([0, 2, 1, 3])"

[[hints]]
kind = "approach"
text = "Kahn's algorithm already takes courses in a valid order. Record it instead of just counting."

[[hints]]
kind = "edge case"
text = "If some courses never become ready, there's a cycle: return `None`, not the partial order."

[[hints]]
kind = "rust"
text = "`(order.len() == n).then_some(order)` turns the check and the Vec into the `Option`."

[solution]
explanation = "The order courses leave the queue respects every prerequisite, because a course only enters the queue once all of its prerequisites have left it."
time = "O(V + E)"
space = "O(V + E)"
