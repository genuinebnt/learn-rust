slug = "rotting-oranges"
title = "Rotting oranges"
mode = "write"
level = "medium"
stage = "bfs-patterns"
order = 16
status = "ready"
tags = ["multi-source BFS", "VecDeque", "Option"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg", "DoorDash"]
teaches = [
  "Multi-source BFS: seed the queue with every source.",
  "`Option` for 'impossible' instead of `-1`.",
]
constraints = ["1 ≤ rows, cols ≤ 500"]
follow_up = "How would the answer change if some oranges took two minutes to spread rot?"
related = ["S1"]

[[examples]]
input = "grid = [[2,1,1],[1,1,0],[0,1,1]]"
output = "Some(4)"

[[examples]]
input = "grid = [[2,1,1],[0,1,1],[1,0,1]]"
output = "None"

[[hints]]
kind = "approach"
text = "Start the BFS from every rotten orange at once, at minute 0. The last minute you dequeue is the answer."

[[hints]]
kind = "edge case"
text = "Count fresh oranges first. If any are left when the queue empties, return `None`."

[solution]
explanation = "Seeding the queue with all sources makes BFS levels equal minutes. `then_some` turns the fresh count into the `Option` result."
time = "O(rows · cols)"
space = "O(rows · cols)"
