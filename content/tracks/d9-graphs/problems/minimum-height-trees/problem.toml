slug = "minimum-height-trees"
title = "Minimum height trees"
mode = "write"
level = "medium"
stage = "topological-sort"
order = 28
status = "ready"
tags = ["leaf trimming", "tree centre"]
companies = ["Meta", "Amazon", "Google", "Microsoft"]
teaches = [
  "Peeling leaves layer by layer, like Kahn's algorithm on an undirected tree.",
  "A tree has one or two centres.",
]
constraints = ["1 ≤ n ≤ 2·10⁵", "edges.len() == n − 1"]
follow_up = "How would you find the tree's diameter with two BFS runs, and how does that give the centres too?"

[[examples]]
input = "n = 6, edges = [(3, 0), (3, 1), (3, 2), (3, 4), (5, 4)]"
output = "[3, 4]"

[[hints]]
kind = "approach"
text = "A leaf is never a better root than its neighbour. Remove all current leaves, then the new leaves, and so on."

[[hints]]
kind = "approach"
text = "Stop when at most two nodes are left: those are the centres of the longest path, and the answer."

[[hints]]
kind = "edge case"
text = "With one or two nodes, every node is an answer."

[solution]
explanation = "Trimming leaves in rounds is Kahn's algorithm on an undirected tree. The survivors are the middle of every longest path, so there are at most two."
time = "O(n)"
space = "O(n)"
