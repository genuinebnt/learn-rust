intuition = """
A person can attend every meeting only if **no two meetings overlap**. Sort the meetings by start time; then a clash can only be between **neighbours**: if any meeting starts **before the previous one ends**, you can't attend both.
"""
tips = [
    "Meetings that only touch (one ends at 5, the next starts at 5) don't clash, so the test is a strict `<`.",
    "An empty list, or a single meeting, returns `True`.",
    "Sorting is the whole solution; the interview signal is explaining why checking only neighbours is enough.",
    "This is a Premium problem on LeetCode.",
]

[[approaches]]
name = "Sort and compare neighbours"
label = "sort"
idea = "After sorting by start, check each meeting's start against the previous meeting's end."
time = "O(n log n)"
space = "O(1)"
time_why = "Sorting costs n log n and the neighbour comparison is one pass."
space_why = "The sort works in place, so only a few variables are extra."
note = "Besides the sort."
code = '''class Solution:
    def canAttendMeetings(self, intervals: list[list[int]]) -> bool:
        intervals = sorted(intervals)
        for i in range(1, len(intervals)):
            if intervals[i][0] < intervals[i - 1][1]:
                return False
        return True
'''
