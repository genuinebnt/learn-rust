code = "1b"
title = "Disk scheduler"
summary = "A blocking channel, a one-shot promise/future, a background worker that runs disk requests in order, a reader-writer latch, and a sharded scheduler. BusTub Project 1, second part."
lectures = ["storage1", "bufferpool"]
bustub = ["src/include/common/channel.h", "src/include/storage/disk/disk_scheduler.h", "src/storage/disk/disk_scheduler.cpp", "src/include/common/rwlatch.h", "test/storage/disk_scheduler_test.cpp", "test/common/rwlatch_test.cpp"]

