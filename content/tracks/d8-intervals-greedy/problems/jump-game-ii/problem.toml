slug = "jump-game-ii"
title = "Jump game II"
mode = "write"
level = "medium"
stage = "greedy-choices"
order = 15
status = "ready"
tags = ["greedy", "BFS", "arrays"]
companies = ["Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "BFS by levels collapses into two numbers when each level is a contiguous window.",
  "`Option<usize>` for \"can't be reached\" instead of LeetCode's guarantee.",
]
constraints = ["1 ≤ nums.len() ≤ 2·10⁵", "0 ≤ nums[i] ≤ 10⁹"]
follow_up = "How would you return the actual indices you land on, not just the count?"
related = ["D9", "D12"]

[[examples]]
input = "nums = [2, 3, 1, 1, 4]"
output = "Some(2)"

[[examples]]
input = "nums = [2, 3, 0, 1, 4]"
output = "Some(2)"

[[hints]]
kind = "approach"
text = "Think in rounds, like BFS: the indices reachable in exactly j jumps form a window. Scanning the current window tells you how far the next window reaches."

[[hints]]
kind = "rust"
text = "Keep `end` (the edge of the current window) and `far`. When `i == end` you must jump: count it and set `end = far`."

[[hints]]
kind = "edge case"
text = "Don't jump from the last index: loop over `nums[..last]`. If `far` hasn't passed `i` when you must jump, return `None`."

[solution]
explanation = "The indices reachable in j jumps form a contiguous window, so BFS needs only the window's end and the farthest index seen inside it. Each index is scanned once."
time = "O(n)"
space = "O(1)"
