slug = "edge-list-to-csr"
title = "Edge list to CSR"
mode = "write"
level = "medium"
stage = "representation"
order = 3
status = "ready"
tags = ["CSR", "prefix sums", "slices"]
teaches = [
  "Compressed sparse row: two flat Vecs instead of `Vec<Vec<_>>`.",
  "Returning `&[usize]` slices into your own storage.",
]
constraints = ["0 ≤ n ≤ 10⁶", "edges.len() ≤ 10⁶"]
follow_up = "How would you add edges after construction without rebuilding everything?"
related = ["S3"]

[[examples]]
input = "n = 3, edges = [(1, 2), (0, 1), (1, 0)]"
output = "offsets = [0, 1, 3, 3], targets = [1, 2, 0]"

[[hints]]
kind = "approach"
text = "Count each node's out-degree into `offsets[u + 1]`, then take a running sum."

[[hints]]
kind = "approach"
text = "Keep a copy of the start offsets as write cursors, and place each edge at its source's cursor."

[[hints]]
kind = "rust"
text = "`neighbors` returns a slice of `targets`; its lifetime is tied to `&self` by elision."

[solution]
explanation = "Two passes over the edges and one prefix sum. The graph lives in two allocations instead of n + 1, which is friendlier to the cache and the allocator."
time = "O(V + E)"
space = "O(V + E)"
