slug = "fix-closure-may-outlive"
title = "Fix: closure may outlive the function"
mode = "fix"
level = "medium"
stage = "closures-take-ownership"
order = 12
status = "ready"
tags = ["E0373", "move"]
teaches = [
  "A returned closure can't borrow a local: the local dies with the function.",
  "`move` makes the closure own what it captures.",
]
follow_up = "Why is this closure `FnMut` and not `Fn`?"
related = ["L6"]

[[hints]]
kind = "rust"
text = "`n` lives on `counter`'s stack. The closure outlives that frame. How does it keep `n`?"

[solution]
explanation = "`move` copies `n` into the closure, which then owns its own counter. Each call mutates that copy, hence `FnMut`."
time = "O(1)"
space = "O(1)"

