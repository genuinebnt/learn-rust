slug = "pow-x-n"
title = "Pow(x, n)"
mode = "write"
level = "easy"
stage = "recursion"
order = 1
status = "ready"
tags = ["recursion", "fast power"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "LinkedIn", "Bloomberg"]
teaches = [
  "Halve the problem: x⁽ⁿ⁾ = (x⁽ⁿᐟ²⁾)², so the recursion is only log n deep.",
  "`i32::unsigned_abs` avoids the overflow of `-i32::MIN`.",
]
constraints = ["-100 < x < 100", "i32::MIN ≤ n ≤ i32::MAX", "x ≠ 0 when n < 0, except where the answer is ∞"]
follow_up = "Write it iteratively by walking the bits of n. Where does modular exponentiation use the same idea?"
related = ["D13", "S1"]

[[examples]]
input = "x = 2.0, n = 10"
output = "1024.0"

[[examples]]
input = "x = 2.1, n = 3"
output = "9.261"

[[examples]]
input = "x = 2.0, n = -2"
output = "0.25"

[[hints]]
kind = "approach"
text = "x^n = (x^(n/2))² when n is even, and one more factor of x when n is odd. Compute the half once."

[[hints]]
kind = "rust"
text = "Work on `n.unsigned_abs()` (a `u32`) in an inner `fn`, then take `1.0 / p` for a negative `n`."

[[hints]]
kind = "edge case"
text = "`-i32::MIN` overflows and panics in a debug build."

[solution]
explanation = "Each call halves the exponent and reuses one recursive result, so there are about log₂|n| calls. Working on the unsigned magnitude sidesteps the one negative `i32` with no positive twin."
time = "O(log n)"
space = "O(log n) recursion depth"
