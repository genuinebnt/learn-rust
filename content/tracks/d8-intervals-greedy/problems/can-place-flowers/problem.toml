slug = "can-place-flowers"
title = "Can place flowers"
mode = "write"
level = "easy"
stage = "first-greedy"
order = 3
status = "ready"
tags = ["greedy", "slices"]
companies = ["Meta", "Amazon", "Google", "LinkedIn"]
teaches = [
  "`slice.get(i + 1)` reads a neighbour that might be past the end without panicking.",
  "Planting as early as possible never blocks a better plan.",
]
constraints = ["0 ≤ bed.len() ≤ 2·10⁵", "bed never has two adjacent flowers", "0 ≤ n ≤ bed.len() + 1"]
follow_up = "How would you answer many queries of different `n` on the same bed without rescanning?"
related = ["S3"]

[[examples]]
input = "bed = [1, 0, 0, 0, 1], n = 1"
output = "true"

[[examples]]
input = "bed = [1, 0, 0, 0, 1], n = 2"
output = "false"

[[hints]]
kind = "approach"
text = "Walk left to right and plant in every empty plot whose neighbours are both empty. Planting early never costs you a spot later."

[[hints]]
kind = "rust"
text = "`bed.get(i + 1).copied().unwrap_or(false)` treats the plot past the end as empty; keep a flag for the left neighbour so you don't need to mutate the input."

[[hints]]
kind = "edge case"
text = "The first and last plots only have one neighbour, and `n = 0` is always possible."

[solution]
explanation = "Planting at the leftmost legal plot leaves at least as much room to the right as any other choice, so one greedy pass finds the maximum."
time = "O(n)"
space = "O(1)"
