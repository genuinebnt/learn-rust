slug = "burst-balloons"
title = "Burst balloons"
mode = "write"
level = "hard"
stage = "intervals-games"
order = 45
status = "ready"
tags = ["interval DP", "dp[i][j] by length"]
companies = ["Google", "Amazon", "Meta", "Microsoft", "Apple"]
teaches = [
  "Choosing the LAST action in an interval so its neighbours are fixed: the key trick of interval DP.",
  "Padding with sentinel 1s so edge balloons need no special case.",
]
constraints = ["0 ≤ nums.len() ≤ 300", "0 ≤ nums[i] ≤ 100"]
follow_up = "Why does \"first to burst\" fail to give independent subproblems, while \"last to burst\" works?"
related = ["D11"]

[[examples]]
input = "nums = [3, 1, 5, 8]"
output = "167 (burst 1, 5, 3, 8: 15 + 120 + 24 + 8)"

[[hints]]
kind = "approach"
text = "Think about the last balloon k burst between two fixed balloons i and j: when it goes, its neighbours are exactly i and j, and the two sides were solved independently before."

[[hints]]
kind = "rust"
text = "Pad the numbers with a 1 at each end, then fill `best[i][j]` by increasing j - i: max over k of best[i][k] + best[k][j] + a[i]·a[k]·a[j]."

[[hints]]
kind = "edge case"
text = "Choosing the FIRST balloon to burst doesn't split the problem, because its neighbours' neighbours change afterwards. Bursting the smallest first is not optimal either."

[solution]
explanation = "Fixing the last balloon in an interval freezes its neighbours at the interval's ends, which makes the left and right parts independent. There are O(n²) intervals and each tries O(n) last balloons."
time = "O(n³)"
space = "O(n²)"
