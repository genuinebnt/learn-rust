slug = "sudoku-solver"
title = "Sudoku solver"
mode = "write"
level = "hard"
stage = "constraints-pruning"
order = 24
status = "ready"
tags = ["backtracking", "bitmask", "pruning"]
companies = ["Apple", "Amazon", "Google", "Microsoft", "Uber", "DoorDash"]
teaches = [
  "Constraint bookkeeping: a `u16` of used digits per row, column and box gives any cell's candidates in one expression.",
  "Most constrained cell first: always branch on the empty cell with the fewest candidates, so forced moves cost nothing and dead ends show up at once.",
]
constraints = ["`board` is 9 × 9, every cell 0 to 9", "the givens may clash, and the puzzle may have no solution or several"]
follow_up = "Add constraint propagation: when a digit fits in only one cell of a row, column or box, place it at once. How much does the search shrink?"
related = ["D13"]

[[examples]]
input = "board = LeetCode's example: 53..7.... 6..195... .98....6. 8...6...3 4..8.3..1 7...2...6 .6....28. ...419..5 ....8..79 (. = 0)"
output = "true; board = 534678912 672195348 198342567 859761423 426853791 713924856 961537284 287419635 345286179"

[[examples]]
input = "board = 5...5.... then eight empty rows"
output = "false; board unchanged (two 5s in the first row)"

[[hints]]
kind = "approach"
text = "Keep, for each row, column and box, which digits are used. Then repeatedly pick the empty cell with the fewest candidates, try each, recurse, and undo. Check the givens against each other before you start."

[[hints]]
kind = "rust"
text = "`[[u16; 9]; 3]` holds the used digits (bit d = digit d). A cell's candidates are `0b11_1111_1110 & !(rows[r] | cols[c] | boxes[b])`, and `count_ones()` ranks the cells."

[[hints]]
kind = "edge case"
text = "On `false` the board must be unchanged: set a guessed cell back to 0 when every candidate has failed."

[solution]
explanation = "Branching on the most constrained cell (the minimum-remaining-values rule) makes forced cells free and finds a contradiction, a cell with no candidates, before any more guesses stack on top of it. Reading-order search has no such guard: on a puzzle built against it, it enumerates millions of first-row prefixes. The masks make each candidate test a few bit operations instead of 27 cell reads. Syntax to remember: a labelled `break 'scan` leaves both loops."
time = "exponential in the worst case; a few thousand nodes on hard puzzles"
space = "O(81) recursion depth, O(1) masks"
