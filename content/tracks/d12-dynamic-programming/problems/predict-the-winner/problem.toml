slug = "predict-the-winner"
title = "Predict the winner"
mode = "write"
level = "medium"
stage = "intervals-games"
order = 41
status = "ready"
tags = ["interval DP", "minimax"]
companies = ["Google", "Amazon", "Microsoft", "Meta"]
teaches = [
  "Game DP as a score difference: the mover's best lead on `nums[i..=j]` is what they take minus the opponent's best lead after.",
  "Filling `dp[i][j]` by interval length, in one rolling row.",
]
constraints = ["0 ≤ nums.len() ≤ 1000", "0 ≤ nums[i] ≤ 10⁷"]
follow_up = "When the length is even, player 1 can always at least tie without any DP. Why? (Take all even or all odd positions.)"
related = ["D11"]

[[examples]]
input = "nums = [1, 5, 2]"
output = "false"

[[examples]]
input = "nums = [1, 5, 233, 7]"
output = "true (take 1, then 233)"

[[hints]]
kind = "approach"
text = "Let lead(i, j) be the best score difference for whoever moves on nums[i..=j]. Taking an end gives that number minus the opponent's best lead on what's left."

[[hints]]
kind = "rust"
text = "Fill by increasing length, or with one `Vec<i64>`: loop i downwards and j upwards; `lead[j]` still holds (i + 1, j) and `lead[j - 1]` already holds (i, j - 1)."

[[hints]]
kind = "edge case"
text = "Taking the bigger end each turn is not optimal: [1, 5, 233, 7] needs player 1 to take the 1."

[solution]
explanation = "Scoring the game as a difference makes it zero-sum, so one number per interval suffices: my lead = what I take - your lead afterwards. Every interval depends on the two intervals one shorter."
time = "O(n²)"
space = "O(n)"
