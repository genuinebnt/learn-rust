intuition = """
Water above a bar sits at the level of the **lower of the tallest bar to its left and the tallest bar to its right**, minus the bar's own height. So the answer is the sum over all positions of `min(max_left, max_right) - height`.

You can compute `max_left` and `max_right` with two sweeps, or do it in **one pass with two pointers**: keep the running maximum from each side and always process the side with the smaller maximum. That side's water level is already decided by its own max, because the other side has something at least as tall.
"""
tips = [
    "Explain the formula for one bar first: `min(tallest left, tallest right) - height`. The rest is just computing it efficiently.",
    "In the pointer version, move the pointer on the side whose running max is **smaller**. The other side is guaranteed to be at least as high, so the smaller max is the true water level there.",
    "Update the side's running max **before** adding water, so a new tallest bar contributes zero rather than a negative amount.",
    "A monotonic stack also solves it (layer by layer); the two-pointer version has O(1) space and is the usual target.",
]

[[approaches]]
name = "Two pointers with running maxima"
label = "two pointers"
idea = "Keep `left_max` and `right_max`. Whichever is smaller decides the water level on its side, so advance that pointer and add `max - height`."
time = "O(n)"
space = "O(1)"
time_why = "The two pointers move toward each other and never back, so at most n steps."
space_why = "Only two pointers and two maxima."
note = "One pass, two integers."
code = '''class Solution:
    def trap(self, height: list[int]) -> int:
        left, right = 0, len(height) - 1
        left_max = right_max = 0
        water = 0
        while left < right:
            if height[left] < height[right]:
                left_max = max(left_max, height[left])
                water += left_max - height[left]
                left += 1
            else:
                right_max = max(right_max, height[right])
                water += right_max - height[right]
                right -= 1
        return water
'''

[[approaches]]
name = "Prefix and suffix maxima"
label = "prefix + suffix"
idea = "Precompute the tallest bar to the left and to the right of every position, then sum `min(...) - height`."
time = "O(n)"
space = "O(n)"
time_why = "One pass for each of the two maxima arrays and one to add up the water."
space_why = "Two helper arrays of n numbers."
note = "The clearest version; two helper arrays."
code = '''class Solution:
    def trap(self, height: list[int]) -> int:
        n = len(height)
        if n == 0:
            return 0
        left_max = [0] * n
        right_max = [0] * n
        left_max[0] = height[0]
        for i in range(1, n):
            left_max[i] = max(left_max[i - 1], height[i])
        right_max[-1] = height[-1]
        for i in range(n - 2, -1, -1):
            right_max[i] = max(right_max[i + 1], height[i])
        return sum(min(left_max[i], right_max[i]) - height[i] for i in range(n))
'''

[[approaches]]
name = "Monotonic stack"
label = "stack"
idea = "Keep a stack of bar indices with decreasing heights. When a taller bar arrives, each popped bar is the floor of a basin; its water is bounded by the new bar and the one below it on the stack."
time = "O(n)"
space = "O(n)"
time_why = "Each bar is pushed once and popped at most once."
space_why = "The stack can hold every bar when the heights only fall."
note = "Each index is pushed and popped once."
code = '''class Solution:
    def trap(self, height: list[int]) -> int:
        stack = []
        water = 0
        for i, h in enumerate(height):
            while stack and h > height[stack[-1]]:
                floor = height[stack.pop()]
                if not stack:
                    break
                width = i - stack[-1] - 1
                water += width * (min(h, height[stack[-1]]) - floor)
            stack.append(i)
        return water
'''
