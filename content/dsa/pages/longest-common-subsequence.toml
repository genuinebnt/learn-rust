intuition = """
Compare the strings from the **front**. Let `lcs[i][j]` be the longest common subsequence of `text1[:i]` and `text2[:j]`.

- If the last characters match (`text1[i-1] == text2[j-1]`), that character extends the best of the shorter prefixes: `1 + lcs[i-1][j-1]`.
- Otherwise drop the last character of one string or the other: `max(lcs[i-1][j], lcs[i][j-1])`.

The answer is `lcs[len(text1)][len(text2)]`. This table shape (two strings, one index each) is behind Edit Distance, Distinct Subsequences and many more.
"""
tips = [
    "A **subsequence** keeps order but may skip characters; a substring must be contiguous. Don't mix them up.",
    "Make the table `(len1 + 1) × (len2 + 1)` with a row and column of zeros for the empty prefixes.",
    "Each cell uses only the row above and the current row, so two rows suffice.",
    "Say the recurrence in two cases, \"match\" and \"no match\", before coding.",
]

[[approaches]]
name = "Table of prefixes"
label = "2-D table"
idea = "`lcs[i][j]` is `1 + lcs[i-1][j-1]` when the characters match, else the larger of dropping one character from either string."
time = "O(m · n)"
space = "O(m · n)"
time_why = "Each cell of the table is filled in constant time from three neighbours."
space_why = "The table has one cell for every pair of prefixes."
note = "The standard table."
code = '''class Solution:
    def longestCommonSubsequence(self, text1: str, text2: str) -> int:
        rows, cols = len(text1), len(text2)
        lcs = [[0] * (cols + 1) for _ in range(rows + 1)]
        for i in range(1, rows + 1):
            for j in range(1, cols + 1):
                if text1[i - 1] == text2[j - 1]:
                    lcs[i][j] = 1 + lcs[i - 1][j - 1]
                else:
                    lcs[i][j] = max(lcs[i - 1][j], lcs[i][j - 1])
        return lcs[rows][cols]
'''

[[approaches]]
name = "Two rows"
label = "two rows"
idea = "The same recurrence, keeping only the previous row and the one being built."
time = "O(m · n)"
space = "O(n)"
time_why = "The same m × n cells, each filled from the row above and the cell to the left."
space_why = "Two rows of n + 1 values."
note = "Pick the shorter string for the row to save more."
code = '''class Solution:
    def longestCommonSubsequence(self, text1: str, text2: str) -> int:
        if len(text2) > len(text1):
            text1, text2 = text2, text1
        previous = [0] * (len(text2) + 1)
        for ch in text1:
            current = [0]
            for j, other in enumerate(text2, start=1):
                if ch == other:
                    current.append(1 + previous[j - 1])
                else:
                    current.append(max(previous[j], current[j - 1]))
            previous = current
        return previous[-1]
'''
