slug = "restore-ip-addresses"
title = "Restore IP addresses"
mode = "write"
level = "medium"
stage = "choices-grids"
order = 20
status = "ready"
tags = ["backtracking", "String", "pruning"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft"]
teaches = [
  "A fixed depth (four parts) with a small choice at each level (1 to 3 digits).",
  "Prune on length: the digits left must fit in the parts left.",
]
constraints = ["1 ≤ s.len() ≤ 20", "s holds only ASCII digits"]
follow_up = "How would you do the same for IPv6, with hex groups and the `::` shorthand?"
related = ["S2", "D2"]

[[examples]]
input = "s = \"25525511135\""
output = "[\"255.255.11.135\", \"255.255.111.35\"]"

[[examples]]
input = "s = \"0000\""
output = "[\"0.0.0.0\"]"

[[hints]]
kind = "approach"
text = "Choose the parts one at a time: 1, 2 or 3 digits each. After four parts, keep the address only if every digit was used."

[[hints]]
kind = "rust"
text = "Recurse on the remaining `&str` and collect parts as `&str` slices in a `Vec`; `parts.join(\".\")` builds the answer."

[[hints]]
kind = "edge case"
text = "`0` is a valid part but `00` and `012` are not, and a three-digit part must be at most 255. If the digits left can't fill the parts left (1 to 3 each), stop early."

[solution]
explanation = "There are at most 3⁴ = 81 ways to choose the part lengths, so the search is constant-sized; the length check stops long inputs (up to 20 digits) before any work."
time = "O(1): at most 81 leaves"
space = "O(1) besides the output"
