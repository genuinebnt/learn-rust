slug = "fix-moved-mut-into-generic"
title = "Fix: a &mut moved where you meant to lend it"
mode = "fix"
level = "medium"
stage = "reborrows"
order = 11
status = "ready"
tags = ["E0382", "reborrow", "as_deref_mut", "Iterator::by_ref"]
teaches = [
  "A `&mut` moves into a generic parameter; `&mut *r` lends it instead.",
  "`Option<&mut T>::as_deref_mut()` reborrows the inner `&mut`.",
  "`Iterator::by_ref()` lends an iterator to a consuming adapter.",
]
follow_up = "`fmt::Write` has `impl<W: Write + ?Sized> Write for &mut W`. Without it, could `put(&mut *out, ..)` work at all?"
related = ["L2"]

[[hints]]
kind = "rust"
text = "Three moves: `out` (a `&mut String`) into `put`'s generic `W`, `lines` into `take`, and `alerts` (an `Option<&mut Vec<String>>`) into `note` inside a loop. None of them is `Copy`."

[[hints]]
kind = "rust"
text = "A `&mut` passed where the parameter type is exactly `&mut T` is reborrowed automatically; into a generic `W` it's moved. `&mut *out` lends a fresh, shorter borrow. Iterators have `by_ref()` for the same purpose."

[[hints]]
kind = "rust"
text = "For `Option<&mut T>`, `as_deref_mut()` gives an `Option<&mut T>` that reborrows the one inside, leaving `alerts` usable. `note` has one more call after the loop: that one can take `alerts` itself."

[solution]
explanation = "`&mut T` isn't `Copy`, so using one by value moves it. Rust inserts a reborrow (`&mut *out`) only where it knows the target type is a `&mut`; a generic parameter `W` isn't known to be one, so `put(out, ..)` moves `out` into `W = &mut String`. The same holds for anything that wraps a `&mut`: an `Option<&mut Vec<String>>` moves into `note`, and an iterator moves into `take` (its adapters take `self`). Each has its own way to lend: `&mut *out`; `alerts.as_deref_mut()` (or `alerts.as_mut().map(|a| &mut **a)`), which needs `mut alerts`; and `lines.by_ref()`, which is `&mut I`, itself an iterator. The last use of each can still move.\n\nSyntax to remember: `put(&mut *out, s)` · `fn f(mut alerts: Option<&mut Vec<String>>)` then `alerts.as_deref_mut()` · `lines.by_ref().take(n)`."
time = "O(total length)"
space = "O(header)"

[rules]
forbid_methods = ["clone", "to_owned"]
max_changed_lines = 9
