slug = "path-with-minimum-effort"
title = "Path with minimum effort"
mode = "write"
level = "medium"
stage = "shortest-paths"
order = 32
status = "ready"
tags = ["Dijkstra", "grid", "abs_diff"]
companies = ["Meta", "Amazon", "Google"]
teaches = [
  "Dijkstra with a max-of-edges path cost.",
  "`u32::abs_diff` instead of signed casts.",
]
constraints = ["1 ≤ rows, cols ≤ 300", "heights ≤ 10⁶"]
follow_up = "Solve it with binary search on the answer plus BFS. Which is simpler to get right?"

[[examples]]
input = "heights = [[1,2,2],[3,8,2],[5,3,5]]"
output = "2"

[[hints]]
kind = "approach"
text = "It's Dijkstra where a path's cost is the max edge on it, not the sum. The max is still monotone, so Dijkstra still works."

[[hints]]
kind = "rust"
text = "`a.abs_diff(b)` gives the unsigned difference of two `u32`s without casting to signed."

[solution]
explanation = "Lazy deletion skips stale heap entries, and returning when the target pops is safe because costs never decrease along a path."
time = "O(rc log rc)"
space = "O(rc)"
