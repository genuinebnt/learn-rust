slug = "palindromic-substrings"
title = "Palindromic substrings"
mode = "write"
level = "medium"
stage = "string-algorithms"
order = 15
status = "ready"
tags = ["palindrome", "chars", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Microsoft"]
teaches = [
  "Counting reuses the expand-around-centre loop: every step outwards is one more palindrome.",
  "Substrings at different positions count separately, even when they're equal.",
]
constraints = ["0 ≤ number of characters ≤ 5000"]
follow_up = "With Manacher's radii, how do you get the count in O(n)?"
related = ["D12"]

[[examples]]
input = "s = \"abc\""
output = "3"

[[examples]]
input = "s = \"aaa\""
output = "6"

[[hints]]
kind = "approach"
text = "Expand around each centre as in the longest-palindrome problem, but count every step: each time both ends match, that's one more palindrome."

[[hints]]
kind = "rust"
text = "Index a `Vec<char>`, not the bytes. With `usize` indices, check `l == 0` before `l -= 1` instead of letting it underflow."

[[hints]]
kind = "edge case"
text = "There are two kinds of centre: a character (`\"aba\"`) and the gap between two (`\"abba\"`). Missing the gaps undercounts."

[solution]
explanation = "Each expansion step finds a new palindrome, so the work equals the answer plus 2n − 1 failed steps: O(n²) worst case (all one letter, n(n+1)/2 palindromes), and the answer itself can be that big. Checking every substring is O(n³). Manacher's algorithm gives every centre's radius in O(n), and the count is the sum of the radii."
time = "O(n²)"
space = "O(n) for the characters"
