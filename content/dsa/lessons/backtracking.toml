pattern = "Backtracking"
intro = "Backtracking builds an answer one choice at a time and undoes the choice to try the next. Picture a tree of decisions: at each node you choose, recurse, and un-choose. What changes between problems is what a choice is, when a branch is dead (prune early), and when the path so far is a complete answer."
groups = ["Subsets, combinations and permutations", "Constraint satisfaction", "Partitioning", "String generation", "Grid and word search with visited state", "Path enumeration in graphs and trees", "Pruning techniques", "Bitmask state", "Meet in the middle", "Iterative generation", "Branch and bound and search order", "Game-tree search", "Backtracking versus DP boundary", "Core implementation patterns"]








