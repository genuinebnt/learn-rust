slug = "top-k-frequent-words"
title = "Top K frequent words"
mode = "write"
level = "medium"
stage = "heaps-at-work"
order = 8
status = "ready"
tags = ["BinaryHeap", "Reverse", "custom order", "&str"]
companies = ["Amazon", "Meta", "Google", "Microsoft", "Bloomberg", "Uber"]
teaches = [
  "`(Reverse(count), word)` puts \"worse\" on top of a max-heap: lower count, then later word.",
  "A size-k heap is O(n log k) instead of sorting every distinct word.",
  "Return `&'a str` slices of the input instead of new `String`s.",
]
constraints = ["0 ≤ words.len() ≤ 5·10⁵", "0 ≤ k"]
follow_up = "How would you answer this for a stream of words that never ends, with k fixed?"
related = ["D1", "S4", "L3"]

[[examples]]
input = "words = [\"i\", \"love\", \"leetcode\", \"i\", \"love\", \"coding\"], k = 2"
output = "[\"i\", \"love\"]"

[[examples]]
input = "words = [\"the\", \"day\", \"is\", \"sunny\", \"the\", \"the\", \"the\", \"sunny\", \"is\", \"is\"], k = 4"
output = "[\"the\", \"is\", \"sunny\", \"day\"]"

[[hints]]
kind = "approach"
text = "Count with a `HashMap`, then keep only the k best words in a heap whose top is the worst of them."

[[hints]]
kind = "rust"
text = "\"Worse\" means lower count, or the same count and a later word. `(Reverse(count), word)` in a max-heap orders exactly that way, and `into_sorted_vec()` then lists best first."

[[hints]]
kind = "edge case"
text = "Equal counts at the cut-off: the word that stays is the lexicographically smaller one."

[solution]
explanation = "The heap holds at most k entries and its top is the one to evict. Wrapping only the count in `Reverse` makes the tuple compare counts descending but words ascending, so one derived tuple order encodes the whole rule; no custom `Ord` impl needed. The map's keys are the input's `&'a str`, so nothing is copied."
time = "O(n + d log k) for d different words"
space = "O(d)"
