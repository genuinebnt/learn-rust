code = "3f"
title = "Aggregation and joins"
summary = "The operators that combine rows: GROUP BY with a hash table and the five aggregate functions, and joins three ways: a nested loop (any predicate), a hash join (equality) and an index join (equality through an index), each inner and left. BusTub Project 3, task 2."
lectures = ["queryexecution2", "joins", "sorting"]
bustub = ["src/include/execution/executors/aggregation_executor.h", "src/execution/aggregation_executor.cpp", "src/execution/nested_loop_join_executor.cpp", "src/execution/hash_join_executor.cpp", "src/execution/nested_index_join_executor.cpp", "src/include/execution/plans/aggregation_plan.h", "src/include/execution/plans/hash_join_plan.h", "src/include/execution/plans/nested_loop_join_plan.h", "src/include/execution/plans/nested_index_join_plan.h", "test/sql/p3.07-simple-agg.slt", "test/sql/p3.08-group-agg-1.slt", "test/sql/p3.09-group-agg-2.slt", "test/sql/p3.10-simple-join.slt", "test/sql/p3.11-multi-way-join.slt", "test/sql/p3.12-repeat-execute.slt", "test/sql/p3.13-nested-index-join.slt"]
files = [
    "tests/sql/p3.07-simple-agg.slt",
