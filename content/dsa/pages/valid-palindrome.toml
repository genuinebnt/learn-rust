intuition = """
A palindrome reads the same from both ends, so compare the **first and last meaningful characters**, then the second and second-to-last, and so on. Two pointers, one starting at each end, walk toward each other. Skip anything that isn't a letter or digit, and compare the rest ignoring case.

If you're allowed O(n) extra space, you can instead build the cleaned string and compare it with its reverse. The pointers do the same job without the copy.
"""
tips = [
    "Move each pointer past non-alphanumeric characters **before** comparing, and keep `left < right` in those inner loops too, or a string of only punctuation walks off the end.",
    "`str.isalnum()` and `str.lower()` do the cleaning for you. Say what \"alphanumeric\" means here: letters and digits only.",
    "An empty string, or one with no letters or digits at all, is a palindrome.",
    "The one-liner `t = [c.lower() for c in s if c.isalnum()]; t == t[::-1]` is a valid first answer; follow it with the O(1)-space pointers.",
]

[[approaches]]
name = "Two pointers from both ends"
label = "two pointers"
idea = "Start at both ends, skip non-alphanumerics, compare lower-cased characters, and move inward until the pointers meet."
time = "O(n)"
space = "O(1)"
note = "Each character is looked at once; nothing is copied."
code = '''class Solution:
    def isPalindrome(self, s: str) -> bool:
        left, right = 0, len(s) - 1
        while left < right:
            while left < right and not s[left].isalnum():
                left += 1
            while left < right and not s[right].isalnum():
                right -= 1
            if s[left].lower() != s[right].lower():
                return False
            left += 1
            right -= 1
        return True
'''

[[approaches]]
name = "Clean, then compare with the reverse"
label = "clean + reverse"
idea = "Keep only the lower-cased letters and digits, then check the result equals itself reversed."
time = "O(n)"
space = "O(n)"
note = "Simplest to write; it builds a cleaned copy."
code = '''class Solution:
    def isPalindrome(self, s: str) -> bool:
        cleaned = [c.lower() for c in s if c.isalnum()]
        return cleaned == cleaned[::-1]
'''
