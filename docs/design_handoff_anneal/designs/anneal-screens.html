<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>anneal screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens: dark first, light via data-theme or OS preference ---------- */
:root{--bg:oklch(0.165 0.012 255);--panel:oklch(0.195 0.013 255);--raise:oklch(0.235 0.014 255);--line:oklch(0.32 0.014 255);--line2:oklch(0.255 0.013 255);--grid:oklch(0.205 0.012 255);--fg:oklch(0.95 0.005 255);--mut:oklch(0.80 0.01 255);--dim:oklch(0.63 0.012 255);--acc:oklch(0.76 0.11 55);--acc-bg:oklch(0.76 0.11 55 / 0.14);--vio:oklch(0.72 0.13 290);--vio-bg:oklch(0.72 0.13 290 / 0.14);--grn:oklch(0.77 0.13 165);--grn-bg:oklch(0.77 0.13 165 / 0.13);--bad:oklch(0.70 0.16 25);--bad-bg:oklch(0.70 0.16 25 / 0.14);--warn:oklch(0.83 0.12 85);--warn-bg:oklch(0.83 0.12 85 / 0.12);--on-acc:oklch(0.17 0.02 255);--kw:oklch(0.75 0.12 290);--ty:oklch(0.82 0.10 70);--fn:oklch(0.79 0.10 235);--str:oklch(0.79 0.11 160);--num:oklch(0.79 0.11 45);--mac:oklch(0.79 0.09 200);--lt:oklch(0.77 0.12 340);--com:oklch(0.58 0.012 255);--inlay:oklch(0.64 0.012 255);--inlay-bg:oklch(0.235 0.013 255);--sel:oklch(0.76 0.11 55 / 0.07);--shadow:oklch(0 0 0 / 0.35);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:oklch(0.975 0.003 255);--panel:oklch(0.995 0.002 255);--raise:oklch(0.95 0.005 255);--line:oklch(0.86 0.008 255);--line2:oklch(0.915 0.006 255);--grid:oklch(0.94 0.006 255);--fg:oklch(0.20 0.015 255);--mut:oklch(0.40 0.015 255);--dim:oklch(0.52 0.015 255);--acc:oklch(0.58 0.13 50);--acc-bg:oklch(0.58 0.13 50 / 0.11);--vio:oklch(0.52 0.17 290);--vio-bg:oklch(0.52 0.17 290 / 0.10);--grn:oklch(0.54 0.12 165);--grn-bg:oklch(0.54 0.12 165 / 0.11);--bad:oklch(0.54 0.18 25);--bad-bg:oklch(0.54 0.18 25 / 0.09);--warn:oklch(0.58 0.12 75);--warn-bg:oklch(0.58 0.12 75 / 0.10);--on-acc:oklch(0.99 0.002 255);--kw:oklch(0.50 0.17 290);--ty:oklch(0.52 0.11 65);--fn:oklch(0.47 0.13 250);--str:oklch(0.48 0.12 160);--num:oklch(0.54 0.13 45);--mac:oklch(0.48 0.10 200);--lt:oklch(0.50 0.15 340);--com:oklch(0.56 0.012 255);--inlay:oklch(0.50 0.012 255);--inlay-bg:oklch(0.935 0.005 255);--sel:oklch(0.58 0.13 50 / 0.06);--shadow:oklch(0.3 0.02 255 / 0.14);color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:oklch(0.975 0.003 255);--panel:oklch(0.995 0.002 255);--raise:oklch(0.95 0.005 255);--line:oklch(0.86 0.008 255);--line2:oklch(0.915 0.006 255);--grid:oklch(0.94 0.006 255);--fg:oklch(0.20 0.015 255);--mut:oklch(0.40 0.015 255);--dim:oklch(0.52 0.015 255);--acc:oklch(0.58 0.13 50);--acc-bg:oklch(0.58 0.13 50 / 0.11);--vio:oklch(0.52 0.17 290);--vio-bg:oklch(0.52 0.17 290 / 0.10);--grn:oklch(0.54 0.12 165);--grn-bg:oklch(0.54 0.12 165 / 0.11);--bad:oklch(0.54 0.18 25);--bad-bg:oklch(0.54 0.18 25 / 0.09);--warn:oklch(0.58 0.12 75);--warn-bg:oklch(0.58 0.12 75 / 0.10);--on-acc:oklch(0.99 0.002 255);--kw:oklch(0.50 0.17 290);--ty:oklch(0.52 0.11 65);--fn:oklch(0.47 0.13 250);--str:oklch(0.48 0.12 160);--num:oklch(0.54 0.13 45);--mac:oklch(0.48 0.10 200);--lt:oklch(0.50 0.15 340);--com:oklch(0.56 0.012 255);--inlay:oklch(0.50 0.012 255);--inlay-bg:oklch(0.935 0.005 255);--sel:oklch(0.58 0.13 50 / 0.06);--shadow:oklch(0.3 0.02 255 / 0.14);color-scheme:light}}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font-family:var(--mono);font-size:.92em;color:var(--fg)}
.m{font-family:var(--mono)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:52px;display:flex;align-items:center;gap:36px;padding:0 24px;border-bottom:1px solid var(--line2);background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo .mk{display:grid;grid-template-columns:repeat(2,5px);gap:2px}
.logo .mk span{width:5px;height:5px}
.logo b{font:500 13px var(--mono)}
.logo b i{font-style:normal;color:var(--dim)}
.nav{display:flex;align-items:center;gap:22px;font:500 12px var(--mono);overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:4px 0;white-space:nowrap}
.nav a.on{box-shadow:inset 0 -1px 0 currentColor}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:16px;flex:none}
.rd{font:500 11px var(--mono);color:var(--dim);letter-spacing:.12em}
.rd b{color:var(--fg);font-weight:500}
.thm{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:5px}
.thm span{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--mut);background:linear-gradient(90deg,var(--mut) 50%,transparent 50%)}
.av{width:30px;height:30px;border-radius:50%;border:1px solid var(--acc);display:grid;place-items:center;font:600 11px var(--mono);color:var(--acc)}
@media (max-width:900px){.hdr{gap:18px;padding:0 16px}.logo b i,.rd{display:none}}

/* ---------- page scaffolding ---------- */
.page{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;background-position:-1px -1px;padding-bottom:64px}
.wrap{padding-inline:64px}
@media (max-width:900px){.wrap{padding-inline:16px}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,580px);gap:56px;align-items:center;padding-block:72px 48px}
.hero.solo{grid-template-columns:minmax(0,1fr);padding-block:64px 40px}
@media (max-width:1180px){.hero{grid-template-columns:minmax(0,1fr);gap:36px;padding-block:44px 32px}}
.eyebrow{display:flex;flex-wrap:wrap;gap:14px;font:500 12px var(--mono);letter-spacing:.22em;color:var(--dim)}
.h1{margin:22px 0 0;font-size:clamp(42px,6vw,84px);line-height:.98;font-weight:800;letter-spacing:-.04em;text-wrap:balance}
.h1.md{font-size:clamp(38px,4.6vw,64px);line-height:1.02}
.lead{margin:28px 0 0;max-width:640px;font-size:18px;line-height:1.65;color:var(--mut);text-wrap:pretty}
.lead code{font:500 16px var(--mono)}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.btn{height:54px;padding:0 26px;display:inline-flex;align-items:center;gap:12px;border-radius:4px;border:1px solid var(--line);font-size:16px;font-weight:500;white-space:nowrap}
.btn.go{background:var(--grn);border-color:var(--grn);color:var(--on-acc);font-weight:700}
.btn.sm{height:38px;padding:0 16px;font-size:13.5px}
.btn .kb{font:500 11px var(--mono);opacity:.7}
.panel{position:relative;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.plabel{font:500 11px var(--mono);letter-spacing:.2em;color:var(--dim)}
.phead{display:flex;justify-content:space-between;gap:16px;padding:24px 28px 0}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.strip>div{padding:24px 30px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:8px;min-width:0}
.strip>div:last-child{border-right:0}
.strip .k{font:500 11px var(--mono);letter-spacing:.22em;color:var(--dim)}
.strip .v{font-size:24px;font-weight:700;letter-spacing:-.01em}
.strip .s{font-size:14px;color:var(--mut)}
@media (max-width:900px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div{padding:18px}.strip>div:nth-child(2){border-right:0}.strip>div:nth-child(-n+2){border-bottom:1px solid var(--line2)}}

.sec{padding-top:80px}
.sech{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.sech .t{font:500 12px var(--mono);letter-spacing:.26em;color:var(--dim);white-space:nowrap}
.sech .rule{flex:1;height:1px;background:var(--line2)}
.sech .c{font:400 12px var(--mono);color:var(--dim);text-align:right}
@media (max-width:700px){.sech .c{display:none}}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:1180px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g3,.g4,.g2{grid-template-columns:minmax(0,1fr)}}

/* ---------- cards ---------- */
.card{text-align:left;padding:28px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;gap:16px;min-width:0;width:100%}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.card.tall{min-height:330px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}
.card .ttl{font:600 15px var(--mono)}
.card .tag{font:600 10.5px var(--mono);letter-spacing:.2em;flex:none;white-space:nowrap}
.card .body{margin:0;font-size:14px;line-height:1.6;color:var(--mut);text-wrap:pretty}
.dia{flex:1;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font:500 10.5px var(--mono);color:var(--mut)}
.row{display:flex;align-items:center;gap:5px}
.bx{min-width:24px;height:20px;padding:0 4px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:3px;font:500 10.5px var(--mono);color:var(--mut)}
.bx.a{border-color:var(--acc);color:var(--acc)}
.bx.f{border-color:var(--acc);background:var(--acc);color:var(--on-acc)}
.bx.v{border-color:var(--vio);background:var(--vio-bg);color:var(--vio)}
.bx.g{border-color:var(--grn);background:var(--grn-bg);color:var(--grn)}
.bx.b{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.bx.d{border-style:dashed;color:var(--dim)}
.ar{color:var(--dim)}
.cap{font:400 10px var(--mono);color:var(--dim);margin-top:4px}
.dpg{display:grid;grid-template-columns:repeat(6,16px);gap:3px}
.dpg span{height:16px;border-radius:2px;border:1.5px solid var(--line)}
.phase{height:30px;display:flex;align-items:center;padding:0 12px;border-radius:3px;font:600 11px var(--mono);letter-spacing:.16em;white-space:nowrap;overflow:hidden}
.phase.done{background:var(--grn);color:var(--on-acc)}
.phase.cur{background:var(--acc);color:var(--on-acc)}
.phase.vio{background:var(--vio);color:var(--on-acc)}
.phase.ahead{border:1px solid var(--line);color:var(--dim)}
.phase.open{border:1px solid var(--grn);color:var(--grn)}
.segs{display:grid;gap:4px;margin-top:8px}
.segs span{height:4px}
.foot{margin-top:10px;font:400 11px var(--mono);color:var(--dim)}

/* ---------- chips, tables ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);font:500 11.5px var(--mono);color:var(--mut);white-space:nowrap}
.chip.on{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.tblw{border:1px solid var(--line2);border-radius:8px;background:var(--panel);overflow-x:auto}
.tbl{min-width:900px}
.tr{display:grid;gap:0 16px;align-items:center;min-height:60px;padding:8px 24px;border-bottom:1px solid var(--line2)}
.tbl>.tr:last-child{border-bottom:0}
a.tr:hover{background:var(--sel)}
.tr.th{min-height:42px;font:500 10.5px var(--mono);letter-spacing:.2em;color:var(--dim)}
.tr.cur{background:var(--sel)}
.st{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);display:inline-block}
.num{font:500 12px var(--mono);color:var(--dim)}
.pt{font-size:15px;font-weight:600;min-width:0}
.pt small{display:block;font:400 11.5px var(--mono);color:var(--dim);margin-top:3px}
.mode{display:inline-block;padding:3px 8px;border-radius:3px;border:1px solid;font:600 10px var(--mono);letter-spacing:.1em;white-space:nowrap}
.lvl{font:500 12px var(--mono);color:var(--mut)}
.tags{font:400 11.5px var(--mono);color:var(--dim);min-width:0}
.best{text-align:right;font:500 12px var(--mono)}
.empty{padding:28px 24px;color:var(--dim);font-size:14px}

/* ---------- readiness tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{min-height:172px;padding:18px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;width:100%}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.tile .n{font:600 12px/1.35 var(--mono)}
.tile .p{font-size:30px;font-weight:800;letter-spacing:-.03em}
.tile .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.tile .bar span{height:4px}
.tile .meta{margin-top:8px;font:400 10.5px var(--mono);color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}

/* ---------- tracks & bands ---------- */
.ttiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.bands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.bands span{display:block;font:500 9.5px var(--mono);letter-spacing:.1em;color:var(--dim);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bands i{display:block;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.bands b{display:block;height:100%;background:var(--grn)}
.tdetail{margin-top:20px;padding:28px;border:1px solid var(--acc);border-radius:8px;background:var(--panel);box-shadow:0 0 0 4px var(--acc-bg);scroll-margin-top:72px}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.dhead h3{margin:8px 0 0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.dpct{font-size:40px;font-weight:800;letter-spacing:-.03em;text-align:right;line-height:1}
.dpct small{display:block;margin-top:6px;font:400 12px var(--mono);color:var(--dim);letter-spacing:0}
.dprobe{margin:18px 0 0;max-width:760px;font-size:15px;line-height:1.6;color:var(--fg)}
.bandcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:24px}
@media (max-width:900px){.bandcols{grid-template-columns:minmax(0,1fr)}.tdetail{padding:18px}}
.bandcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.bandh{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line2);font:500 10.5px var(--mono);letter-spacing:.2em;color:var(--dim)}
.bandh span:first-child{color:var(--fg)}
.bandnone{padding:14px;border:1px dashed var(--line2);border-radius:6px;font-size:12.5px;color:var(--dim)}
.scard{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);text-align:left;width:100%}
.scard.sel{border-color:var(--acc)}
.scard .sn{display:flex;justify-content:space-between;gap:8px;font:600 13px var(--mono)}
.scard .phase{height:24px;font-size:10px;letter-spacing:.12em}

/* ---------- marquee ---------- */
.marq{margin-top:80px;height:64px;border-block:1px solid var(--line2);overflow:hidden;display:flex;align-items:center;background:var(--bg)}
.marq>div{display:flex;align-items:center;width:max-content;animation:marq 60s linear infinite;font:500 14px var(--mono);letter-spacing:.08em}
.marq span{padding:0 28px;white-space:nowrap}
.marq i{font-style:normal;color:var(--line)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.closing{padding-block:96px 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:40px}
.closing h2{margin:0;font-size:clamp(36px,4.4vw,60px);line-height:1.02;font-weight:800;letter-spacing:-.035em;max-width:900px;text-wrap:balance}
.closing p{margin:22px 0 0;font-size:18px;color:var(--mut)}
.closing .side{font:400 12px/1.8 var(--mono);color:var(--dim);text-align:right}

/* ---------- code ---------- */
.code{font:400 12.5px/20px var(--mono);color:var(--fg);padding-block:12px}
.ln{display:flex;min-height:20px}
.ln .g{width:48px;flex:none;text-align:right;padding-right:16px;color:var(--dim);user-select:none}
.ln .c{white-space:pre}
.k-kw{color:var(--kw)}.k-ty{color:var(--ty)}.k-fn{color:var(--fn)}.k-str{color:var(--str)}.k-num{color:var(--num)}.k-mac{color:var(--mac)}.k-lt{color:var(--lt)}.k-com{color:var(--com)}
.ih{color:var(--inlay);background:var(--inlay-bg);border-radius:3px;padding:1px 4px;font-size:11.5px}
.squig{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.lens{margin:4px 16px 8px 64px;padding:12px 16px;border:1px solid var(--bad);border-radius:6px;background:var(--bad-bg);display:flex;flex-direction:column;gap:8px;font:400 12px/1.4 var(--mono);white-space:normal;max-width:640px}
.lens .gr{display:grid;grid-template-columns:34px minmax(0,190px) minmax(0,1fr);gap:4px 10px;color:var(--mut)}
.lens small{display:flex;gap:18px;color:var(--dim);font-size:11px}
.snip{padding:12px 14px;background:var(--raise);border-radius:4px;font:400 12px/1.65 var(--mono);color:var(--fg);white-space:pre;overflow-x:auto}

/* ---------- workspace ---------- */
.subbar{height:44px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line2);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.crumb{display:flex;gap:8px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.vr{width:1px;height:18px;background:var(--line);flex:none}
.wtitle{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.pill{padding:2px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim);font:500 10.5px var(--mono);letter-spacing:.04em;white-space:nowrap}
.pill.solid{border-color:transparent;color:var(--on-acc)}
.sbr{margin-left:auto;display:flex;align-items:center;gap:18px;font:500 12px var(--mono);color:var(--mut);flex:none}
.clock{display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);border-radius:4px}
.clock small{color:var(--dim);font-size:10.5px;letter-spacing:.06em}
.ws{display:grid;grid-template-columns:340px minmax(0,1fr) 320px;height:calc(100vh - 96px);min-height:660px}
.ws.stage{grid-template-columns:270px minmax(0,1fr) 350px}

/* =====================================================================

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KW = 'as|async|await|break|const|continue|crate|dyn|else|enum|extern|fn|for|if|impl|in|let|loop|match|mod|move|mut|pub|ref|return|self|Self|static|struct|super|trait|type|unsafe|use|where|while|true|false';
const TOK = new RegExp(String.raw`(\/\/.*$)|("(?:[^"\\]|\\.)*")|('[a-z_]\w*\b(?!'))|(\b\d[\d_]*\b)|(\b[a-z_]\w*!)|(\b(?:${KW})\b)|(\b[A-Z]\w*\b)|(\b[a-z_]\w*(?=\())`, 'g');
const TCLS = ['com','str','lt','num','mac','kw','ty','fn'];
function hl(src){
  let out = '', i = 0, m; TOK.lastIndex = 0;
  while ((m = TOK.exec(src))) {
    out += esc(src.slice(i, m.index));
    const gi = m.slice(1).findIndex(x => x !== undefined);
    out += `<span class="k-${TCLS[gi]}">${esc(m[0])}</span>`;
    i = m.index + m[0].length;

  return out + esc(src.slice(i));
}
/* ⟦…⟧ marks a rust-analyzer inlay hint */
const hlLine = (line, ra) => line.split(/⟦(.*?)⟧/).map((p, j) => j % 2 ? (ra ? `<span class="ih">${esc(p)}</span>` : '') : hl(p)).join('');
function codeLines(src, {ra = true, start = 1, mark = {}} = {}) {
  return src.split('\n').map((l, i) => {
    const n = start + i, mk = mark[n] || {};

  }).join('');
}

/* ---------- shared bits ---------- */
const sech = (t, c = '') => `<div class="sech"><span class="t">${t}</span><span class="rule"></span><span class="c">${c}</span></div>`;

/* ---------- data ---------- */
/* ---------- curriculum: mirrors docs/CURRICULUM.md. Progress numbers are example data ---------- */

  D: {name: 'Data Structures & Algorithms', nav: 'dsa'},
  L: {name: 'Rust Language', nav: 'rust'},
  S: {name: 'Rust Standard Library', nav: 'rust'},

const BAND = {E: 'EASY', M: 'MEDIUM', H: 'HARD'};
const BW = {E: 1, M: 2, H: 3};

const UB = [['M', 'Understand it'], ['H', 'Build it']];
const calcPct = st => Math.round(100 * st.reduce((n, s) => n + s.solved * BW[s.band], 0) / st.reduce((n, s) => n + s.size * BW[s.band], 0));
function mk(code, name, total, solved, tier, bands, stages) {
  const st = stages.map(([band, sname, size]) => ({band, name: sname, size, rows: null}));

    <circle cx="${x(last)}" cy="${y(TREND[last][1])}" r="5" fill="var(--acc)" stroke="var(--panel)" stroke-width="2"/>
    <text x="${x(last) + 10}" y="${y(TREND[last][1]) + 4}" fill="var(--fg)" font-size="12" font-weight="600" font-family="var(--mono)">${OVERALL}%</text>
    <rect id="hit" x="${l}" y="${t}" width="${pw}" height="${ph}" fill="transparent"/>
  </svg>`;
}
function bindTrend() {
  const box = document.getElementById('trend'); if (!box) return;
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = svg.querySelector('#xh'), xd = svg.querySelector('#xd');
  const Wd = 520, l = 34, r = 44, t = 14, ph = 240 - 14 - 30, pw = Wd - l - r;
  svg.addEventListener('pointermove', e => {
    const rect = svg.getBoundingClientRect(), sx = (e.clientX - rect.left) / rect.width * Wd;
    const i = Math.max(0, Math.min(TREND.length - 1, Math.round((sx - l) / pw * (TREND.length - 1))));
    const px = l + i * pw / (TREND.length - 1), py = t + ph - TREND[i][1] / 100 * ph;
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    xd.setAttribute('cx', px); xd.setAttribute('cy', py); xd.setAttribute('visibility', 'visible');
    const b0 = box.getBoundingClientRect();
    tip.hidden = false; tip.innerHTML = `week of ${TREND[i][0]}<br><b>${TREND[i][1]}%</b> overall`;
    tip.style.left = (rect.left - b0.left + px / Wd * rect.width) + 'px'; tip.style.top = (rect.top - b0.top + py / 240 * rect.height - 8) + 'px';
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); });
}
function readinessDetail(t) {
  const sumW = t.stages.reduce((n, s) => n + s.size * BW[s.band], 0);
  const gains = t.code === 'C4'
    ? [['Blocking call inside an async fn', F, 'medium', 3], ['spawn vs spawn_blocking vs block_in_place', W, 'medium', 3], ['Cancel-safe select! loop', W, 'hard', 5]]
    : t.stages.filter(s => s.solved < s.size).slice(0, 3).map((s, i) => [`${s.name}: next ${Math.min(3, s.size - s.solved)} problems`, i % 2 ? F : W, BAND[s.band].toLowerCase(), Math.round(100 * BW[s.band] * Math.min(3, s.size - s.solved) / sumW)]);
  const weightText = t.tier === 'core' ? 'Core track: counts double in the overall score and sits on the SDE-2 path.' : t.tier === 'light' ? 'Light track: counts once. Rarely its own question, often a follow-up.' : 'SDE-3 track: counts once until the SDE-2 gate passes, then double.';
  return `<div class="g3" style="margin-top:20px">
    <div class="card"><div class="top"><span class="ttl">${t.code} · ${esc(t.name)}</span><span class="tag" style="color:${col(t.pct)}">${t.pct}%</span></div>
      <div class="stack" style="gap:12px">${t.stages.map(s => `<div><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)"><span>${esc(s.name)} <span class="m" style="font-size:10px;letter-spacing:.1em;color:var(--dim)">${BAND[s.band]}</span></span><span class="m" style="font-size:11.5px;color:var(--dim)">${s.solved} / ${s.size}</span></div>${segs(s.size, s.solved, col(t.pct))}</div>`).join('')}</div></div>
    <div class="card"><div class="top"><span class="ttl">Why it matters</span><span class="tag" style="color:var(--vio)">${TIER[t.tier]}</span></div>
      <p class="body" style="font-size:16px;color:var(--fg)">${esc(PROBE[t.code])}</p><p class="body">${weightText}</p></div>
    <div class="card"><div class="top"><span class="ttl">Fastest gains</span><span class="tag" style="color:var(--grn)">NEXT UP</span></div>
      <div class="stack" style="gap:0">${gains.length ? gains.map(([x, mo, lv, g]) => `<a href="#${SEC[t.sec].nav}" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line2)"><span style="font-size:14px;font-weight:600">${esc(x)}</span><span class="m" style="font-size:13px;color:var(--grn)">+${g}%</span><span style="display:flex;gap:8px;align-items:center">${modeTag(mo)}<span class="lvl" style="font-size:11px">${lv}</span></span></a>`).join('') : '<p class="body">Every problem in this track is solved. Keep up the re-solves.</p>'}</div></div>
  </div>`;
}
function scrReadiness() {
  const t = byCode[S.rd.track], c4 = byCode.C4;
  const groups = [['DSA', 'D', 'dsa'], ['RUST', 'LSCY', 'rust'], ['BUILD', 'BM', 'build']];
  const CAL = [['late', 3, 'bad'], ['today', 3, 'vio'], ['Mon 28', 2], ['Tue 29', 0], ['Wed 30', 4], ['Thu 1', 1], ['Fri 2', 2], ['Sat 3', 0], ['Sun 4', 3], ['Mon 5', 1], ['Tue 6', 0], ['Wed 7', 2], ['Thu 8', 1], ['Fri 9', 0], ['Sat 10', 2]];
  const due = [['Top K frequent elements', 'D1 Arrays & hashing', 'assisted · 1 hint', '3d → 7d', '2 days late', 'var(--bad)'], ['Group anagrams', 'D1 Arrays & hashing', 'assisted · early solution', '3d → 3d', '1 day late', 'var(--bad)'], ['Validate BST', 'D6 Trees & BSTs', 'retention check', '21d → 60d', '1 day late', 'var(--bad)'], ['Course schedule', 'D9 Graphs', 'assisted · 2 hints', '3d → 7d', 'today', 'var(--vio)'], ['Destructure self into field borrows', 'L2 Borrowing', 'assisted · 1 hint', '3d → 7d', 'today', 'var(--vio)'], ['Merge k sorted lists', 'D5 Linked lists', 'second re-solve', '7d → 21d', 'today', 'var(--vio)']];
  const dcols = 'minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 100px 110px';
  return `<main class="page"><div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow"><span style="color:var(--acc)">READINESS</span><span>/</span><span>${TRACKS.length} TRACKS</span><span>/</span><span>UPDATED AFTER EVERY RUN</span></div>
      <h1 class="h1">${OVERALL}% ready. <span style="color:var(--acc)">Async is the gap.</span></h1>
      <p class="lead">C4 Async &amp; Tokio sits at ${c4.pct}%, and nearly every backend Rust loop asks about it. Readiness is scored per track: a hard problem counts three times an easy one, assisted solves count half, overdue re-solves decay 10% a week, and core tracks count double in the overall score.</p>
      <div class="btns"><button class="btn go" data-act="rtrack" data-arg="C4!">Open C4 Async &amp; Tokio →</button><a class="btn" href="#home">Do today's re-solves · 6</a></div>
    </div>
    <div class="panel" id="trend">
      <div class="phead"><span class="plabel">OVERALL · LAST 10 WEEKS</span><span class="plabel" style="color:var(--acc)">+${OVERALL - TREND[0][1]} POINTS</span></div>
      <div class="chart">${trendSvg()}<div class="tip" hidden></div></div>
    </div>
  </section>
  <section class="strip">
    ${stat('DSA', secPct('D') + '%', `${secSum('D', 'solved')} of ${secSum('D', 'total')} solved`, col(secPct('D')))}
    ${stat('RUST', secPct('LSCY') + '%', `${secSum('LSCY', 'solved')} of ${secSum('LSCY', 'total')} solved`, col(secPct('LSCY')))}
    ${stat('BUILD', secPct('BM') + '%', 'backend + machine coding', col(secPct('BM')))}
    ${stat('DUE THIS WEEK', '15 re-solves', '3 of them already late', 'var(--vio)')}
  </section>
  ${groups.map(([name, letters]) => `<section class="sec">${sech(`${name} · ${secPct(letters)}%`, `${TRACKS.filter(x => letters.includes(x.sec)).length} tracks · ≥ 70 green · 40–69 copper · < 40 red`)}${trackTiles(letters, t.code, 'rdtrack')}${letters.includes(t.sec) ? readinessDetail(t) : ''}</section>`).join('')}
  <section class="sec">${sech('REVIEW QUEUE', 'next 14 days · re-solves keep readiness from decaying')}
    <div class="panel" style="padding:24px 24px 18px"><div class="cal">${CAL.map(([d, n, c]) => `<div class="d"><b>${n || ''}</b><span class="bb" style="height:${n / 4 * 100}px;background:${n ? (c ? `var(--${c})` : 'var(--acc)') : 'var(--line2)'}"></span><span style="${c ? `color:var(--${c})` : ''}">${d}</span></div>`).join('')}</div></div>
    <div class="tblw" style="margin-top:20px"><div class="tbl" style="min-width:820px"><div class="tr th" style="grid-template-columns:${dcols}"><span>DUE NOW</span><span>TRACK</span><span>WHY</span><span>INTERVAL</span><span style="text-align:right">DUE</span></div>
      ${due.map(([p, w, why, iv, d, c]) => `<a class="tr" href="#workspace" style="grid-template-columns:${dcols}"><span class="pt">${esc(p)}</span><span class="tags" style="color:var(--mut)">${w}</span><span class="tags">${why}</span><span class="m" style="font-size:12px;color:var(--mut)">${iv}</span><span class="best" style="color:${c}">${d}</span></a>`).join('')}
    </div></div>
  </section>
  </div></main>`;
}

/* ---------- review switcher ---------- */
const SCREENS = [['home', 'Today', 'new'], ['dsa', 'DSA section · 14 tracks', 'new'], ['rust', 'Rust section · 32 tracks', 'new'], ['build', 'Build section', 'new'], ['workspace', 'Workspace · hybrid 1a + 1c', 'new'], ['projects', 'Project · shortline', 'new'], ['stage', 'Project stage workspace', 'new'], ['library', 'Library', 'new'], ['mock', 'Mock interview', 'new'], ['readiness', 'Readiness', 'new']];
const OLD = [['WorkspaceSplit.dc.html', '1a · Workspace split'], ['WorkspaceBench.dc.html', '1b · Workspace bench'], ['WorkspaceTrace.dc.html', '1c · Workspace trace'], ['TrackGraphs.dc.html', '1d · Track · Graphs']];
let revOpen = false;
function renderRev() {
  document.getElementById('rev').innerHTML = `${revOpen ? `<div class="revlist" id="revlist"><span class="lab">NEW SCREENS</span>${SCREENS.map(([k, l]) => `<a href="#${k}" class="${S.route === k ? 'on' : ''}">${l}<small>${pad2(SCREENS.findIndex(x => x[0] === k) + 1)}</small></a>`).join('')}<span class="lab">ORIGINAL DESIGNS</span>${OLD.map(([f, l]) => `<a href="${f}">${l}<small>.dc</small></a>`).join('')}<p>Original designs load their runtime over http. Run ./serve.sh in this folder if they open blank.</p></div>` : ''}<button data-act="rev" aria-expanded="${revOpen}">Screens · ${pad2(Math.max(1, SCREENS.findIndex(x => x[0] === S.route) + 1))} / ${SCREENS.length}</button>`;
}

/* ---------- render + events ---------- */
const VIEWS = {home: scrHome, dsa: scrDSA, rust: scrRust, build: scrBuild, workspace: scrWorkspace, projects: scrProjects, stage: scrStage, library: scrLibrary, mock: scrMock, readiness: scrReadiness};
function render(resetScroll) {
  const y = window.scrollY, ae = document.activeElement, fid = ae && ae.id, sel = fid && ae.selectionStart;
  document.getElementById('app').innerHTML = header() + VIEWS[S.route]();
  renderRev();
  bindTrend();
  if (resetScroll) window.scrollTo(0, 0); else window.scrollTo(0, y);
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} } }
}
let runTimer;
const ACT = {
  theme() { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('anneal-theme', next); },
  rev() { revOpen = !revOpen; renderRev(); },
  rtrack(v) {
    const go = v.endsWith('!'), code = v.replace('!', ''), t = byCode[code];
    S.rust = {track: code, stage: firstOpen(t), tag: null};
    if (S.route !== 'rust') { location.hash = 'rust'; setTimeout(() => document.querySelector('.tdetail')?.scrollIntoView({behavior: 'smooth', block: 'start'}), 60); return; }
    render();
    if (go) document.querySelector('.tdetail')?.scrollIntoView({behavior: 'smooth', block: 'start'});
  },
  rstage(i) { S.rust.stage = +i; S.rust.tag = null; render(); },
  rtag(v) { S.rust.tag = v || null; render(); },
  btrack(v) { S.build = {track: v, stage: firstOpen(byCode[v]), tag: null}; render(); },
  bstage(i) { S.build.stage = +i; S.build.tag = null; render(); },
  btag(v) { S.build.tag = v || null; render(); },
  wtab(v) { S.ws.tab = v; render(); },
  wttab(v) { S.ws.ttab = v; render(); },
  wtog(k) { S.ws[k] = !S.ws[k]; if (k === 'ra' && !S.ws.ra) {} render(); },
  whint() { S.ws.hints = Math.min(3, S.ws.hints + 1); render(); },
  wfix() { S.ws.fixed = true; S.ws.tab = 'problem'; S.ws.ttab = 'tests'; render(); },
  wsol() { S.ws.sol = true; render(); },
  wsel(i) { S.ws.sel = S.ws.sel === +i ? -1 : +i; render(); },
  wreset() { Object.assign(S.ws, {fixed: false, hints: 1, sol: false, sel: -1}); render(); },
  wrun() { if (S.ws.running) return; S.ws.running = true; S.ws.ttab = 'tests'; render(); clearTimeout(runTimer); runTimer = setTimeout(() => { S.ws.running = false; render(); }, 1100); },
  pstage(i) { S.proj = +i; render(); },
  sleft(v) { S.stg.left = v; render(); },
  sttab(v) { S.stg.ttab = v; render(); },
  stog(k) { S.stg[k] = !S.stg[k]; render(); },
  ssel(i) { S.stg.sel = S.stg.sel === +i ? -1 : +i; render(); },
  scarry() { S.stg.carry = !S.stg.carry; render(); },
  srun() { if (S.stg.running) return; S.stg.running = true; render(); clearTimeout(runTimer); runTimer = setTimeout(() => { S.stg.running = false; render(); }, 1400); },
  lf(arg) { const [k, v] = arg.split(':'); S.lib[k] = S.lib[k] === v ? null : v; render(); },
  mstep(v) { S.mock.step = v; render(true); },
  mround(i) { if (!ROUNDS[+i].locked) { S.mock.round = +i; render(); } },
  mtalk(i) { S.mock.talk[+i] = !S.mock.talk[+i]; render(); },
  rdtrack(v) { S.rd.track = v; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  e.preventDefault();
  ACT[el.dataset.act]?.(el.dataset.arg);
});
document.addEventListener('input', e => { if (e.target.dataset.inp === 'libq') { S.lib.q = e.target.value; render(); } });
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { if (S.route === 'workspace') ACT.wrun(); if (S.route === 'stage') ACT.srun(); } });
function route() { const raw = location.hash.slice(1), h = ({tracks: 'dsa', concepts: 'rust'})[raw] || raw; S.route = ROUTES.includes(h) ? h : 'home'; revOpen = false; render(true); }
window.addEventListener('hashchange', route);
const saved = store.get('anneal-theme'); if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
route();
</script>
