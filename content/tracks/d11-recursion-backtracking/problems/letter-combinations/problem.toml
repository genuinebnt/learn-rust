slug = "letter-combinations"
title = "Letter combinations of a phone number"
mode = "write"
level = "easy"
stage = "first-backtracking"
order = 8
status = "ready"
tags = ["backtracking", "String", "Blind 75"]
companies = ["Meta", "Amazon", "Google", "Apple", "Microsoft", "Uber", "Bloomberg"]
teaches = [
  "One recursion level per digit, one branch per letter on that key.",
  "Build the answer in a single `String` with `push` and `pop`.",
]
constraints = ["0 ≤ digits.len() ≤ 8", "digits holds only '2' to '9'"]
follow_up = "Write it iteratively by extending a list of prefixes one digit at a time. Which uses less peak memory?"
related = ["S2"]

[[examples]]
input = "digits = \"23\""
output = "[\"ad\", \"ae\", \"af\", \"bd\", \"be\", \"bf\", \"cd\", \"ce\", \"cf\"]"

[[examples]]
input = "digits = \"\""
output = "[]"

[[hints]]
kind = "approach"
text = "Recurse over the digits. At each digit try every letter on its key, then move to the next digit."

[[hints]]
kind = "rust"
text = "A `const KEYS: [&str; 10]` indexed by `(d - b'0') as usize`; keep one `String` and `push`/`pop` a char per level."

[[hints]]
kind = "edge case"
text = "7 and 9 have four letters. An empty input gives `[]`, not `[\"\"]`."

[solution]
explanation = "The recursion has one level per digit and branches 3 or 4 ways, so it produces each string once and copies the buffer only at the leaves."
time = "O(4ⁿ · n)"
space = "O(n) besides the output"
