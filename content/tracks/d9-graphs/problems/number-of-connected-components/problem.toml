slug = "number-of-connected-components"
title = "Number of connected components"
mode = "write"
level = "medium"
stage = "union-find-mst"
order = 24
status = "ready"
tags = ["union-find", "Blind 75"]
teaches = [
  "Counting sets by counting successful unions.",
]
constraints = ["1 ≤ n ≤ 10⁶"]
follow_up = "Edges arrive as a stream and you must report the count after each. Does anything change?"

[[examples]]
input = "n = 5, edges = [(0,1), (1,2), (3,4)]"
output = "2"

[[hints]]
kind = "approach"
text = "Start with n components. Each union of two different sets removes one."

[solution]
explanation = "A successful union always merges two components into one, so the count falls by exactly one per merge."
time = "O((n + E) α(n))"
space = "O(n)"
