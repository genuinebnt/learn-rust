slug = "kth-largest-in-a-stream"
title = "Kth largest in a stream"
mode = "write"
level = "easy"
stage = "heap-basics"
order = 1
status = "ready"
tags = ["BinaryHeap", "Reverse", "min-heap"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Adobe"]
teaches = [
  "`BinaryHeap` is a max-heap; `BinaryHeap<Reverse<i32>>` turns it into a min-heap.",
  "Keep only the `k` largest values: the smallest of them, on top, is the answer.",
  "`Option<i32>` instead of a sentinel while fewer than `k` values have arrived.",
]
constraints = ["1 ≤ k ≤ 10⁵", "0 ≤ nums.len() ≤ 10⁵", "up to 10⁵ calls to add", "values are any i32"]
follow_up = "If `k` could change between calls, what would you keep instead of a single capped heap?"
related = ["S5", "D1"]

[[examples]]
input = "k = 3, nums = [4, 5, 8, 2]; add 3, 5, 10, 9, 4"
output = "Some(4), Some(5), Some(5), Some(8), Some(8)"

[[examples]]
input = "k = 3, nums = []; add 1, 2, 3"
output = "None, None, Some(1)"

[[hints]]
kind = "approach"
text = "You never need values below the k-th largest again. Keep just the k largest, and look at the smallest of those."

[[hints]]
kind = "rust"
text = "`BinaryHeap` pops the maximum. Wrap values in `std::cmp::Reverse` to get a min-heap; `peek()` gives the top without removing it."

[[hints]]
kind = "edge case"
text = "Until k values have arrived, the heap is short and the answer is `None`."

[solution]
explanation = "A min-heap capped at k holds the k largest values seen; its top is the k-th largest. Each `add` pushes, pops once if the heap grew past k, and peeks. `Reverse<T>` flips `Ord`, so `BinaryHeap<Reverse<i32>>` is the min-heap std doesn't ship separately."
time = "O(log k) per add, O(n log k) for new"
space = "O(k)"
