slug = "kth-smallest-pair-distance"
title = "K-th smallest pair distance"
mode = "write"
level = "hard"
stage = "hard-searches"
order = 13
status = "ready"
tags = ["search on the answer", "two pointers"]
companies = ["Amazon", "Google"]
teaches = [
  "Counting instead of listing.",
  "`abs_diff` on signed integers.",
]
constraints = ["2 ≤ nums.len() ≤ 10⁵", "1 ≤ k ≤ n·(n − 1)/2"]
follow_up = "How would a heap-based approach compare for small k?"

[[hints]]
kind = "approach"
text = "Binary search the distance `d`: count the pairs with distance ≤ d; the answer is the smallest d with count ≥ k."

[[hints]]
kind = "approach"
text = "After sorting, pairs within distance d of each right end form a window; slide it in O(n)."

[[hints]]
kind = "rust"
text = "`a.abs_diff(b)` returns `u32` and can't overflow, even for `i32::MIN` and `i32::MAX`."

[solution]
explanation = "There are O(n²) pairs, but counting those within d takes O(n) on sorted data, so the whole search is O(n log n + n log W)."
time = "O(n log n + n log W)"
space = "O(n)"
