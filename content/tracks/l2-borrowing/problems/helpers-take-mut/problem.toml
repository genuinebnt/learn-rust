[[hints]]
kind = "rust"
text = "Passing `a` (a `&mut String`) to `normalize(s: &mut String)` reborrows it, so `a` is usable afterwards."

[solution]
explanation = "Each call reborrows `a` for just the call, which is why `a == b` still works."
