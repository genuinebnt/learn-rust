slug = "car-pooling"
title = "Car pooling"
mode = "write"
level = "medium"
stage = "intervals"
order = 13
status = "ready"
tags = ["sweep line", "sorting"]
companies = ["Amazon", "Google"]
teaches = [
  "Turn intervals into `(position, change)` events and sort them.",
  "Sorting tuples puts drop-offs (negative change) before pick-ups at the same stop.",
]
constraints = ["0 ≤ trips.len() ≤ 10⁵", "1 ≤ passengers ≤ 1000", "0 ≤ from < to ≤ 2·10⁹", "0 ≤ capacity ≤ 10⁹"]
follow_up = "If stops were at most 1000, how would a difference array make this O(n + 1000)?"
related = ["D1", "S3"]

[[examples]]
input = "trips = [(2, 1, 5), (3, 3, 7)], capacity = 4"
output = "false"

[[examples]]
input = "trips = [(2, 1, 5), (3, 3, 7)], capacity = 5"
output = "true"

[[hints]]
kind = "approach"
text = "Only the load at each stop matters. Make an event `(from, +people)` and `(to, -people)` for each trip, sort them, and keep a running total."

[[hints]]
kind = "rust"
text = "A `Vec<(u32, i64)>` sorts by stop, then by change, so at the same stop the drop-offs (negative) come first for free."

[[hints]]
kind = "edge case"
text = "Stops go up to 2·10⁹, so a difference array indexed by stop would be too big here; sort the events instead."

[solution]
explanation = "The load only changes at pick-ups and drop-offs. Sorting the 2n events and summing them checks the load at every stop."
time = "O(n log n)"
space = "O(n)"
