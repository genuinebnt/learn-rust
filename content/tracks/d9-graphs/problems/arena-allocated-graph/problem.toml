[solution]
explanation = "The arena owns everything, ids are `Copy`, and cycles cost nothing: no `Rc`, no `RefCell`, no leaks. `value_mut` borrows the graph only for one call, so editing a node while holding ids is fine."
time = "O(1) per operation · O(V + E) for reachable"
space = "O(V + E)"
