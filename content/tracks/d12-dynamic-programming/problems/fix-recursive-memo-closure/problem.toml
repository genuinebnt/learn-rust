slug = "fix-recursive-memo-closure"
title = "Fix: recursive memo closure"
mode = "fix"
level = "medium"
stage = "dp-the-rust-way"
order = 55
status = "ready"
tags = ["E0500", "HashMap", "borrowck"]
teaches = [
  "Why `entry(..).or_insert_with(|| recurse(memo))` can't compile: the entry holds `memo` while the closure needs it too.",
  "Look up, compute, then insert: three short borrows instead of one long one.",
]
constraints = ["0 ≤ n ≤ 73 (the answer for 73 is the largest that fits in u64)"]
follow_up = "Could `or_insert_with` work if the memo were a `RefCell<HashMap>` behind `&`? What would happen at run time?"
related = ["L2", "L6"]

[[hints]]
kind = "rust"
text = "`memo.entry(n)` borrows `memo` mutably until the statement ends, and the closure inside needs `memo` mutably too for the recursive calls. Two live `&mut` to one map can't coexist."

[[hints]]
kind = "rust"
text = "Split it: `if let Some(&known) = memo.get(&n) { return known; }`, then compute with the recursive calls, then `memo.insert(n, ways)`. Each borrow ends before the next begins."

[solution]
explanation = "The entry API is ideal when computing the value doesn't touch the map. When it does (any recursive memo), look up and insert separately; the extra hash is the price of letting the recursion use the map in between."
time = "O(n)"
space = "O(n)"

[rules]
forbid_methods = ["clone"]
max_changed_lines = 6
