[[examples]]
input = "words = [\"wrt\", \"wrf\", \"er\", \"ett\", \"rftt\"]"
output = "Some(\"wertf\")"

[[examples]]
input = "words = [\"abc\", \"ab\"]"
output = "None"

[[hints]]
kind = "approach"
text = "Only adjacent words give information: their first differing letter says which letter comes first."

[[hints]]
kind = "edge case"
text = "If no letter differs and the first word is longer, the input is invalid."

[[hints]]
kind = "rust"
text = "`BTreeSet::pop_first` gives the smallest ready letter."

[solution]
explanation = "Each adjacent pair adds at most one edge; a 26×26 bool matrix drops duplicates. Topological sort with the smallest ready letter makes the answer unique."
time = "O(total letters + 26²)"
space = "O(26²)"
