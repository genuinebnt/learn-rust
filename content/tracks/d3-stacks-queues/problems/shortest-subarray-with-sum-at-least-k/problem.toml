slug = "shortest-subarray-with-sum-at-least-k"
title = "Shortest subarray with sum at least K"
mode = "write"
level = "hard"
stage = "hard-stacks"
order = 14
status = "ready"
tags = ["prefix sums", "monotonic deque"]
teaches = [
  "Prefix sums + a monotonic deque.",
  "`VecDeque` as a double-ended work list.",
]
follow_up = "Why does the two-pointer sliding window fail with negative numbers?"
related = ["D2", "S5"]

[[hints]]
kind = "approach"
text = "A subarray sum is `prefix[j] - prefix[i]`. For each end `j`, you want the latest start `i` with `prefix[i] ≤ prefix[j] - k`."

[[hints]]
kind = "approach"
text = "Keep candidate starts in a deque with increasing prefix sums. A start with a larger prefix than a later one is never useful."

[[hints]]
kind = "rust"
text = "Pop from the front while the window qualifies (record the length), and from the back while the new prefix is smaller."

[solution]
explanation = "Each index enters and leaves the deque once. Popping a start from the front after using it is safe, because any later end would only give a longer subarray."
time = "O(n)"
space = "O(n)"
