slug = "my-option-borrowing"
title = "MyOption: borrowing and in-place methods"
mode = "write"
level = "hard"
stage = "build-it"
order = 16
status = "ready"
tags = ["enum", "borrowing", "impl blocks"]
teaches = [
  "`as_ref` / `as_mut` turn `&MyOption<T>` into `MyOption<&T>` by matching on a reference.",
  "`get_or_insert_with` must fill the slot first and borrow second, or the borrow checker objects.",
  "`flatten` and `copied` exist only for some `T`, so they live in `impl` blocks for `MyOption<MyOption<T>>` and `MyOption<&T>`.",
]
follow_up = "Why does std's `get_or_insert_with` use `unreachable_unchecked` (or an equivalent) for the `None` arm, and is `unreachable!()` good enough here?"
related = ["L2", "L6"]

[[hints]]
kind = "rust"
text = "Matching on `&self` binds `v` as `&T` (match ergonomics), so `as_ref` is the same two-arm `match` as `map`."

[[hints]]
kind = "rust"
text = "In `get_or_insert_with`, first write `*self = MyOption::Some(f())` if it's `None`, then `match self` and return the `&mut` from the `Some` arm."

[[hints]]
kind = "edge case"
text = "`insert` always overwrites; only `get_or_insert_with` keeps an existing value. `inspect` hands the closure a reference and returns `self` unchanged."

[solution]
explanation = "`as_ref` and `as_mut` are why most combinators can take `self` by value: borrow first, then consume the borrowed option. `get_or_insert_with` fills the slot before borrowing it, because returning a borrow from one arm while assigning in the other is a case today's borrow checker rejects. API reminder: `insert(v)` overwrites, `get_or_insert(v)` / `get_or_insert_with(f)` keep what's there; `copied()` / `cloned()` turn `Option<&T>` into `Option<T>`; `flatten()` removes one level of `Option<Option<T>>`; `inspect(|v| log(v))` peeks without consuming (`Result` has `inspect` and `inspect_err`)."
time = "O(1) each"
space = "O(1)"
