intuition = """
A circular queue is a fixed array used as a ring. Keep a `head` index (the front), a `size` (how many items), and compute the rear as `(head + size - 1) % capacity`. Enqueue writes at `(head + size) % capacity` and grows `size`; dequeue moves `head` forward by one (`% capacity`) and shrinks `size`.

Tracking `size` explicitly avoids the classic "is it empty or full?" confusion that appears when you only track head and tail: with both indexes equal, the queue could be either.

A linked list with a `head`, `tail` and a count works the same way, but it needs nodes.
"""
tips = [
    "Keep a `size` counter so `isEmpty` is `size == 0` and `isFull` is `size == capacity`. No wasted slot needed.",
    "The modulo wraps both the write position and the head, so the buffer is reused as items are removed.",
    "`Front` and `Rear` return `-1` on an empty queue, and `enQueue`/`deQueue` return a boolean for success.",
    "Rear is `(head + size - 1) % capacity`: the last stored item, not the next free slot.",
]

[[approaches]]
name = "Array with head index and size"
label = "ring buffer"
idea = "Store items in a fixed array; the front is at head, the next free slot is head + size, both modulo capacity."
time = "O(1) per operation"
space = "O(k)"
note = "k is the capacity."
code = '''class MyCircularQueue:

    def __init__(self, k: int):
        self.items = [0] * k
        self.capacity = k
        self.head = 0
        self.size = 0

    def enQueue(self, value: int) -> bool:
        if self.isFull():
            return False
        self.items[(self.head + self.size) % self.capacity] = value
        self.size += 1
        return True

    def deQueue(self) -> bool:
        if self.isEmpty():
            return False
        self.head = (self.head + 1) % self.capacity
        self.size -= 1
        return True

    def Front(self) -> int:
        return -1 if self.isEmpty() else self.items[self.head]

    def Rear(self) -> int:
        return -1 if self.isEmpty() else self.items[(self.head + self.size - 1) % self.capacity]

    def isEmpty(self) -> bool:
        return self.size == 0

    def isFull(self) -> bool:
        return self.size == self.capacity
'''

[[approaches]]
name = "Singly linked list with head, tail and count"
label = "linked list"
idea = "Append at the tail, remove from the head, and refuse new items once the count reaches the capacity."
time = "O(1) per operation"
space = "O(k)"
note = "Not a real ring, but the same behaviour from outside."
code = '''class MyCircularQueue:

    class Link:
        def __init__(self, value: int):
            self.value = value
            self.next = None

    def __init__(self, k: int):
        self.capacity = k
        self.count = 0
        self.head = None
        self.tail = None

    def enQueue(self, value: int) -> bool:
        if self.isFull():
            return False
        link = self.Link(value)
        if self.tail:
            self.tail.next = link
        else:
            self.head = link
        self.tail = link
        self.count += 1
        return True

    def deQueue(self) -> bool:
        if self.isEmpty():
            return False
        self.head = self.head.next
        if self.head is None:
            self.tail = None
        self.count -= 1
        return True

    def Front(self) -> int:
        return -1 if self.isEmpty() else self.head.value

    def Rear(self) -> int:
        return -1 if self.isEmpty() else self.tail.value

    def isEmpty(self) -> bool:
        return self.count == 0

    def isFull(self) -> bool:
        return self.count == self.capacity
'''
