slug = "island-perimeter"
title = "Island perimeter"
mode = "write"
level = "easy"
stage = "traversal"
order = 8
status = "ready"
tags = ["grid", "counting"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "Count what you need instead of searching.",
  "Each shared edge removes two sides.",
]
constraints = ["1 ≤ rows, cols ≤ 500"]
follow_up = "How would you return the perimeter of each island separately?"

[[examples]]
input = "grid = [[0,1,0,0],[1,1,1,0],[0,1,0,0],[1,1,0,0]]"
output = "16"

[[hints]]
kind = "approach"
text = "Every land cell has 4 sides. Which of them are not part of the perimeter?"

[[hints]]
kind = "approach"
text = "Two land cells side by side hide one side each. Count each shared side once, from the cell below or to the right, and subtract 2."

[[hints]]
kind = "edge case"
text = "The edge of the map counts as water."

[solution]
explanation = "No search needed: 4 per land cell, minus 2 per pair of adjacent land cells. Lakes inside the island count too, since their shores face water."
time = "O(rows · cols)"
space = "O(1)"
