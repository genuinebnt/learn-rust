slug = "trapping-rain-water"
title = "Trapping rain water"
mode = "write"
level = "hard"
stage = "hard-windows"
order = 16
status = "ready"
tags = ["two pointers"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Bloomberg", "Goldman Sachs", "Uber"]
teaches = [
  "Water at a position is bounded by the lower of the tallest walls on each side.",
  "Two pointers carry both running maxima.",
]
constraints = ["0 ≤ heights.len() ≤ 2·10⁵"]
follow_up = "How would you solve it with a monotonic stack, and what does that version compute differently?"
related = ["D3"]

[[examples]]
input = "heights = [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]"
output = "6"

[[hints]]
kind = "approach"
text = "Water above bar i = min(tallest to the left, tallest to the right) − height[i]."

[[hints]]
kind = "approach"
text = "Process whichever side has the lower wall: its bound is already known."

[solution]
explanation = "When the left bar is lower, the right side is guaranteed to have a wall at least that tall, so `left_max` alone bounds the water."
time = "O(n)"
space = "O(1)"
