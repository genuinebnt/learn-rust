slug = "two-sum"
title = "Two sum"
mode = "write"
level = "easy"
stage = "vec-and-slices"
order = 3
status = "ready"
tags = ["HashMap", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Adobe", "Bloomberg", "Uber"]
teaches = [
  "One pass with a `HashMap` from value to index.",
  "`Option<(usize, usize)>` instead of a `[-1, -1]` sentinel.",
]
constraints = ["2 ≤ nums.len() ≤ 10⁵", "|nums[i]|, |target| ≤ 10⁹"]
follow_up = "If the input were sorted, how would you do it in O(1) extra space?"
related = ["S4", "S1"]

[[examples]]
input = "nums = [2, 7, 11, 15], target = 9"
output = "Some((0, 1))"

[[hints]]
kind = "approach"
text = "For each number, the partner you need is `target - x`. Have you seen it already?"

[[hints]]
kind = "rust"
text = "Store value → index in a `HashMap<i32, usize>` and check before inserting, so an element never pairs with itself."

[solution]
explanation = "Checking before inserting handles `[3, 3]` and never pairs an element with itself. Returning `Option` keeps the no-answer case in the type."
time = "O(n)"
space = "O(n)"
