[[hints]]
kind = "rust"
text = "`next: Rc`, `prev: Weak`: ownership runs one way, so dropping the head frees the chain and there's no reference cycle."

[[hints]]
kind = "rust"
text = "When a node is popped, clear every other strong reference first (`head`/`tail`/the neighbour's `next`), then `Rc::try_unwrap` it to get the value out."

[[hints]]
kind = "edge case"
text = "A one-element deque has `head` and `tail` pointing at the same node; both must be cleared."

[solution]
explanation = "Every operation is O(1), but it costs a refcount, a RefCell flag and a heap allocation per node. `impl Drop` pops iteratively; the default drop would recurse through a million `next` links and overflow the stack."
time = "O(1) per op"
space = "O(n)"
