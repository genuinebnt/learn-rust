[[hints]]
kind = "approach"
text = "`?` on `Err(e)` returns `Err(From::from(e))` from the whole function."

[[hints]]
kind = "rust"
text = "Inside `macro_rules!`, `return` returns from the function the macro is used in. Name the enum as `$crate::MyResult` so it resolves anywhere."

[solution]
explanation = "The `From::from` call is what lets `?` convert a library error into your application's error type."
time = "O(1)"
