intuition = """
Insert into a BST adds a leaf. **Deleting** has three cases once you've found the node by comparing keys:

1. **No left child:** replace the node with its right child.
2. **No right child:** replace it with its left child.
3. **Two children:** copy the value of its **in-order successor** (the smallest node in the right subtree) into this node, then delete that successor from the right subtree.

Return the new root of each subtree and reassign it as the parent's child. That is how a removed node disappears.
"""
tips = [
    "Always write `root.left = delete(root.left, key)`. The assignment is what removes the node.",
    "The in-order successor has no left child, so deleting it falls into the easy cases.",
    "If the key isn't in the tree, nothing changes and the same root is returned.",
]

[[approaches]]
name = "Recursive delete with the in-order successor"
label = "bst"
idea = "Find the node; replace it with its only child, or with the smallest value of its right subtree."
time = "O(h)"
space = "O(h)"
time_why = "Finding the node walks one path down the tree, and finding the successor walks another, so at most about twice the height."
space_why = "The recursion goes as deep as the tree is tall."
note = "h is the height of the tree."
code = '''class Solution:
    def deleteNode(self, root: TreeNode | None, key: int) -> TreeNode | None:
        if root is None:
            return None
        if key < root.val:
            root.left = self.deleteNode(root.left, key)
        elif key > root.val:
            root.right = self.deleteNode(root.right, key)
        else:
            if root.left is None:
                return root.right
            if root.right is None:
                return root.left
            heir = root.right
            while heir.left:
                heir = heir.left
            root.val = heir.val
            root.right = self.deleteNode(root.right, heir.val)
        return root
'''
