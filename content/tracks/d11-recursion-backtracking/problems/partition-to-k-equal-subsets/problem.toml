slug = "partition-to-k-equal-subsets"
title = "Partition to K equal sum subsets"
mode = "write"
level = "hard"
stage = "constraints-pruning"
order = 26
status = "ready"
tags = ["backtracking", "bitmask", "memoization"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "LinkedIn"]
teaches = [
  "Fill one bucket at a time: the set of used numbers then fixes everything else, so it can be memoised as a bitmask.",
  "Two cheaper cuts on top: an empty bucket always takes the largest unused number, and equal numbers are tried once per spot.",
]
constraints = ["1 ≤ k ≤ nums.len() ≤ 20", "1 ≤ nums[i] ≤ 10⁴"]
follow_up = "Matchsticks to square is the case k = 4. Would this memo help there, and what does it cost in memory for n = 20?"
related = ["D12"]

[[examples]]
input = "nums = [4, 3, 2, 3, 5, 2, 1], k = 4"
output = "true ([5], [1, 4], [2, 3], [2, 3])"

[[examples]]
input = "nums = [1, 2, 3, 4], k = 3"
output = "false"

[[hints]]
kind = "approach"
text = "Fill the groups one at a time, each up to total / k, and move to the next group when one is full. The set of numbers used so far determines the rest of the state, so remember the sets that failed."

[[hints]]
kind = "rust"
text = "Keep the used set in a `u32` bitmask and the failures in `vec![false; 1 << n]`. The open group's sum is `(open + nums[i]) % target` after adding `nums[i]`."

[[hints]]
kind = "edge case"
text = "Sort descending, skip a number equal to one that just failed in the same spot, and when a group is empty put the largest unused number in it rather than trying every number there."

[solution]
explanation = "Filling groups in order makes the used-set bitmask a complete description of the search state: the full groups are interchangeable, and the open group's sum is the used sum modulo the target. So there are at most 2ⁿ states, each expanded once thanks to `dead`, which bounds the search at O(n · 2ⁿ). The duplicate skip and the empty-group rule cut the constant: without them, [2; 17] + [1, 1] with k = 4 rebuilds the same groups from different copies of 2 hundreds of millions of times."
time = "O(n · 2ⁿ)"
space = "O(2ⁿ) for the memo"
