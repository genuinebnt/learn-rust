intuition = """
Two players take a pile from either end of a row, each playing perfectly, and the one with more stones wins. This is a minimax over an interval: let `dp[i][j]` be how many more stones the player to move can collect than the opponent from `piles[i..j]`. They take the left pile or the right pile, and then the opponent is the one to move on the rest: `dp[i][j] = max(piles[i] - dp[i + 1][j], piles[j] - dp[i][j - 1])`. Alice wins when `dp[0][n - 1] > 0`.

There is also a trick: with an even number of piles and an odd total, the first player can always take all the even-indexed piles or all the odd-indexed ones, so Alice **always** wins.
"""
tips = [
    "Track the difference between the two players, not two separate totals.",
    "After your move it is the opponent's turn, so you subtract their best lead on what remains.",
    "The constraints (an even number of piles, an odd total so no ties) make `return True` correct. Mention it after showing the DP.",
]

[[approaches]]
name = "Interval DP on the score difference"
label = "dp"
idea = "dp[i][j] is the mover's best lead on piles[i..j]; take either end and subtract the opponent's lead."
time = "O(n^2)"
space = "O(n^2)"
time_why = "The table has n × n cells and each is filled in constant time from two smaller ones."
space_why = "The table has a cell for every interval."
note = "Fill by increasing interval length."
code = '''class Solution:
    def stoneGame(self, piles: list[int]) -> bool:
        n = len(piles)
        dp = [[0] * n for _ in range(n)]
        for i in range(n):
            dp[i][i] = piles[i]
        for length in range(2, n + 1):
            for i in range(n - length + 1):
                j = i + length - 1
                dp[i][j] = max(piles[i] - dp[i + 1][j], piles[j] - dp[i][j - 1])
        return dp[0][n - 1] > 0
'''

[[approaches]]
name = "Alice always wins"
label = "math"
idea = "With an even number of piles and no ties, the first player can secure either all the even-indexed or all the odd-indexed piles, whichever total is larger."
time = "O(1)"
space = "O(1)"
time_why = "The answer follows from the rules, so no loop is needed."
space_why = "Nothing is stored."
note = "Only valid under the stated constraints."
code = '''class Solution:
    def stoneGame(self, piles: list[int]) -> bool:
        return True
