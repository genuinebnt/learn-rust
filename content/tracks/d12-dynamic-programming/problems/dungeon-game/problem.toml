slug = "dungeon-game"
title = "Dungeon game"
mode = "write"
level = "hard"
stage = "2d-grids"
order = 23
status = "ready"
tags = ["2-D DP", "backwards DP"]
companies = ["Google", "Amazon", "Microsoft", "Meta"]
teaches = [
  "Solving from the goal backwards when the constraint (health never below 1) depends on the future, not the past.",
  "Clamping with `.max(1)` at every step.",
]
constraints = ["1 ≤ m, n ≤ 500", "-1000 ≤ dungeon[i][j] ≤ 1000"]
follow_up = "Why doesn't a forward DP work here? Give a small grid where it fails."
related = ["D4"]

[[examples]]
input = "dungeon = [[-2, -3, 3], [-5, -10, 1], [10, 30, -5]]"
output = "7 (right, right, down, down)"

[[hints]]
kind = "approach"
text = "Work backwards: need(i, j) = max(1, min(need(i + 1, j), need(i, j + 1)) - dungeon[i][j]). The princess's room needs 1 after its effect."

[[hints]]
kind = "rust"
text = "A rolling `Vec<i64>` of width n + 1 filled with `i64::MAX`, with the slot below the princess set to 1, avoids edge cases; walk rows and columns in reverse."

[[hints]]
kind = "edge case"
text = "Going forwards and keeping the path with the biggest total fails: a path can end rich but dip too low on the way. Health must also never be required below 1."

[solution]
explanation = "Forwards, a cell would need two numbers (current health and the lowest point) and neither dominates. Backwards, one number suffices: the least health on entry. The `.max(1)` says that a big heal later can't pay for dying now."
time = "O(m × n)"
space = "O(n)"
