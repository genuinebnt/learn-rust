slug = "maximal-square"
title = "Maximal square"
mode = "write"
level = "medium"
stage = "2d-grids"
order = 22
status = "ready"
tags = ["2-D DP", "rolling row"]
companies = ["Google", "Amazon", "Meta", "Apple", "Microsoft", "Bloomberg"]
teaches = [
  "A square ending at (i, j) is limited by the smallest square above, to the left and diagonally up-left.",
  "Keeping the up-left value in a variable while updating one row in place.",
]
constraints = ["0 ≤ rows, columns ≤ 1000", "every row has the same length and holds only '0' and '1'"]
follow_up = "How would you find the largest rectangle of 1s instead? (Histogram + monotonic stack per row.)"
related = ["D3"]

[[examples]]
input = "matrix = [\"10100\", \"10111\", \"11111\", \"10010\"]"
output = "4 (a 2 × 2 square)"

[[hints]]
kind = "approach"
text = "side(i, j) = 1 + min(side(i - 1, j), side(i, j - 1), side(i - 1, j - 1)) when the cell is '1', else 0. The answer is the largest side, squared."

[[hints]]
kind = "rust"
text = "Compare `row.as_bytes()[j]` with `b'1'`. In one rolling row, save the old `side[j + 1]` before overwriting it: it is the next cell's up-left."

[[hints]]
kind = "edge case"
text = "The question asks for the area, not the side. A missing diagonal cell must shrink the square: [\"111\", \"101\", \"111\"] → 1."

[solution]
explanation = "A square with corner (i, j) of side k needs squares of side k - 1 ending above, to the left and up-left, so the smallest of the three limits it. The row is updated in place with one saved value for the diagonal."
time = "O(m × n)"
space = "O(n)"
