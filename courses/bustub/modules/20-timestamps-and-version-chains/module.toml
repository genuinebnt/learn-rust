code = "4a"
title = "Timestamps, transactions and version chains"
summary = "Multi-version concurrency control from the ground up: the watermark, transactions with read and commit timestamps, and the undo logs that let a reader rebuild an older version of a tuple. The module ends with a sequential scan that reads a consistent snapshot. BusTub Project 4, tasks 1 to 3."
lectures = ["multiversioning", "timestampordering", "concurrencycontrol"]
bustub = ["src/include/concurrency/transaction.h", "src/include/concurrency/transaction_manager.h", "src/include/concurrency/watermark.h", "src/concurrency/watermark.cpp", "src/concurrency/transaction_manager.cpp", "src/concurrency/transaction_manager_impl.cpp", "src/include/execution/execution_common.h", "src/execution/execution_common.cpp", "src/execution/seq_scan_executor.cpp", "test/txn/txn_timestamp_test.cpp", "test/txn/txn_scan_test.cpp"]
