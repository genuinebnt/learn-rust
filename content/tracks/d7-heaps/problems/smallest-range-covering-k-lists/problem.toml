slug = "smallest-range-covering-k-lists"
title = "Smallest range covering elements from K lists"
mode = "write"
level = "hard"
stage = "two-heaps-merges"
order = 11
status = "ready"
tags = ["BinaryHeap", "k-way merge", "i64"]
companies = ["Google", "Amazon", "Microsoft", "Uber"]
teaches = [
  "Merge the lists with a heap of their current heads while tracking the largest head: the heads always form a candidate range.",
  "Advancing the list with the smallest head is the only move that can shrink the range.",
  "Range widths in `i64`: `i32::MAX - i32::MIN` overflows `i32`.",
]
constraints = ["0 ≤ lists.len() ≤ 2·10⁴", "total length N ≤ 2·10⁵", "values are any i32"]
follow_up = "How would you solve it with a sliding window over all values sorted together, and when would you prefer that?"
related = ["D2", "D5", "S5"]

[[examples]]
input = "lists = [[4, 10, 15, 24, 26], [0, 9, 12, 20], [5, 18, 22, 30]]"
output = "Some((20, 24))"

[[examples]]
input = "lists = [[1, 2, 3], [1, 2, 3], [1, 2, 3]]"
output = "Some((1, 1))"

[[hints]]
kind = "approach"
text = "Take one element from each list: the range from their minimum to their maximum covers every list. To shrink it, you can only advance the list holding the minimum."

[[hints]]
kind = "rust"
text = "A min-heap of `Reverse((value, list, index))` gives the minimum head; keep the maximum head in a plain variable, since it only grows."

[[hints]]
kind = "edge case"
text = "Stop as soon as the list with the minimum head runs out. Compare widths as `i64`, and keep the first range on ties."

[solution]
explanation = "The current heads always cover all k lists, so `[min head, max head]` is a candidate. Any better range must drop the current minimum, so pop it and push the next element from the same list; the maximum can only grow, so one variable tracks it. When a list is exhausted no later candidate can cover it. Each of the N elements enters the heap once."
time = "O(N log k)"
space = "O(k)"
