slug = "trie-with-counts-and-erase"
title = "Trie with counts and erase"
mode = "write"
level = "medium"
stage = "tries-at-work"
order = 10
status = "ready"
tags = ["trie", "counting"]
teaches = [
  "Counts in the nodes answer 'how many' queries in one walk.",
  "Check before you mutate: erasing a word that isn't there must change nothing.",
]
constraints = ["words: 1–100 lowercase letters (the empty word and prefix are allowed)", "up to 2·10⁵ calls"]
follow_up = "How would you return the k most frequent stored words with a given prefix?"
related = ["S4"]

[[examples]]
input = "insert apple twice; count equal apple; count starting app; erase apple; count equal apple"
output = "2, 2, true, 1"

[[hints]]
kind = "approach"
text = "Give each node two counters: how many stored copies pass through it, and how many end at it. Every query is one walk."

[[hints]]
kind = "rust"
text = "Walk once with `&self` to check the word is stored before taking `&mut self.root`; that keeps `erase` from half-updating a path."

[[hints]]
kind = "edge case"
text = "Erasing `app` when only `apple` is stored must return `false` and leave every count alone."

[solution]
explanation = "`pass` answers prefix counts and `end` answers exact counts, so every operation is O(L). Dropping a child whose `pass` falls to zero frees the branch, so memory tracks what's stored rather than everything ever inserted."
time = "O(L) per call"
space = "O(total letters stored × 26)"
