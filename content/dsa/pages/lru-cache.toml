intuition = """
You need two things in O(1): **find** an entry by key, and **move it to "most recently used"** or **drop the oldest**. A hash map finds entries but has no order; a list has an order but can't find. Combine them.

Use a hash map from key to node, and a **doubly linked list** ordered from least to most recently used. A node can be unlinked and re-added at the recent end in O(1) because it knows its neighbours. `get` moves the node to the recent end; `put` updates or adds there, and when over capacity removes the node at the old end (and its key from the map).

Python's `OrderedDict` is exactly this pair in one object.
"""
tips = [
    "`get` counts as a use: a successful `get` must move the entry to the most recent end.",
    "`put` on an existing key updates its value **and** refreshes it, and must not evict anything.",
    "Sentinel head and tail nodes remove every \"is the list empty / is this the first node\" case from the linking code.",
    "Store the **key** inside each list node, because when you evict the oldest node you must also delete its key from the map.",
]

[[approaches]]
name = "OrderedDict"
label = "ordered dict"
idea = "OrderedDict keeps insertion order and can move a key to the end or pop from the front in O(1)."
time = "O(1) per call"
space = "O(capacity)"
time_why = "An OrderedDict reads, moves to the end and pops from the front in constant time."
space_why = "At most capacity entries."
note = "The shortest correct answer; interviewers usually want the manual version too."
code = '''from collections import OrderedDict


class LRUCache:

    def __init__(self, capacity: int):
        self.capacity = capacity
        self.items = OrderedDict()

    def get(self, key: int) -> int:
        if key not in self.items:
            return -1
        self.items.move_to_end(key)
        return self.items[key]

    def put(self, key: int, value: int) -> None:
        self.items[key] = value
        self.items.move_to_end(key)
        if len(self.items) > self.capacity:
            self.items.popitem(last=False)
'''

[[approaches]]
name = "Hash map plus doubly linked list"
label = "linked list"
idea = "The map finds a node; the doubly linked list keeps use order, with the least recent next to the head sentinel."
time = "O(1) per call"
space = "O(capacity)"
time_why = "The hash map finds a node directly, and unlinking a node and putting it back at the front of a doubly linked list only changes a few pointers."
space_why = "At most capacity nodes, each stored in the map and in the list."
note = "What the problem is really testing."
code = '''class LRUCache:

    class Entry:
        def __init__(self, key: int = 0, value: int = 0):
            self.key = key
            self.value = value
            self.prev = None
            self.next = None

    def __init__(self, capacity: int):
        self.capacity = capacity
        self.entries = {}
        self.head = self.Entry()  # sentinel before the least recently used
        self.tail = self.Entry()  # sentinel after the most recently used
        self.head.next = self.tail
        self.tail.prev = self.head

    def _unlink(self, entry) -> None:
        entry.prev.next = entry.next
        entry.next.prev = entry.prev

    def _append(self, entry) -> None:
        last = self.tail.prev
        last.next = entry
        entry.prev = last
        entry.next = self.tail
        self.tail.prev = entry

    def get(self, key: int) -> int:
        entry = self.entries.get(key)
        if entry is None:
            return -1
        self._unlink(entry)
        self._append(entry)
        return entry.value

    def put(self, key: int, value: int) -> None:
        entry = self.entries.get(key)
        if entry is not None:
            entry.value = value
            self._unlink(entry)
            self._append(entry)
            return
        if len(self.entries) == self.capacity:
            oldest = self.head.next
            self._unlink(oldest)
            del self.entries[oldest.key]
        entry = self.Entry(key, value)
        self.entries[key] = entry
        self._append(entry)
'''
