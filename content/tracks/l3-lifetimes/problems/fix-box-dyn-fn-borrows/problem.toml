[[hints]]
kind = "rust"
text = "A trait object type always has a lifetime bound, and when you don't write one it's filled in: `Box<dyn Trait>` means `Box<dyn Trait + 'static>`. A closure that captures a `&'a` borrow isn't `'static`."

[[hints]]
kind = "rust"
text = "Say how long the object may live: `Box<dyn Fn(&str) -> bool + 'a>`, with `'a` tied to what it borrows. Inside a struct with a lifetime parameter, use that parameter."

[[hints]]
kind = "rust"
text = "Behind a reference the default is different: `&'r dyn Trait` means `&'r (dyn Trait + 'r)`. That's why `count_passing` accepts borrowing closures unchanged."

[solution]
explanation = "Every `dyn Trait` has an object lifetime bound: how long the erased value may be used, which limits what it may borrow. When omitted, it's defaulted from context: `Box<dyn Trait>` (and `Rc`, `Arc`, `Vec<Box<..>>`) default to `'static`; `&'r dyn Trait` and `&'r mut dyn Trait` default to `'r`; a type with a lifetime bound (`Ref<'a, dyn Trait>`, `struct S<'a, T: 'a + ?Sized>`) uses that. So a boxed closure capturing `allowed: &'a [&str]` needs `+ 'a` spelled out, and so does the field of `Checks<'a>` that `add` (already `+ 'a`) pushes into. `labels` returns boxed `&str`s pointing into `names`, so its objects are `+ '_`. A `&dyn Fn` parameter needed nothing: the reference's own lifetime is the default, so any closure that outlives the call fits.\n\nSyntax to remember: `fn make_filter<'a>(allowed: &'a [&str]) -> Box<dyn Fn(&str) -> bool + 'a>` · `Vec<Box<dyn Display + '_>>` · `&dyn Trait` = `&'r (dyn Trait + 'r)` · `Box<dyn Trait>` = `Box<dyn Trait + 'static>`."
time = "O(k) per check"
space = "O(checks)"

[rules]
forbid_methods = ["to_owned", "leak", "clone", "cloned"]
max_changed_lines = 4
