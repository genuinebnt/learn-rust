slug = "subsets-ii"
title = "Subsets II"
mode = "write"
level = "medium"
stage = "choices-grids"
order = 10
status = "ready"
tags = ["backtracking", "duplicates", "sort"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "Sort first so equal values sit together.",
  "At one depth, only the first of a run of equal values may start a branch: that removes duplicates without a set.",
]
constraints = ["0 ≤ nums.len() ≤ 26", "-10 ≤ nums[i] ≤ 10", "the answer has at most 10⁵ subsets"]
follow_up = "Count the distinct subsets without listing them. What does each run of equal values contribute?"
related = ["D12", "S4"]

[[examples]]
input = "nums = [1, 2, 2]"
output = "[[], [1], [1, 2], [1, 2, 2], [2], [2, 2]]"

[[examples]]
input = "nums = [0]"
output = "[[], [0]]"

[[hints]]
kind = "approach"
text = "Sort, then build subsets by choosing the next index in increasing order. At each depth, skip a value equal to the one just before it in the loop."

[[hints]]
kind = "rust"
text = "The skip is `if i > start && nums[i] == nums[i - 1] { continue; }`: `i > start`, not `i > 0`."

[[hints]]
kind = "edge case"
text = "Generating all 2ⁿ subsets and deduplicating with a set is far too slow for `[5; 26]`, which has only 27 answers."

[solution]
explanation = "After sorting, a run of equal values only matters by how many of them you take. Letting only the first of a run start a branch at each depth builds each count once, so the work is proportional to the answer."
time = "O(n · answer)"
space = "O(n) besides the output"
