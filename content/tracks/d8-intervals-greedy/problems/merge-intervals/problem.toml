slug = "merge-intervals"
title = "Merge intervals"
mode = "write"
level = "medium"
stage = "intervals"
order = 7
status = "ready"
tags = ["intervals", "sorting", "Blind 75"]
companies = ["Meta", "Apple", "Amazon", "Google", "Microsoft", "Bloomberg"]
teaches = [
  "Sort tuples, then fold into the output with `last_mut()`.",
  "A match guard `Some(last) if start <= last.1` merges in place.",
]
constraints = ["0 ≤ intervals.len() ≤ 2·10⁵", "start ≤ end, both any i32"]
follow_up = "How would you merge intervals arriving one at a time from a stream, keeping the merged set queryable? (Think `BTreeMap`.)"
related = ["S3", "S4"]

[[examples]]
input = "intervals = [(1, 3), (2, 6), (8, 10), (15, 18)]"
output = "[(1, 6), (8, 10), (15, 18)]"

[[examples]]
input = "intervals = [(1, 4), (4, 5)]"
output = "[(1, 5)]"

[[hints]]
kind = "approach"
text = "Sort by start. Each interval either overlaps the last merged one (extend it) or starts a new one."

[[hints]]
kind = "rust"
text = "`match out.last_mut() { Some(last) if start <= last.1 => last.1 = last.1.max(end), _ => out.push((start, end)) }`"

[[hints]]
kind = "edge case"
text = "Take the max of the ends: an interval can sit entirely inside the last merged one."

[solution]
explanation = "After sorting by start, an interval can only overlap the most recent merged interval, so one pass with `last_mut()` merges everything."
time = "O(n log n)"
space = "O(n)"
