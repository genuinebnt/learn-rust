slug = "longest-common-subsequence"
title = "Longest common subsequence"
mode = "write"
level = "medium"
stage = "strings"
order = 24
status = "ready"
tags = ["2-D DP", "as_bytes", "Blind 75"]
companies = ["Amazon", "Google", "Meta", "Microsoft", "Apple", "Bloomberg"]
teaches = [
  "The classic two-string table: `dp[i][j]` answers the question for `a[..i]` and `b[..j]`.",
  "Two rows and `std::mem::swap` instead of the full table.",
]
constraints = ["0 ≤ a.len(), b.len() ≤ 2000", "a and b are ASCII lowercase letters"]
follow_up = "How would you recover the subsequence itself, and how much of the table do you need for that?"
related = ["S2", "D2"]

[[examples]]
input = "a = \"abcde\", b = \"ace\""
output = "3 (\"ace\")"

[[hints]]
kind = "approach"
text = "dp[i][j] = dp[i - 1][j - 1] + 1 if a[i - 1] == b[j - 1], else max(dp[i - 1][j], dp[i][j - 1])."

[[hints]]
kind = "rust"
text = "Index `a.as_bytes()` and `b.as_bytes()`. Keep two rows of length b.len() + 1 and `std::mem::swap` them after each character of `a`."

[[hints]]
kind = "edge case"
text = "Matching each character of `a` to its first occurrence in `b` is greedy and misses better pairings: \"xab\" and \"abx\" share \"ab\"."

[solution]
explanation = "If the last characters match they end the LCS together; otherwise one of them isn't in it, so drop either and take the better. Only the previous row is needed."
time = "O(n × m)"
space = "O(m)"
