slug = "impl-trait-arguments"
title = "impl Trait in argument and return position"
mode = "fix"
level = "easy"
stage = "define-implement"
order = 5
status = "ready"
tags = ["impl Trait", "IntoIterator", "AsRef", "Box<dyn Iterator>"]
teaches = [
  "`impl Trait` arguments: caller-chosen generic.",
  "`impl Trait` returns: one callee-chosen type; list every trait callers need.",
  "Different types per branch → `Box<dyn Trait + '_>`.",
]
follow_up = "Why can't a caller write `compose::<SomeType, _>(...)` with `impl Trait` arguments, and when does that matter?"
