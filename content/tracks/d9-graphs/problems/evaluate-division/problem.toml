slug = "evaluate-division"
title = "Evaluate division"
mode = "write"
level = "medium"
stage = "bfs-patterns"
order = 22
status = "ready"
tags = ["weighted union-find", "HashMap<&str, usize>"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg", "Uber"]
teaches = [
  "Interning names into indices once, then working with `usize`s.",
  "Union-find that carries a ratio to the parent.",
]
constraints = ["equations.len() ≤ 2·10⁴", "queries.len() ≤ 2·10⁴", "values > 0"]
follow_up = "What should happen if two equations contradict each other, and how would you detect it?"

[[examples]]
input = "equations = [(\"a\",\"b\"), (\"b\",\"c\")], values = [2.0, 3.0], queries = [(\"a\",\"c\"), (\"b\",\"a\"), (\"a\",\"e\"), (\"a\",\"a\"), (\"x\",\"x\")]"
output = "[Some(6.0), Some(0.5), None, Some(1.0), None]"

[[hints]]
kind = "approach"
text = "Variables are nodes; `a / b = v` is an edge a → b of weight v and b → a of weight 1/v. A query multiplies weights along a path."

[[hints]]
kind = "approach"
text = "Searching per query repeats work. Union-find can store, for each node, its ratio to its parent, so a query is two finds."

[[hints]]
kind = "edge case"
text = "A name that never appears in an equation has no value, even divided by itself."

[solution]
explanation = "With path compression each node ends up storing its ratio to the root, so `c / d` is `(c / root) / (d / root)`. Interning names once keeps the hot loop on `usize`s."
time = "O((E + Q) α(V)) plus hashing"
space = "O(V)"
