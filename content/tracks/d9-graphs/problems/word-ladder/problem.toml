slug = "word-ladder"
title = "Word ladder"
mode = "write"
level = "hard"
stage = "bfs-patterns"
order = 23
status = "ready"
tags = ["BFS", "HashSet<&[u8]>"]
companies = ["Meta", "Amazon", "Google", "Microsoft", "Bloomberg", "LinkedIn", "Uber"]
teaches = [
  "BFS over implicit neighbours.",
  "Removing from the set as you enqueue, instead of a separate `seen`.",
]
constraints = ["1 ≤ word length ≤ 10", "words.len() ≤ 2·10⁵"]
follow_up = "How would bidirectional BFS change the running time?"
related = ["S2", "S4"]

[[examples]]
input = "begin = \"hit\", end = \"cog\", words = [\"hot\",\"dot\",\"dog\",\"lot\",\"log\",\"cog\"]"
output = "5  (hit → hot → dot → dog → cog)"

[[hints]]
kind = "approach"
text = "Words are nodes; two words are adjacent if they differ in one letter. BFS finds the shortest sequence."

[[hints]]
kind = "approach"
text = "Instead of comparing every pair of words, try all 26 letters at each position and look the result up."

[[hints]]
kind = "rust"
text = "A `HashSet<&[u8]>` borrows the input words; `remove` doubles as the visited check."

[solution]
explanation = "Removing a word when it's enqueued means it's never enqueued twice. Generating neighbours costs 26·L lookups per word instead of comparing against every word."
time = "O(N · L · 26)"
space = "O(N · L)"
