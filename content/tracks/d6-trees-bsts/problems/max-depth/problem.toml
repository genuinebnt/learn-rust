slug = "max-depth"
title = "Maximum depth of binary tree"
mode = "write"
level = "easy"
stage = "basics"
order = 1
status = "ready"
tags = ["recursion", "Rc<RefCell>", "Blind 75"]
companies = ["Amazon", "Google", "Microsoft", "Apple", "LinkedIn"]
teaches = [
  "The base-case-plus-recursive-call shape of tree code.",
  "`Rc::clone` is a pointer copy; `borrow()` reads through the `RefCell`.",
]
constraints = ["0 ≤ nodes ≤ 2·10⁵", "height ≤ 10⁵ (the tests give deep trees enough stack)"]
follow_up = "Write it iteratively with a `VecDeque`, counting levels. Which version handles a 10⁶-node path?"
related = ["S7", "D9"]

[[examples]]
input = "root = [3,9,20,null,null,15,7]"
output = "3"

[[hints]]
kind = "approach"
text = "The depth of a tree is 1 plus the larger depth of its two subtrees; an empty tree is 0."

[[hints]]
kind = "rust"
text = "`node.borrow()` gives a `Ref<TreeNode>`; `n.left.clone()` copies the `Rc` pointer (not the subtree) so you can recurse."

[[hints]]
kind = "edge"
text = "`None` is the base case, so a leaf gets `1 + max(0, 0) = 1` without a special case."

[solution]
explanation = "Each call handles one node and trusts the recursive calls for its subtrees. Cloning an `Rc` bumps a counter; it never copies the tree."
time = "O(n)"
space = "O(h) for the recursion, h = height"
