code = "1f"
title = "Buffer pool manager"
summary = "Frames, a page table, pin counts, eviction through your replacer, write-back of dirty pages, flush and delete: the cache between the database and the disk. BusTub Project 1, the buffer pool (textbook interface)."
lectures = ["bufferpool", "storage1"]
bustub = ["src/include/buffer/buffer_pool_manager.h", "src/buffer/buffer_pool_manager.cpp", "test/buffer/buffer_pool_manager_test.cpp"]

